<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DENİZ & HASAN BESİ">
<title>🐑 DENİZ & HASAN BESİ — Küçükbaş Muhasebe ve Sürü Yönetimi</title>
<style>
/* ==========================================================================
   DENİZ & HASAN BESİ — TEMEL, İŞLEVSEL VE MODERN ARAYÜZ TASARIM SİSTEMİ
   ========================================================================== */
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --card-sub: #f8fafc;
  --card-glow: rgba(16, 185, 129, 0.10);
  --tx: #0f172a;
  --tx-sec: #334155;
  --mut: #64748b;
  --ln: #e2e8f0;o
  
  --primary: #10b981;
  --primary-hover: #059669;
  --primary-light: #d1fae5;
  --primary-tx: #065f46;
  --g: #10b981;
  --g-light: #d1fae5;
  --r: #ef4444;
  --r-light: #fee2e2;
  --b: #3b82f6;
  --b-light: #dbeafe;
  --amber: #f59e0b;
  --amber-light: #fef3c7;
  --purple: #8b5cf6;
  --purple-light: #ede9fe;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 32px;
  --shadow: 0 2px 10px -2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 10px 24px -4px rgba(15, 23, 42, 0.09), 0 4px 8px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 36px -6px rgba(15, 23, 42, 0.14);
  --island-hover: translateY(-3px);
}

[data-theme="dark"] {
  --bg: #0b1120;
  --card: #111827;
  --card-sub: #1e293b;
  --card-glow: rgba(16, 185, 129, 0.18);
  --tx: #f8fafc;
  --tx-sec: #cbd5e1;
  --mut: #94a3b8;
  --ln: #1f293d;
  --primary: #10b981;
  --primary-hover: #059669;
  --primary-light: rgba(16, 185, 129, 0.18);
  --primary-tx: #6ee7b7;
  --g: #34d399;
  --g-light: rgba(16, 185, 129, 0.16);
  --r: #f87171;
  --r-light: rgba(239, 68, 68, 0.16);
  --b: #60a5fa;
  --b-light: rgba(59, 130, 246, 0.16);
  --amber: #fbbf24;
  --amber-light: rgba(245, 158, 11, 0.16);
  --purple: #a78bfa;
  --purple-light: rgba(139, 92, 246, 0.16);
  --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.48);
  --shadow-lg: 0 20px 42px rgba(0, 0, 0, 0.65);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; min-height: 100vh;
  background: var(--bg); color: var(--tx);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* APP LAYOUT */
#app { display: flex; flex-direction: column; min-height: 100vh; }

/* TOP APP BAR */
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: var(--card); border-bottom: 1px solid var(--ln);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
.header-top {
  height: 58px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; max-width: 1080px; width: 100%; margin: 0 auto;
}
.brand-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--card-sub); border: 1px solid var(--ln);
  padding: 6px 13px; border-radius: var(--radius-pill);
  font-weight: 800; font-size: 14px; color: var(--tx);
  cursor: pointer; transition: all 0.2s;
}
.brand-pill:hover { border-color: var(--primary); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g); box-shadow: 0 0 6px var(--g); }

.header-actions { display: flex; align-items: center; gap: 6px; }

.nav-pills-bar { display: none !important; }

/* MAIN CONTENT */
.main-content {
  flex: 1; max-width: 1080px; width: 100%; margin: 0 auto;
  padding: 16px 14px 90px;
}

/* BUTTONS */
button, input, select, textarea { font: inherit; color: var(--tx); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 700; font-size: 13px;
  border: 1px solid transparent; cursor: pointer; transition: all 0.15s ease;
  text-decoration: none;
}
.btn:hover { filter: brightness(0.96); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--primary); color: #ffffff; box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25); }
.btn-secondary { background: var(--card-sub); border-color: var(--ln); color: var(--tx); }
.btn-secondary:hover { border-color: var(--primary); }
.btn-danger { background: var(--r); color: #ffffff; }
.btn-outline-danger { background: transparent; border-color: var(--r); color: var(--r); }
.btn-outline-primary { background: transparent; border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.btn-icon {
  width: 36px; height: 36px; padding: 0; border-radius: 10px;
  background: var(--card-sub); border: 1px solid var(--ln); color: var(--tx);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; transition: all 0.15s;
}
.btn-icon:hover { border-color: var(--primary); transform: translateY(-1px); }

/* FORM CONTROLS */
label { display: block; font-size: 12px; font-weight: 700; color: var(--tx-sec); margin-bottom: 4px; margin-top: 8px; }
label:first-child { margin-top: 0; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--ln); background: var(--card); color: var(--tx);
  font-size: 13.5px; transition: border-color 0.15s, box-shadow 0.15s; outline: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light);
}
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 8px; }

/* MODERN CARDS & SURFACES */
.card {
  background: var(--card); border: 1px solid var(--ln);
  border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 15.5px; font-weight: 800; margin: 0 0 12px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}

/* INTERACTIVE ISLAND WIDGET CARDS (ANA EKRAN ADALARI) */
.island-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
@media (max-width: 520px) {
  .island-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}
.island-card {
  background: var(--card); border: 1px solid var(--ln);
  border-radius: var(--radius); padding: 15px 16px;
  position: relative; overflow: hidden; cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between;
}
.island-card:hover {
  transform: var(--island-hover);
  box-shadow: var(--shadow-md);
  border-color: var(--primary);
}
.island-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
.island-green::before { background: var(--g); }
.island-red::before { background: var(--r); }
.island-blue::before { background: var(--b); }
.island-amber::before { background: var(--amber); }
.island-purple::before { background: var(--purple); }

.island-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.island-icon { font-size: 19px; }
.island-label { font-size: 11px; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: 0.4px; }
.island-val { font-size: 20px; font-weight: 800; color: var(--tx); margin: 4px 0 3px; font-variant-numeric: tabular-nums; }
.island-sub { font-size: 11.5px; color: var(--mut); line-height: 1.35; }
.island-action-hint { font-size: 11px; font-weight: 700; color: var(--primary); margin-top: 8px; display: inline-flex; align-items: center; gap: 3px; }

/* KPI GRID FOR RATION, REPRODUCTION, QURBAN & FEEDS */
.kpi-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
.kpi-card {
  background: var(--card-sub); border: 1px solid var(--ln);
  border-radius: var(--radius-sm); padding: 14px;
  position: relative; overflow: hidden;
}
.kpi-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
.kpi-green::before { background: var(--g); }
.kpi-red::before { background: var(--r); }
.kpi-blue::before { background: var(--b); }
.kpi-amber::before { background: var(--amber); }
.kpi-purple::before { background: var(--purple); }
.kpi-label { font-size: 11px; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: 0.3px; }
.kpi-val { font-size: 19px; font-weight: 800; margin: 4px 0 2px; }
.kpi-sub { font-size: 11.5px; color: var(--mut); }

/* LIST ITEMS & ALERTS */
.list-item {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
}
.list-content { flex: 1; min-width: 200px; }
.list-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

.alert {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--ln); background: var(--card-sub);
  font-size: 12.5px;
}
.alert-warning { border-left: 4px solid var(--amber); background: var(--amber-light); color: var(--tx); }
.alert-danger { border-left: 4px solid var(--r); background: var(--r-light); color: var(--tx); }
.alert-info { border-left: 4px solid var(--b); background: var(--b-light); color: var(--tx); }

/* BADGES & CHIPS */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; line-height: 1.4; }
.badge-g { background: var(--g-light); color: var(--g); }
.badge-r { background: var(--r-light); color: var(--r); }
.badge-b { background: var(--b-light); color: var(--b); }
.badge-amber { background: var(--amber-light); color: var(--amber); }
.badge-purple { background: var(--purple-light); color: var(--purple); }
.badge-mut { background: var(--card-sub); color: var(--mut); border: 1px solid var(--ln); }

.tx-green { color: var(--g); }
.tx-red { color: var(--r); }
.tx-blue { color: var(--b); }
.tx-amber { color: var(--amber); }
.tx-purple { color: var(--purple); }

/* SCORECARD & BENCHMARK GAUGE */
.scorecard-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--card-sub); border: 1px solid var(--ln);
  margin-bottom: 8px; gap: 10px; flex-wrap: wrap;
}

/* STICKY BULK ACTION BAR */
.bulk-bar {
  position: fixed; bottom: 68px !important; left: 50%; transform: translateX(-50%);
  z-index: 45; background: var(--card); border: 2px solid var(--primary);
  border-radius: var(--radius-pill); box-shadow: var(--shadow-lg);
  padding: 8px 16px; display: none; align-items: center; gap: 8px;
  flex-wrap: wrap; max-width: 95vw;
}
.bulk-bar.visible { display: flex; }

/* DOCKED BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 35;
  background: var(--card); border-top: 1px solid var(--ln);
  height: 60px; display: flex; align-items: center; justify-content: space-around;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
  padding: 0 6px;
}
@media (min-width: 800px) {
  .bottom-nav {
    max-width: 640px;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    border-radius: 18px 18px 0 0;
    border-left: 1px solid var(--ln);
    border-right: 1px solid var(--ln);
  }
}
.bnav-item {
  flex: 1; height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  color: var(--mut); font-size: 11px; font-weight: 700;
  cursor: pointer; border: 0; background: transparent; padding: 0;
  transition: color 0.15s, transform 0.15s;
}
.bnav-item:hover { color: var(--primary); }
.bnav-item.active { color: var(--primary); }
.bnav-item span.icon { font-size: 19px; line-height: 1.1; }

/* FLOATING ACTION BUTTON (+) AT BOTTOM RIGHT */
.fab-btn {
  position: fixed;
  right: 16px;
  bottom: 72px;
  z-index: 95;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), #059669);
  color: #ffffff;
  border: 2px solid rgba(255,255,255,0.3);
  box-shadow: 0 8px 22px rgba(16, 185, 129, 0.40), 0 2px 6px rgba(0,0,0,0.18);
  font-size: 30px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
  user-select: none;
}
.fab-btn:hover { transform: scale(1.06); }
.fab-btn:active { transform: scale(0.95); }
.fab-btn.open {
  background: var(--r);
  transform: rotate(135deg);
  box-shadow: 0 8px 22px rgba(239, 68, 68, 0.45);
}

.fab-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 90;
  display: none;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 16px 16px 80px;
  overflow-y: auto;
}
.fab-overlay.open {
  display: flex;
  animation: fabFadeIn 0.18s ease-out;
}
@keyframes fabFadeIn {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.fab-menu-container {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: auto;
}

.fab-modules-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--ln);
  border-radius: 18px;
  padding: 12px;
  box-shadow: var(--shadow-lg);
}
.fab-mod-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 4px;
  padding: 11px 6px;
  border-radius: 12px;
  background: var(--card-sub);
  border: 1px solid var(--ln);
  color: var(--tx);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
}
.fab-mod-btn:hover { border-color: var(--primary); transform: translateY(-1px); }
.fab-mod-btn.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}
.fab-mod-btn .mod-icon { font-size: 20px; }
.fab-mod-btn .mod-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 8px;
  background: var(--primary-light);
  color: var(--primary-tx);
  font-weight: 800;
}

/* MODALS */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65);
  z-index: 60; display: none; align-items: center; justify-content: center;
  padding: 12px; backdrop-filter: blur(4px);
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--ln);
  border-radius: var(--radius); width: 100%; max-width: 640px;
  max-height: 90vh; overflow-y: auto; padding: 20px;
  box-shadow: var(--shadow-lg);
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--ln);
}
.modal-title { font-size: 16px; font-weight: 800; margin: 0; }
.close-modal { background: transparent; border: 0; font-size: 20px; color: var(--mut); cursor: pointer; padding: 0 6px; }

/* STATUS BAR */
#st {
  font-size: 12px; color: var(--tx-sec); padding: 7px 14px;
  background: var(--card); border-radius: var(--radius-sm);
  margin-bottom: 12px; border: 1px solid var(--ln);
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: space-between;
}

/* TABLE STYLES */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 9px 10px; font-weight: 700; color: var(--mut); border-bottom: 2px solid var(--ln); white-space: nowrap; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.3px; }
td { padding: 9px 10px; border-bottom: 1px solid var(--ln); white-space: nowrap; }
tr:hover td { background: var(--card-sub); }
.text-right { text-align: right; }
.text-center { text-align: center; }

/* PRINT */
@media print {
  @page { size: A4 portrait; margin: 8mm 10mm; }
  .app-header, .bottom-nav, .bulk-bar, .no-print, button, .btn, .fab-btn, .fab-overlay, .close-modal {
    display: none !important;
  }
  body { background: #ffffff !important; color: #000000 !important; font-size: 12px; }
  .card { box-shadow: none !important; border: 1px solid #ccc !important; page-break-inside: avoid; break-inside: avoid; }
  .main-content { max-width: 100% !important; padding: 0 !important; }

  body.printing-modal #app > *:not(#modalBackdrop),
  body.printing-modal .app-header,
  body.printing-modal .main-content,
  body.printing-modal #st,
  body.printing-modal #main,
  body.printing-modal .bottom-nav,
  body.printing-modal .bulk-bar,
  body.printing-modal .fab-btn,
  body.printing-modal .fab-overlay {
    display: none !important; height: 0 !important; max-height: 0 !important; overflow: hidden !important; margin: 0 !important; padding: 0 !important;
  }
  body.printing-modal #modalBackdrop,
  #modalBackdrop.printing-active {
    position: static !important; inset: auto !important; display: block !important; background: transparent !important; padding: 0 !important; margin: 0 !important; width: 100% !important; height: auto !important; overflow: visible !important;
  }
  body.printing-modal .modal,
  #modalBackdrop.printing-active .modal {
    position: static !important; box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 auto !important; width: 100% !important; max-width: 100% !important; max-height: none !important; height: auto !important; background: transparent !important; color: #000000 !important; overflow: visible !important; page-break-inside: avoid !important; break-inside: avoid !important;
  }
  .butcher-report-card {
    border: 2px solid #15803d !important; background: #ffffff !important; color: #000000 !important; border-radius: 12px !important; padding: 16px !important; page-break-inside: avoid !important; break-inside: avoid !important; page-break-after: avoid !important;
  }
}

/* CAMERA HUD STYLES */
.camera-hud-container {
  position: relative; width: 100%; height: 520px; background: #000000;
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
}
.camera-video-wrap {
  position: relative; flex: 1; width: 100%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
#hudVideo { width: 100%; height: 100%; object-fit: cover; }
#hudCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hud-reticle-overlay {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.hud-reticle-box {
  width: 220px; height: 140px; border: 2px dashed #22c55e; border-radius: 12px;
  position: relative; box-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
  animation: hudPulse 2s infinite ease-in-out;
}
@keyframes hudPulse {
  0%, 100% { border-color: #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.4); }
  50% { border-color: #4ade80; box-shadow: 0 0 24px rgba(74, 222, 128, 0.7); }
}
.hud-reticle-box::before, .hud-reticle-box::after {
  content: ''; position: absolute; width: 14px; height: 14px; border: 3px solid #22c55e;
}
.hud-reticle-box::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.hud-reticle-box::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

.hud-top-bar {
  position: absolute; top: 10px; left: 10px; right: 10px;
  display: flex; justify-content: space-between; align-items: center; z-index: 10;
}
.hud-pill {
  background: rgba(0, 0, 0, 0.85); color: #fff; padding: 5px 10px;
  border-radius: 20px; font-size: 11.5px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(4px);
}
.hud-animal-card {
  position: absolute; bottom: 12px; left: 10px; right: 10px;
  background: rgba(0, 0, 0, 0.92); border: 1px solid rgba(34, 197, 94, 0.5);

.hud-confirm-card {

  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }

.animal-hub-actions-grid {
