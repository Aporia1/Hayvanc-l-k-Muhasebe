<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Koyun Muhasebe Pro">
<title>🐑 Koyun & Küçükbaş Muhasebe ve Sürü Yönetimi (Pro v3.0)</title>
<style>
/* CSS RESET & MODERN DESIGN TOKENS */
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-sub: #f1f5f9;
  --card-glow: rgba(21, 128, 61, 0.08);
  --tx: #0f172a;
  --tx-sec: #475569;
  --mut: #64748b;
  --ln: #e2e8f0;
  --primary: #15803d;
  --primary-hover: #166534;
  --primary-light: #dcfce7;
  --primary-tx: #14532d;
  --g: #16a34a;
  --g-light: #dcfce7;
  --r: #dc2626;
  --r-light: #fee2e2;
  --b: #2563eb;
  --b-light: #dbeafe;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --purple: #7c3aed;
  --purple-light: #f3e8ff;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 30px;
  --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md: 0 4px 10px -2px rgba(0,0,0,0.07);
  --shadow-lg: 0 12px 24px -4px rgba(0,0,0,0.1);
  --island-hover: translateY(-2px) scale(1.008);
}

[data-theme="dark"] {
  --bg: #090d16;
  --card: #131b2e;
  --card-sub: #0c1220;
  --card-glow: rgba(34, 197, 94, 0.12);
  --tx: #f8fafc;
  --tx-sec: #cbd5e1;
  --mut: #94a3b8;
  --ln: #243049;
  --primary: #22c55e;
  --primary-hover: #16a34a;
  --primary-light: #064e3b;
  --primary-tx: #bbf7d0;
  --g: #4ade80;
  --g-light: #064e3b;
  --r: #f87171;
  --r-light: #450a0a;
  --b: #60a5fa;
  --b-light: #172554;
  --amber: #fbbf24;
  --amber-light: #451a03;
  --purple: #c084fc;
  --purple-light: #3b0764;
  --shadow: 0 2px 6px rgba(0,0,0,0.4);
  --shadow-md: 0 6px 14px rgba(0,0,0,0.5);
  --shadow-lg: 0 16px 30px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--bg); color: var(--tx); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 14px; line-height: 1.5; }

/* APP LAYOUT */
#app { display: flex; flex-direction: column; min-height: 100vh; }

/* TOP APP BAR (NO BURGER - ULTRA MODERN BRAND BAR) */
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: var(--card); border-bottom: 1px solid var(--ln);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
.header-top {
  height: 54px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
}
.brand-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--card-sub); border: 1px solid var(--ln);
  padding: 6px 12px; border-radius: var(--radius-pill);
  font-weight: 700; font-size: 14px; color: var(--tx);
  cursor: pointer; transition: all 0.2s;
}
.brand-pill:hover { border-color: var(--primary); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g); box-shadow: 0 0 6px var(--g); }

.header-actions { display: flex; align-items: center; gap: 8px; }

/* HORIZONTAL SCROLLABLE PILL NAV BAR */
.nav-pills-bar {
  display: flex; align-items: center; gap: 6px;
  overflow-x: auto; padding: 8px 14px 10px;
  border-top: 1px solid var(--ln);
  background: var(--card);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.nav-pills-bar::-webkit-scrollbar { display: none; }

.nav-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius-pill);
  font-weight: 600; font-size: 12.5px;
  background: var(--card-sub); border: 1px solid var(--ln);
  color: var(--tx); white-space: nowrap; cursor: pointer;
  transition: all 0.15s ease;
}
.nav-pill:hover { border-color: var(--primary); transform: translateY(-1px); }
.nav-pill.active {
  background: var(--primary); color: #ffffff;
  border-color: var(--primary); box-shadow: 0 2px 8px rgba(21, 128, 61, 0.35);
}
.nav-pill .badge {
  font-size: 10px; padding: 1px 6px; border-radius: 10px;
  background: rgba(0,0,0,0.1);
}
.nav-pill.active .badge { background: rgba(255,255,255,0.25); color: #ffffff; }

/* MAIN CONTENT */
.main-content {
  flex: 1; max-width: 1020px; width: 100%; margin: 0 auto;
  padding: 16px 14px 165px;
}

/* BUTTONS */
button, input, select, textarea { font: inherit; color: var(--tx); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px;
  border: 1px solid transparent; cursor: pointer; transition: all 0.15s ease;
  text-decoration: none;
}
.btn:hover { filter: brightness(0.95); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--primary); color: #ffffff; }
.btn-secondary { background: var(--card-sub); border-color: var(--ln); color: var(--tx); }
.btn-danger { background: var(--r); color: #ffffff; }
.btn-outline-danger { background: transparent; border-color: var(--r); color: var(--r); }
.btn-outline-primary { background: transparent; border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 5px 9px; font-size: 12px; border-radius: 6px; }
.btn-icon {
  width: 36px; height: 36px; padding: 0; border-radius: 10px;
  background: var(--card-sub); border: 1px solid var(--ln); color: var(--tx);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; transition: all 0.15s;
}
.btn-icon:hover { border-color: var(--primary); }

/* FORM CONTROLS */
label { display: block; font-size: 12px; font-weight: 600; color: var(--tx-sec); margin-bottom: 4px; margin-top: 8px; }
label:first-child { margin-top: 0; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--ln); background: var(--card); color: var(--tx);
  font-size: 13.5px; transition: border-color 0.15s; outline: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light);
}
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 6px; }

/* MODERN CARDS & SURFACES */
.card {
  background: var(--card); border: 1px solid var(--ln);
  border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 15px; font-weight: 700; margin: 0 0 12px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;
}

/* INTERACTIVE ISLAND WIDGET CARDS (ANA EKRAN ADALARI) */
.island-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
.island-card {
  background: var(--card); border: 1px solid var(--ln);
  border-radius: var(--radius); padding: 14px;
  position: relative; overflow: hidden; cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between;
}
.island-card:hover {
  transform: var(--island-hover);
  box-shadow: var(--shadow-md);
  border-color: var(--primary);
}
.island-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
.island-green::before { background: var(--g); }
.island-red::before { background: var(--r); }
.island-blue::before { background: var(--b); }
.island-amber::before { background: var(--amber); }
.island-purple::before { background: var(--purple); }

.island-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.island-icon { font-size: 18px; }
.island-label { font-size: 11px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: 0.3px; }
.island-val { font-size: 18px; font-weight: 800; color: var(--tx); margin: 3px 0 2px; }
.island-sub { font-size: 11px; color: var(--mut); }
.island-action-hint { font-size: 10px; font-weight: 600; color: var(--primary); margin-top: 6px; display: inline-flex; align-items: center; gap: 3px; }

/* BADGES & CHIPS */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; line-height: 1.4; }
.badge-g { background: var(--g-light); color: var(--g); }
.badge-r { background: var(--r-light); color: var(--r); }
.badge-b { background: var(--b-light); color: var(--b); }
.badge-amber { background: var(--amber-light); color: var(--amber); }
.badge-purple { background: var(--purple-light); color: var(--purple); }
.badge-mut { background: var(--card-sub); color: var(--mut); border: 1px solid var(--ln); }

.tx-green { color: var(--g); }
.tx-red { color: var(--r); }
.tx-blue { color: var(--b); }
.tx-amber { color: var(--amber); }
.tx-purple { color: var(--purple); }

/* SCORECARD & BENCHMARK GAUGE */
.scorecard-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--card-sub); border: 1px solid var(--ln);
  margin-bottom: 8px; gap: 8px; flex-wrap: wrap;
}
.score-indicator {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%; font-size: 14px;
}

/* STICKY BULK ACTION BAR */
.bulk-bar {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
  z-index: 35; background: var(--card); border: 2px solid var(--primary);
  border-radius: var(--radius-pill); box-shadow: var(--shadow-lg);
  padding: 8px 16px; display: none; align-items: center; gap: 8px;
  flex-wrap: wrap; max-width: 95vw;
}
@media (min-width: 800px) { .bulk-bar { bottom: 24px; } }
.bulk-bar.visible { display: flex; }

/* MOBILE BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: var(--card); border-top: 1px solid var(--ln);
  height: 58px; display: flex; align-items: center; justify-content: space-around;
  box-shadow: 0 -1px 4px rgba(0,0,0,0.05);
}
@media (min-width: 800px) { .bottom-nav { display: none; } }
.bnav-item {
  flex: 1; height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  color: var(--mut); font-size: 10.5px; font-weight: 600;
  cursor: pointer; border: 0; background: transparent; padding: 0;
}
.bnav-item.active { color: var(--primary); }
.bnav-item span.icon { font-size: 18px; }

/* MODALS */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  z-index: 60; display: none; align-items: center; justify-content: center;
  padding: 12px; backdrop-filter: blur(4px);
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--ln);
  border-radius: var(--radius); width: 100%; max-width: 640px;
  max-height: 90vh; overflow-y: auto; padding: 20px;
  box-shadow: var(--shadow-lg);
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--ln);
}
.modal-title { font-size: 16px; font-weight: 800; margin: 0; }
.close-modal { background: transparent; border: 0; font-size: 20px; color: var(--mut); cursor: pointer; padding: 0 6px; }

/* STATUS BAR */
#st {
  font-size: 12px; color: var(--mut); padding: 6px 12px;
  background: var(--card-sub); border-radius: var(--radius-sm);
  margin-bottom: 12px; border: 1px solid var(--ln);
  display: flex; align-items: center; justify-content: space-between;
}

/* TABLE STYLES */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; font-weight: 600; color: var(--mut); border-bottom: 2px solid var(--ln); white-space: nowrap; font-size: 12px; }
td { padding: 8px 10px; border-bottom: 1px solid var(--ln); white-space: nowrap; }
tr:hover td { background: var(--card-sub); }
.text-right { text-align: right; }
.text-center { text-align: center; }


/* HIDE TOP PILLS BAR ON ALL SCREENS AS REQUESTED (USE BOTTOM-RIGHT FAB MENU) */
.nav-pills-bar { display: none !important; }

/* TUMBLR / WHATSAPP STYLE FLOATING ACTION BUTTON (FAB) & MENU */
.fab-btn {
  position: fixed;
  right: 16px;
  bottom: 74px;
  z-index: 95;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), #16a34a);
  color: #ffffff;
  border: 2px solid rgba(255,255,255,0.25);
  box-shadow: 0 8px 24px rgba(21, 128, 61, 0.45), 0 2px 6px rgba(0,0,0,0.2);
  font-size: 32px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, box-shadow 0.2s;
  user-select: none;
}
.fab-btn:hover { transform: scale(1.06); }
.fab-btn:active { transform: scale(0.95); }
.fab-btn.open {
  background: var(--r);
  transform: rotate(135deg);
  box-shadow: 0 8px 24px rgba(220, 38, 38, 0.5);
}

.fab-overlay {
  position: fixed;
  inset: 0;
  background: rgba(9, 13, 22, 0.76);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  z-index: 90;
  display: none;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  padding: 16px 16px 148px;
  overflow-y: auto;
}
.fab-overlay.open {
  display: flex;
  animation: fabFadeIn 0.18s ease-out;
}
@keyframes fabFadeIn {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.fab-menu-container {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: auto;
}

.fab-section-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: #cbd5e1;
  text-align: right;
  padding-right: 6px;
}

/* Tumblr / WhatsApp Speed Dial Bubbles */
.fab-quick-list {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.fab-quick-item {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  color: var(--tx);
  border: 1px solid var(--ln);
  padding: 8px 14px 8px 16px;
  border-radius: 30px;
  font-weight: 700;
  font-size: 13.5px;
  box-shadow: var(--shadow-lg);
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s;
}
.fab-quick-item:hover, .fab-quick-item:active {
  transform: translateX(-4px) scale(1.02);
  border-color: var(--primary);
}
.fab-quick-icon {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  color: #fff;
}

/* Thumb-Friendly Grid for All Modules inside FAB Menu */
.fab-modules-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--ln);
  border-radius: 18px;
  padding: 12px;
  box-shadow: var(--shadow-lg);
}
.fab-mod-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 4px;
  padding: 10px 6px;
  border-radius: 12px;
  background: var(--card-sub);
  border: 1px solid var(--ln);
  color: var(--tx);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
}
.fab-mod-btn.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}
.fab-mod-btn .mod-icon { font-size: 20px; }
.fab-mod-btn .mod-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 8px;
  background: var(--primary-light);
  color: var(--primary-tx);
  font-weight: 800;
}

/* Adjust Bottom Nav to leave room for the right-side FAB button */
.bottom-nav {
  position: fixed;
  bottom: 72px;
  left: 12px;
  right: 84px;
  z-index: 30;
  background: var(--card);
  border: 1px solid var(--ln);
  border-radius: 30px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  box-shadow: var(--shadow-lg);
  padding: 0 6px;
}
@media (min-width: 900px) {
  .bottom-nav {
    max-width: 500px;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: 100%;
  }
}

.bulk-bar {
  bottom: 138px !important;
}

/* PRINT */
@media print {
  .app-header, .bottom-nav, .bulk-bar, .no-print, button, .btn { display: none !important; }
  body { background: #fff !important; color: #000 !important; font-size: 12px; }
  .card { box-shadow: none !important; border: 1px solid #ccc !important; page-break-inside: avoid; }
  .main-content { max-width: 100% !important; padding: 0 !important; }
}

/* CAMERA HUD & FACTORY AUTOMATION STYLES */
.camera-hud-container {
  position: relative;
  width: 100%;
  height: 520px;
  background: #000000;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
}
.camera-video-wrap {
  position: relative;
  flex: 1;
  width: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
#hudVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#hudCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.hud-reticle-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.hud-reticle-box {
  width: 220px;
  height: 140px;
  border: 2px dashed #22c55e;
  border-radius: 12px;
  position: relative;
  box-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
  animation: hudPulse 2s infinite ease-in-out;
}
@keyframes hudPulse {
  0%, 100% { border-color: #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.4); }
  50% { border-color: #4ade80; box-shadow: 0 0 24px rgba(74, 222, 128, 0.7); }
}
.hud-reticle-box::before, .hud-reticle-box::after {
  content: ''; position: absolute; width: 14px; height: 14px; border: 3px solid #22c55e;
}
.hud-reticle-box::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.hud-reticle-box::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

.hud-top-bar {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}
.hud-pill {
  background: rgba(15, 23, 42, 0.85);
  color: #fff;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(4px);
}
.hud-animal-card {
  position: absolute;
  bottom: 12px;
  left: 10px;
  right: 10px;
  background: rgba(19, 27, 46, 0.92);
  border: 1px solid rgba(34, 197, 94, 0.5);
  border-radius: 14px;
  padding: 10px 12px;
  color: #fff;
  backdrop-filter: blur(6px);
  z-index: 10;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.hud-actions-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 8px;
}
.hud-action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 7px 4px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);

const p2 = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());

const parseDate = s => {
  if (!s) return null;
  const p = String(s).split('-').map(Number);
  if (p.length !== 3 || isNaN(p[0])) return null;
  return new Date(p[0], p[1] - 1, p[2]);
};

const daysBetween = (a, b) => {
  const da = parseDate(a), db = parseDate(b);
  if (!da || !db) return 0;
  return Math.round((db - da) / 864e5);
};

const addDays = (dStr, n) => {

};

// 1. OTOMATİK GÜNLÜK YEM TÜKETİMİ DÜŞÜM MOTORU (KULLANICININ İSTEDİĞİ ÇÖZÜM)
function checkAndDeductDailyFeeds() {
  const td = today();
  let totalDeducted = 0;
  let logs = [];

  (S.feeds || []).forEach(f => {
    if (!f.lastDeductDate) {
      f.lastDeductDate = td;
      return;
    }
    const daysPassed = daysBetween(f.lastDeductDate, td);
    if (daysPassed > 0 && f.dailyTotalKg > 0) {
      const deductAmt = Math.min(f.stockKg, Math.round(daysPassed * f.dailyTotalKg * 10) / 10);
      f.stockKg = Math.max(0, Math.round((f.stockKg - deductAmt) * 10) / 10);
      f.lastDeductDate = td;
      totalDeducted += deductAmt;
      logs.push(`${f.name}: ${daysPassed} gün için ${deductAmt} kg düşüldü (Kalan: ${f.stockKg} kg)`);
    }
  });

  if (totalDeducted > 0) {
    if (!S.feedLogs) S.feedLogs = [];
    S.feedLogs.unshift({
      id: Date.now(),
      d: td,
      note: `${logs.length} çeşit yemden toplam ${totalDeducted} kg günlük tüketim otomatik düşüldü.`,
      details: logs
    });
    save();
    setStatus(`Depodan ${totalDeducted} kg günlük yem otomatik düşüldü.`, "🌾 Stok Güncellendi");
  }
}

// 2. YEM BESİN ETİKETİ VE RASYON ANALİZ MOTORU (KULLANICININ İSTEDİĞİ KİLO ALMA ANALİZİ)
function computeRationAnalysis() {
  const activeFeeds = (S.feeds || []).filter(f => f.dailyTotalKg > 0);
  const totalKg = activeFeeds.reduce((s, f) => s + f.dailyTotalKg, 0);
  const headCount = S.a.filter(a => a.st === "sürüde").reduce((s, a) => s + (+a.n || 1), 0) || 1;
  const dailyIntakePerHead = totalKg > 0 ? (totalKg / headCount) : 0;

  if (totalKg === 0) {
    return {
      totalKg: 0,
      dailyIntakePerHead: 0,
      avgProtein: 0,
      avgEnergy: 0,
      avgCalcium: 0,
      avgPhosphorus: 0,
      caToPRatio: 0,
      roughagePct: 0,
      concentratePct: 0,
      dailyFeedCostPerHead: 0,
      predictedADG: 0,
      predictedMonthlyGain: 0,
      costPerKgGain: 0,
      urinaryStoneRisk: "Bilinmiyor",
      acidosisRisk: "Bilinmiyor"
    };
  }

  let totalProteinKg = 0;
  let totalEnergyMcal = 0;
  let totalCaKg = 0;
  let totalPKg = 0;
  let totalRoughageKg = 0;
  let totalFeedCost = 0;

  activeFeeds.forEach(f => {
    const kg = f.dailyTotalKg;
    totalProteinKg += (kg * ((f.protein || 0) / 100));
    totalEnergyMcal += (kg * (f.energy || 2.2));
    totalCaKg += (kg * ((f.calcium || 0) / 100));
    totalPKg += (kg * ((f.phosphorus || 0) / 100));
    if (f.isRoughage) totalRoughageKg += kg;
    totalFeedCost += (kg * (f.costPerKg || 0));
  });

  const avgProtein = (totalProteinKg / totalKg) * 100;
  const avgEnergy = totalEnergyMcal / totalKg;
  const avgCalcium = (totalCaKg / totalKg) * 100;
  const avgPhosphorus = (totalPKg / totalKg) * 100;
  const caToPRatio = avgPhosphorus > 0 ? (avgCalcium / avgPhosphorus) : (avgCalcium > 0 ? 5 : 1);
  const roughagePct = Math.round((totalRoughageKg / totalKg) * 100);
  const concentratePct = 100 - roughagePct;
  const dailyFeedCostPerHead = totalFeedCost / headCount;

  // NRC ve Küçükbaş Besleme Standartlarına Göre Canlı Ağırlık Artış Tahmini (ADG)
  const netEnergyGain = Math.max(0, avgEnergy - 1.7);
  let baseGain = netEnergyGain * 230; // g/gün

  let proteinFactor = 1.0;
  if (avgProtein < 12) proteinFactor = 0.65;
  else if (avgProtein < 14) proteinFactor = 0.85;
  else if (avgProtein >= 16 && avgProtein <= 18) proteinFactor = 1.15;
  else if (avgProtein > 18) proteinFactor = 1.10;

  let rumenFactor = roughagePct >= 15 ? 1.0 : (roughagePct >= 10 ? 0.88 : 0.75);

  let predictedADG = Math.round(baseGain * proteinFactor * rumenFactor);
  predictedADG = Math.max(90, Math.min(420, predictedADG));

  const predictedMonthlyGain = Math.round((predictedADG * 30) / 100) / 10;
  const costPerKgGain = predictedADG > 0 ? Math.round(((dailyFeedCostPerHead * 1000) / predictedADG) * 10) / 10 : 0;

  let urinaryStoneRisk = "Düşük (İdeal)";
  if (caToPRatio < 1.6) urinaryStoneRisk = "YÜKSEK RİSK (Mermer Tozu Şart!)";
  else if (caToPRatio < 1.9) urinaryStoneRisk = "Orta Risk (Kalsiyum Artırılmalı)";

  let acidosisRisk = "Düşük (Dengeli)";
  if (roughagePct < 15) acidosisRisk = "YÜKSEK RİSK (Kaba Yem Yetersiz!)";
  else if (roughagePct < 22) acidosisRisk = "Orta Risk (Dikkat Edilmeli)";

  return {
    totalKg,
    dailyIntakePerHead: Math.round(dailyIntakePerHead * 100) / 100,
    avgProtein: Math.round(avgProtein * 10) / 10,
    avgEnergy: Math.round(avgEnergy * 100) / 100,
    avgCalcium: Math.round(avgCalcium * 100) / 100,
    avgPhosphorus: Math.round(avgPhosphorus * 100) / 100,
    caToPRatio: Math.round(caToPRatio * 10) / 10,
    roughagePct,
    concentratePct,
    dailyFeedCostPerHead,
    predictedADG,
    predictedMonthlyGain,
    costPerKgGain,
    urinaryStoneRisk,
    acidosisRisk
  };
}

// 3. ÇİFTLİK GENEL DURUM KARNESİ: "MEVCUT DURUM VS. OLMASI GEREKEN DURUM"
function computeFarmScorecard() {
  const costs = computeCosts();
  const ration = computeRationAnalysis();
  const activeAnimals = S.a.filter(a => a.st === "sürüde");
  const totalHead = costs.totalActiveHeadCount || 1;

  let totalDailyGain = 0;
  let gainCount = 0;
  S.a.forEach(a => {
    const c = costs.costMap[a.id];
    if (c && c.dailyWeightGain > 0) {
      totalDailyGain += c.dailyWeightGain;
      gainCount++;
    }
  });
  const actualADG = gainCount > 0 ? Math.round(totalDailyGain / gainCount) : ration.predictedADG;
  const targetADG = 300;
  const scoreADG = Math.min(100, Math.round((actualADG / targetADG) * 100));

  const actualFCR = actualADG > 0 ? Math.round(((ration.dailyIntakePerHead * 1000) / actualADG) * 10) / 10 : 5.0;
  const targetFCR = 4.5;
  const scoreFCR = actualFCR <= targetFCR ? 100 : Math.max(40, Math.round((targetFCR / actualFCR) * 100));

  const actualEtCost = ration.costPerKgGain || 70;
  const targetEtCost = 60;
  const scoreEtCost = actualEtCost <= targetEtCost ? 100 : Math.max(40, Math.round((targetEtCost / actualEtCost) * 100));

  const lambs = S.a.filter(a => (a.cat === "Kuzu" || a.origin === "Doğum") && a.b);
  const totalBorn = lambs.reduce((s, a) => s + (+a.n || 1), 0);
  const motherTags = new Set(lambs.map(a => a.m).filter(Boolean));
  const twinningRate = motherTags.size > 0 ? Math.round(((totalBorn - motherTags.size) / motherTags.size) * 100) : 25;
  const targetTwinning = 40;
  const scoreTwinning = Math.min(100, Math.round((twinningRate / targetTwinning) * 100));

  const deadCount = S.a.filter(a => a.st === "öldü").length;
  const totalAllLambs = Math.max(1, totalBorn);
  const survivalRate = Math.max(0, Math.min(100, Math.round(((totalAllLambs - deadCount) / totalAllLambs) * 100)));
  const targetSurvival = 95;
  const scoreSurvival = survivalRate >= targetSurvival ? 100 : Math.round((survivalRate / targetSurvival) * 100);

  const caRatio = ration.caToPRatio || 2.0;
  const targetCa = 2.1;
  const scoreCa = (caRatio >= 1.9 && caRatio <= 2.5) ? 100 : (caRatio >= 1.7 ? 75 : 40);

  const roughPct = ration.roughagePct;
  const scoreRough = (roughPct >= 20 && roughPct <= 35) ? 100 : (roughPct >= 15 ? 75 : 40);

  const totalTasks = S.t.length;
  const completedTasks = S.t.filter(t => t.x).length;
  const healthRate = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 90;
  const scoreHealth = healthRate;

  const dailyCost = costs.dailyOverheadRate || 24;
  const targetDailyCost = 24;
  const scoreDailyCost = dailyCost <= targetDailyCost ? 100 : Math.max(50, Math.round((targetDailyCost / dailyCost) * 100));

  const ewes = S.a.filter(a => a.s === "D" && a.st === "sürüde" && a.b);
  let totalMonths = 0;
  ewes.forEach(a => {
    totalMonths += (daysBetween(a.b, today()) / 30.4);
  });
  const avgAgeYears = ewes.length > 0 ? Math.round((totalMonths / ewes.length / 12) * 10) / 10 : 3.2;
  const scoreAge = (avgAgeYears >= 2 && avgAgeYears <= 5) ? 100 : 70;

  const overallScore = Math.round(
    scoreADG * 0.15 +
    scoreFCR * 0.12 +
    scoreEtCost * 0.12 +
    scoreTwinning * 0.10 +
    scoreSurvival * 0.12 +
    scoreCa * 0.10 +
    scoreRough * 0.08 +
    scoreHealth * 0.08 +
    scoreDailyCost * 0.08 +
    scoreAge * 0.05
  );

  return {
    overallScore,
    items: [
      { name: "Günlük Canlı Ağırlık Artışı (ADG)", current: `${actualADG} g/gün`, target: "280 - 350 g/gün", score: scoreADG, status: scoreADG >= 85 ? "Mükemmel" : (scoreADG >= 70 ? "Normal" : "Düşük"), note: scoreADG < 70 ? "Rasyondaki enerji ve protein oranı artırılmalıdır." : "Besi temposu hedeflenen aralıkta." },
      { name: "Yem Dönüşüm Oranı (FCR)", current: `${actualFCR} kg yem / kg et`, target: "4.2 - 5.0 kg yem / kg et", score: scoreFCR, status: scoreFCR >= 85 ? "Mükemmel" : "Geliştirilmeli", note: "1 kg canlı et artışı için tüketilen yem miktarı." },
      { name: "Et Üretim Yem Maliyeti", current: `${actualEtCost} ₺ / kg et`, target: "< 60.00 ₺ / kg et", score: scoreEtCost, status: scoreEtCost >= 85 ? "Ekonomik" : "Yüksek Maliyet", note: "Besi kârlılığını belirleyen ana faktördür." },
      { name: "İkizlik ve Döl Verim Oranı", current: `%${twinningRate}`, target: "%35 - %45", score: scoreTwinning, status: scoreTwinning >= 80 ? "Başarılı" : "Artırılmalı", note: "Koç katımı öncesi 3 hafta 'Flushing' beslemesi uygulayın." },
      { name: "Kuzu Yaşama Gücü (Hayatta Kalma)", current: `%${survivalRate}`, target: "> %95", score: scoreSurvival, status: scoreSurvival >= 90 ? "Yüksek" : "Kritik", note: "İlk 2 saatte kaliteli kolostrum (ağız sütü) hayati önemdedir." },
      { name: "Mermer Tozu & Kalsiyum:Fosfor", current: `${caRatio} : 1`, target: "2.0 : 1 - 2.5 : 1", score: scoreCa, status: scoreCa >= 90 ? "İdeal (Taş Riski Yok)" : "RİSKLİ (Sidik Zoru)", note: scoreCa < 90 ? "Acil rasyona %1-1.5 Mermer Tozu (Kalsiyum Karbonat) ilave edilmelidir!" : "İdrar yolu tıkanması önlenmiş durumdadır." },
      { name: "Kaba Yem : Kesif Yem Oranı", current: `%${roughPct} Kaba : %${ration.concentratePct} Kesif`, target: "%20 - %30 Kaba Yem", score: scoreRough, status: scoreRough >= 80 ? "Dengeli" : "Asidoz Riski!", note: "İşkembe ekşimesini ve topallığı önlemek için kaliteli yonca/ot şarttır." },
      { name: "Aşı & Sağlık Protokol Uyumu", current: `%${healthRate}`, target: "%100 Tam Koruma", score: scoreHealth, status: scoreHealth >= 90 ? "Eksiksiz" : "Geciken Aşı Var", note: "Enterotoksemi ve iç-dış parazit aksatılmamalıdır." },
      { name: "Günlük Baş Başı Bakım Masrafı", current: `${F2(dailyCost)}/baş/gün`, target: "20.00 - 25.00 ₺/baş/gün", score: scoreDailyCost, status: scoreDailyCost >= 80 ? "Dengeli" : "Yüksek Gider", note: "İşçilik, elektrik, su ve ortak amortisman payı." },
      { name: "Anaç Sürü Yaş Ortalaması", current: `${avgAgeYears} Yaş`, target: "2.5 - 4.5 Yaş", score: scoreAge, status: scoreAge >= 85 ? "Genç ve Üretken" : "Yaşlı Sürü (Iskarta Gerek)", note: "6 yaş üzeri dişiler damızlıktan çıkarılıp kasaba sevk edilmelidir." }
    ]
  };
}

// 4. MALİYET VE FİNANS MOTORU
function computeCosts() {
  const td = today();
  
  const generalOperatingExpenses = S.e
    .filter(x => kind(x.c) === 'gider' && x.c !== 'Hayvan alımı' && !x.an)
    .reduce((s, x) => s + (+x.a || 0), 0);

  const firstTx = S.e.map(x => x.d).filter(Boolean).sort()[0] || td;

  let totalHerdAnimalDays = 0;
  const animalDaysMap = {};

  S.a.forEach(a => {
    const n = Math.max(1, +a.n || 1);
    const entryDate = a.bd || a.b || firstTx;
    const exitDate = a.st === 'sürüde' ? td : (a.sd || td);
    const d = Math.max(1, daysBetween(entryDate, exitDate));
    animalDaysMap[a.id] = d;
    totalHerdAnimalDays += d * n;
  });

  const dailyOverheadRate = totalHerdAnimalDays > 0 ? (generalOperatingExpenses / totalHerdAnimalDays) : 0;

  const costMap = {};
  let totalActiveBuyCost = 0;
  let totalActiveTotalCost = 0;
  let totalActiveHeadCount = 0;
  let totalActiveLiveWeight = 0;
  let activeWithWeightCount = 0;
  let activePurchasedCount = 0;

  const groupStats = {};
  (S.groups || []).forEach(g => {
    groupStats[g.id] = { count: 0, totalCost: 0, totalWeight: 0, weightCount: 0 };
  });

  S.a.forEach(a => {
    const n = Math.max(1, +a.n || 1);
    const daysInHerd = animalDaysMap[a.id] || 1;
    
    const directExpenses = S.e
      .filter(x => x.an == a.id && kind(x.c) === 'gider' && x.c !== 'Hayvan alımı')
      .reduce((s, x) => s + (+x.a || 0), 0);

    const directIncome = S.e
      .filter(x => x.an == a.id && kind(x.c) === 'gelir')
      .reduce((s, x) => s + (+x.a || 0), 0);

    let acqCost = 0;
    if (a.bp !== undefined && a.bp !== null && a.bp !== "" && +a.bp > 0) {
      acqCost = (+a.bp) * n;
    } else {
      const tiedBuy = S.e
        .filter(x => x.an == a.id && x.c === 'Hayvan alımı')
        .reduce((s, x) => s + (+x.a || 0), 0);
      acqCost = tiedBuy;
    }

    
    const isPastureMera = (a.location || 'Mera') === 'Mera';
    // Mera hayvanları yayladayken fabrika yemi tüketmez; sadece genel ortak giderleri (çoban, mera kirası, tuz) alır.
    const overheadShare = daysInHerd * n * (isPastureMera ? (dailyOverheadRate * 0.45) : dailyOverheadRate);

    const totalCost = acqCost + directExpenses + overheadShare;
    const costPerHead = n > 0 ? (totalCost / n) : totalCost;
    const buyPricePerHead = n > 0 ? (acqCost / n) : 0;
    const dailyCostPerHead = (daysInHerd > 0 && n > 0) ? (directExpenses + overheadShare) / (daysInHerd * n) : 0;

    const weights = (S.w || []).filter(w => w.an == a.id).sort((x, y) => x.d.localeCompare(y.d));
    const latestWeight = weights.length ? +weights[weights.length - 1].kg : 0;
    const dailyWeightGain = weights.length > 1
      ? ((latestWeight - (+weights[0].kg)) / Math.max(1, daysBetween(weights[0].d, weights[weights.length - 1].d)) * 1000)
      : 0;

    let marketVal = 0;
    if (latestWeight > 0 && S.fp > 0) {
      marketVal = latestWeight * S.fp * n;
    } else if (S.fp > 0 && buyPricePerHead > 0) {
      marketVal = acqCost * 1.15;
    }

    let profit = null;
    if (a.st !== 'sürüde') {
      const finalInc = a.sp ? +a.sp : directIncome;
      profit = finalInc > 0 ? (finalInc - totalCost) : (0 - totalCost);
    } else {
      profit = marketVal > 0 ? (marketVal - totalCost) : null;
    }

    costMap[a.id] = {
      days: daysInHerd,
      n,
      acqCost,
      buyPricePerHead,
      directExpenses,
      overheadShare,
      totalCost,
      costPerHead,
      dailyCostPerHead,
      directIncome,
      latestWeight,
      dailyWeightGain,
      marketVal,
      profit
    };

    if (a.st === 'sürüde') {
      totalActiveHeadCount += n;
      totalActiveTotalCost += totalCost;
      if (acqCost > 0) {
        totalActiveBuyCost += acqCost;
        activePurchasedCount += n;
      }
      if (latestWeight > 0) {
        totalActiveLiveWeight += latestWeight * n;
        activeWithWeightCount += n;
      }

      if (a.grp && Array.isArray(a.grp)) {
        a.grp.forEach(gId => {
          if (groupStats[gId]) {
            groupStats[gId].count += n;
            groupStats[gId].totalCost += totalCost;
            if (latestWeight > 0) {
              groupStats[gId].totalWeight += latestWeight * n;
              groupStats[gId].weightCount += n;
            }
          }
        });
      }
    }
  });

  const avgAcqCost = activePurchasedCount > 0 ? (totalActiveBuyCost / activePurchasedCount) : 0;
  const avgTotalCost = totalActiveHeadCount > 0 ? (totalActiveTotalCost / totalActiveHeadCount) : 0;
  const avgLiveWeight = activeWithWeightCount > 0 ? (totalActiveLiveWeight / activeWithWeightCount) : 0;
  const avgCostPerKg = totalActiveLiveWeight > 0 ? (totalActiveTotalCost / totalActiveLiveWeight) : 0;
  const flockEstimatedValue = (totalActiveLiveWeight * S.fp) + ((totalActiveHeadCount - activeWithWeightCount) * (avgTotalCost || 12000));
  const flockPotentialProfit = flockEstimatedValue - totalActiveTotalCost;

  return {
    costMap,
    groupStats,
    dailyOverheadRate,
    generalOperatingExpenses,
    totalHerdAnimalDays,
    totalActiveHeadCount,
    totalActiveBuyCost,
    activePurchasedCount,
    avgAcqCost,
    avgTotalCost,
    totalActiveLiveWeight,
    avgLiveWeight,
    avgCostPerKg,
    flockEstimatedValue,
    flockPotentialProfit
  };
}

function getFilteredEntries() {
  return S.e.filter(x => {
    const d = parseDate(x.d);
    if (!d) return true;
    if (FM && (d.getMonth() + 1) !== FM) return false;
    if (FY && d.getFullYear() !== FY) return false;
    if (ECAT !== "hepsi" && x.c !== ECAT) return false;
    if (ESEARCH) {
      const q = ESEARCH.toLowerCase();
      const matchDesc = (x.ds || "").toLowerCase().includes(q);
      const matchCat = (x.c || "").toLowerCase().includes(q);
      const animal = S.a.find(a => a.id == x.an);
      const matchAnimal = animal && (animal.k || "").toLowerCase().includes(q);
      if (!matchDesc && !matchCat && !matchAnimal) return false;
    }
    return true;
  }).sort((a, b) => b.d.localeCompare(a.d) || b.id - a.id);
}

function getEntryRemaining(x) {
  if (x.payMode !== "vadeli" || x.isSettled) return 0;
  return Math.max(0, (+x.a || 0) - (+x.paidAmount || 0));
}

function getEntryPaid(x) {
  if (x.payMode !== "vadeli" || x.isSettled) return (+x.a || 0);
  return Math.max(0, +x.paidAmount || 0);
}

function getFinancialStats(entries) {
  const gEntries = entries.filter(x => kind(x.c) === "gelir");
  const rEntries = entries.filter(x => kind(x.c) === "gider");
  const g = sum(gEntries);
  const r = sum(rEntries);
  const cashIn = gEntries.reduce((s, x) => s + getEntryPaid(x), 0);
  const cashOut = rEntries.reduce((s, x) => s + getEntryPaid(x), 0);
  const receivables = S.e.filter(x => kind(x.c) === "gelir" && x.payMode === "vadeli" && !x.isSettled)
    .reduce((s, x) => s + getEntryRemaining(x), 0);
  const payables = S.e.filter(x => kind(x.c) === "gider" && x.payMode === "vadeli" && !x.isSettled)
    .reduce((s, x) => s + getEntryRemaining(x), 0);
  return { g, r, net: g - r, cashIn, cashOut, cashNet: cashIn - cashOut, receivables, payables };
}

const getLoanBalance = () => 
  sum(S.e.filter(x => kind(x.c) === "kredi+")) - sum(S.e.filter(x => kind(x.c) === "kredi-"));

function ensureCariExists(name, defaultType = "Diğer") {
  const clean = String(name || "").trim();
  if (!clean) return null;
  if (!S.cariler) S.cariler = [];
  let found = S.cariler.find(c => c.name.toLowerCase() === clean.toLowerCase());
  if (!found) {
    found = { id: Date.now() + Math.floor(Math.random() * 1000), name: clean, type: defaultType, phone: "", note: "" };
    S.cariler.push(found);
  }
  return found;
}

function getCariDatalistHtml() {
  const list = S.cariler || [];
  return `<datalist id="cariDatalist">${list.map(c => `<option value="${E(c.name)}">${E(c.type || '')}</option>`).join("")}</datalist>`;
}

function ageMonthsToBirthDate(months) {
  const m = parseFloat(months);
  if (isNaN(m) || m < 0) return "";
  const d = new Date();
  d.setDate(d.getDate() - Math.round(m * 30.4375));
  return iso(d);
}

function birthDateToAgeMonths(bStr) {
  if (!bStr) return "";
  const days = daysBetween(bStr, today());
  if (days < 0) return 0;
  return Math.round((days / 30.4375) * 10) / 10;
}

function formatAgeReadable(bStr) {
  if (!bStr) return "Yaş girilmedi";
  const days = daysBetween(bStr, today());
  if (days < 0) return "0 gün";
  if (days < 60) return `${days} günlük`;
  const months = Math.round(days / 30.4375);
  if (months < 24) return `${months} aylık`;
  const yrs = Math.floor(months / 12);
  const remM = months % 12;
  return remM > 0 ? `${yrs} yaş ${remM} ay` : `${yrs} yaşında`;
}

function renderTrendSvgChart() {
  const d = new Date();
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
    months.push(dt.getFullYear() + "-" + p2(dt.getMonth() + 1));
  }

  const getMonthSum = (mStr, k) => S.e
    .filter(x => x.d && x.d.slice(0, 7) === mStr && kind(x.c) === k)
    .reduce((s, x) => s + (+x.a || 0), 0);

  const incData = months.map(m => getMonthSum(m, "gelir"));
  const expData = months.map(m => getMonthSum(m, "gider"));
  const maxVal = Math.max(1000, ...incData, ...expData);

  const w = 380, h = 130, paddingB = 24, paddingT = 10;
  const chartH = h - paddingB - paddingT;
  const colW = (w - 20) / 12;

  let bars = "";
  months.forEach((m, i) => {
    const x = 10 + i * colW;
    const hInc = (incData[i] / maxVal) * chartH;
    const hExp = (expData[i] / maxVal) * chartH;
    const yInc = paddingT + chartH - hInc;
    const yExp = paddingT + chartH - hExp;
    const barW = Math.max(3, colW * 0.35);

    bars += `
      <rect x="${x}" y="${yInc}" width="${barW}" height="${hInc}" rx="2" fill="var(--g)" opacity="0.9"/>
      <rect x="${x + barW + 1.5}" y="${yExp}" width="${barW}" height="${hExp}" rx="2" fill="var(--r)" opacity="0.9"/>
      <text x="${x + barW}" y="${h - 6}" font-size="8.5" text-anchor="middle" fill="var(--mut)">${m.slice(5)}</text>
    `;
  });

  return `
    <div style="width:100%; overflow-x:auto">
      <svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:320px; max-height:160px">
        <line x1="10" y1="${paddingT + chartH}" x2="${w - 10}" y2="${paddingT + chartH}" stroke="var(--ln)" stroke-width="1"/>
        ${bars}
      </svg>
    </div>
  `;
}

            </b>

      <div style="display:flex; flex-direction:column; gap:8px">

          <div class="scorecard-item">
            <div style="flex:2; min-width:200px">
              <div style="display:flex; align-items:center; gap:6px">
                <b>${item.name}</b>
                <span class="badge ${item.score >= 85 ? 'badge-g' : (item.score >= 70 ? 'badge-amber' : 'badge-r')}">${item.status}</span>
              </div>
              <div style="font-size:11.5px; color:var(--mut); margin-top:2px">${item.note}</div>
            </div>
            <div style="flex:1; min-width:120px; text-align:right">
              <div style="font-size:11px; color:var(--mut)">Mevcut Değer</div>
              <div style="font-size:14px; font-weight:800; color:var(--tx)">${item.current}</div>
            </div>
            <div style="flex:1; min-width:120px; text-align:right">
              <div style="font-size:11px; color:var(--mut)">Olması Gereken İdeal</div>

            <div style="width:50px; text-align:right">
              <span style="font-size:13px; font-weight:800" class="${item.score >= 85 ? 'tx-green' : (item.score >= 70 ? 'tx-amber' : 'tx-red')}">%${item.score}</span>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function viewFlock() {
  const cData = computeCosts();

    if (ACAT !== "hepsi" && (a.cat || "Koyun") !== ACAT) return false;

    if (ASEARCH) {
      const q = ASEARCH.toLowerCase();
      const matchK = (a.k || "").toLowerCase().includes(q);
      const matchM = (a.m || "").toLowerCase().includes(q);

          ["Merinos", "Anadolu Merinosu"], ["Morkaraman", "Morkaraman"], ["Kıvırcık", "Kıvırcık"],

        ${sel("animalOrigin", "Geliş Şekli", optList([["Satın Alma", "Satın Alma"], ["Doğum", "Çiftlikte Doğum"], ["Mevcut", "Mevcut Sürü"]], "Satın Alma"))}

                ` : (x.payMode === 'vadeli' && x.isSettled ? `<span class="badge badge-g">✅ VADESİ KAPANDI</span>` : `<span class="badge badge-mut">🟢 Peşin</span>`)}

              </div>

              <b style="font-size:15px" class="${kc(k)}">
                ${k === 'gelir' || k === 'kredi+' ? '+' : '−'}${F(x.a)}
              </b>
              <div style="display:flex; gap:4px; justify-content:flex-end; margin-top:4px; flex-wrap:wrap">
                ${isVadeliOpen ? `<button class="btn btn-primary btn-sm" onclick="settleVadeliEntry(${x.id})">✅ ${k === 'gelir' ? 'Tahsil Et' : 'Öde'}</button>` : ''}

                <button class="btn btn-outline-danger btn-sm" onclick="deleteLedgerEntry(${x.id})">Sil</button>
              </div>

function toggleGenericVadeliRow(rowId, val) {
  const el = document.getElementById(rowId);
  if (el) el.style.display = val === "vadeli" ? "grid" : "none";
}

function toggleEntryPayMode(mode) {
  const box = $("entryVadeliBox");
  if (box) box.style.display = mode === "vadeli" ? "block" : "none";
}

function onLedgerCategoryChange(catName) {
  const isCredit = (catName === "Kredi çekildi" || kind(catName) === "kredi+");
  const creditBox = $("creditLoanBox");
  if (creditBox) creditBox.style.display = isCredit ? "block" : "none";
  if (isCredit) calcCreditForm();
}

function onEntryAmountChange() {
  calcCreditForm();
}

function calcCreditForm() {
  const amt = +V("entryAmount") || 0;
  const rate = +V("clRate") || 0;
  const months = +V("clMonths") || 1;
  const r = rate / 1200;

  if (amt > 0 && months > 0) {
    const monthly = r ? (amt * r / (1 - Math.pow(1 + r, -months))) : (amt / months);
    const totalBack = monthly * months;
    const totalInt = totalBack - amt;
    const resEl = $("clCalcResult");
    if (resEl) {
      resEl.innerHTML = `
        <div>Aylık Taksit: <b class="tx-blue">${F(monthly)}</b></div>
        <div>Toplam Geri Ödeme: <b>${F(totalBack)}</b> · Toplam Faiz: <b class="tx-red">${F(totalInt)}</b></div>
      `;
    }
  }
}

function viewFeeds() {
  const feeds = S.feeds || [];

  let totalDailyCost = 0;
  let totalDailyKg = 0;
  feeds.forEach(f => {
    totalDailyCost += (f.dailyTotalKg || 0) * (f.costPerKg || 0);

  const dailyCostPerHead = totalDailyCost / headCount;

  return `
    <div class="card" style="border-top:4px solid var(--amber)">
      <div class="card-title">
        <span>📦 Yem Deposu & Stok Takibi</span>
        <div style="display:flex; gap:6px; flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="manualDeductTodayFeeds()">⚡ Bugünkü Tüketimi Şimdi Düş</button>

        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card kpi-amber">
          <div class="kpi-label">Günlük Sürü Tüketimi</div>
          <div class="kpi-val tx-amber">${N(totalDailyKg)} kg / gün</div>
          <div class="kpi-sub">Günlük Maliyet: ${F(totalDailyCost)}</div>
        </div>
        <div class="kpi-card kpi-blue">
          <div class="kpi-label">Baş Başına Günlük Yem</div>
          <div class="kpi-val tx-blue">${F2(dailyCostPerHead)}</div>
          <div class="kpi-sub">${headCount} baş hayvan için</div>
        </div>
        <div class="kpi-card kpi-green">
          <div class="kpi-label">Toplam Depo Değeri</div>
          <div class="kpi-val tx-green">${F(feeds.reduce((s, f) => s + (f.stockKg * f.costPerKg), 0))}</div>
          <div class="kpi-sub">${N(feeds.reduce((s, f) => s + f.stockKg, 0))} kg toplam stok</div>
        </div>
      </div>

      <!-- OTOMATİK DÜŞÜM BİLGİLENDİRMESİ -->
      <div style="background:var(--card-sub); border:1px solid var(--ln); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:12px; font-size:12px">
        💡 <b>Otomatik Günlük Düşüm Aktiftir:</b> Uygulama her gün açıldığında, dünden bugüne geçen gün sayısı kadar yem stoğu otomatik olarak depodan düşülür.
      </div>

      <!-- Depodaki Yemler Tablosu -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Yem Cinsi</th>
              <th class="text-right">Kalan Stok</th>
              <th class="text-right">Birim Fiyat</th>
              <th class="text-right">Günlük Tüketim</th>
              <th class="text-right">Kalan Gün</th>
              <th>Tür</th>
              <th class="text-right">İşlemler</th>
            </tr>
          </thead>
          <tbody>
            ${feeds.map(f => {
              const daysLeft = f.dailyTotalKg > 0 ? Math.round(f.stockKg / f.dailyTotalKg) : 999;
              const bagCount = f.bagKg > 0 ? Math.round(f.stockKg / f.bagKg) : 0;
              return `
                <tr>
                  <td><b>${E(f.name)}</b></td>
                  <td class="text-right">
                    <b>${N(f.stockKg)} kg</b>
                    ${bagCount ? `<div style="font-size:11px; color:var(--mut)">~${bagCount} çuval</div>` : ''}

                  <td><span class="badge ${f.isRoughage ? 'badge-amber' : 'badge-g'}">${f.isRoughage ? 'Kaba Yem' : 'Kesif Yem'}</span></td>
                  <td class="text-right">
                    <button class="btn btn-secondary btn-sm" onclick="openFeedRestockModal(${f.id})">Yem Al</button>
                    <button class="btn btn-secondary btn-sm" onclick="editFeedItem(${f.id})">Düzenle</button>
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteFeedItem(${f.id})">Sil</button>

          <div style="border-bottom:1px solid var(--ln); padding:8px 0; font-size:12px">
            <div style="display:flex; justify-content:space-between">
              <b>📅 ${l.d}</b>
              <span style="color:var(--primary); font-weight:700">Otomatik Düşüldü</span>
            </div>
            <div style="color:var(--tx-sec); margin-top:2px">${E(l.note)}</div>
            ${l.details ? `<div style="font-size:11px; color:var(--mut); margin-top:2px">${l.details.map(d => E(d)).join(" · ")}</div>` : ''}
          </div>
        `).join("") || '<div style="font-size:12px; color:var(--mut); padding:10px 0">Henüz düşüm logu kaydedilmedi.</div>'}
      </div>
    </div>
  `;
}

function manualDeductTodayFeeds() {
  let totalDeducted = 0;
  let logs = [];
  (S.feeds || []).forEach(f => {
    if (f.dailyTotalKg > 0) {
      const deductAmt = Math.min(f.stockKg, f.dailyTotalKg);
      f.stockKg = Math.max(0, Math.round((f.stockKg - deductAmt) * 10) / 10);
      f.lastDeductDate = today();
      totalDeducted += deductAmt;
      logs.push(`${f.name}: 1 günlük ${deductAmt} kg düşüldü (Kalan: ${f.stockKg} kg)`);
    }
  });

  if (totalDeducted > 0) {
    if (!S.feedLogs) S.feedLogs = [];
    S.feedLogs.unshift({
      id: Date.now(),
      d: today(),
      note: `Manuel olarak 1 günlük toplam ${totalDeducted} kg yem stoktan düşüldü.`,
      details: logs
    });
    mutate(() => {});
    alert(`Başarılı! Depodaki yemlerden 1 günlük toplam ${totalDeducted} kg yem düşüldü.`);
  } else {
    alert("Düşülecek günlük tüketim girilmemiş veya stoklar sıfır.");
  }
}

/* ==========================================================================
   GÖRÜNÜM 9: DOĞUM, GEBELİK & FLUSHING YÖNETİMİ
   ========================================================================== */

function viewReproduction() {
  const td = today();
  const pregnantSheep = S.a.filter(a => a.ins && a.st === "sürüde").map(a => {
    const expDate = addDays(a.ins, 150);
    const passedDays = daysBetween(a.ins, td);
    const remDays = daysBetween(td, expDate);
    const pct = Math.min(100, Math.max(0, Math.round((passedDays / 150) * 100)));
    return { ...a, expDate, passedDays, remDays, pct };
  }).sort((a, b) => a.remDays - b.remDays);

  const lambs = S.a.filter(a => (a.cat === "Kuzu" || a.origin === "Doğum") && a.b);
  const totalBorn = lambs.reduce((s, a) => s + (+a.n || 1), 0);
  const motherTags = new Set(lambs.map(a => a.m).filter(Boolean));
  const twinningRate = motherTags.size > 0 ? Math.round(((totalBorn - motherTags.size) / motherTags.size) * 100) : 0;

  return `
    <div class="card" style="border-top:4px solid var(--purple)">
      <div class="card-title">
        <span>🍼 Doğum & Döl Verimi İstatistikleri</span>
        <button class="btn btn-primary btn-sm" onclick="openBirthModal()">+ Kuzu Doğumu Kaydet</button>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card kpi-purple">
          <div class="kpi-label">Gebe Koyun Sayısı</div>
          <div class="kpi-val tx-purple">${pregnantSheep.length} Baş</div>
          <div class="kpi-sub">Koç katımı yapılmış</div>
        </div>
        <div class="kpi-card kpi-green">
          <div class="kpi-label">Doğan Kuzu Sayısı</div>
          <div class="kpi-val tx-green">${totalBorn} Baş</div>
          <div class="kpi-sub">${motherTags.size} anadan doğan</div>
        </div>
        <div class="kpi-card kpi-blue">
          <div class="kpi-label">Tahmini İkizlik Oranı</div>
          <div class="kpi-val tx-blue">%${twinningRate}</div>
          <div class="kpi-sub">Döl verim başarısı</div>
        </div>
      </div>
    </div>

    ${renderUnpaintedMatingCohortHtml()}
    <!-- FLUSHING VE İKİZ FELCİ UYARISI -->
    <div class="card" style="border-left:4px solid var(--amber)">
      <div class="card-title">💡 Küçükbaş Üreme & Besleme Rehberi</div>
      <div style="font-size:12px; color:var(--tx-sec); line-height:1.6">
        • <b>Flushing (Aşım Öncesi Besleme):</b> Koç katımından 3 hafta önce anaç koyunlara günde 300-400 g arpa/dane yem verilerek yumurtlama ve ikizlik oranı %30-40 artırılır.<br>
        • <b>Gebelik Toksemisi (İkiz Felci):</b> Gebeliğin son 6 haftasında kuzu rahimde hızla büyür. Bu dönemde gebe koyunun enerjisi düşerse ölümcül ikiz felci görülür; kaba yemle birlikte kaliteli kesif yem takviyesi şarttır.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Gebe Koyunlar (150 Günlük Gebelik Takvimi)</div>
      ${pregnantSheep.map(p => {
        const isCritical = p.remDays <= 15;
        const isLate = p.remDays < 0;
        return `
          <div style="border:1px solid var(--ln); border-radius:var(--radius-sm); padding:10px; margin-bottom:8px; background:var(--card)">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px">
              <div>
                <b style="font-size:15px">🐑 ${E(p.k)}</b>
                <span class="badge ${isLate ? 'badge-r' : (isCritical ? 'badge-amber' : 'badge-b')}">
                  ${isLate ? 'GECİKTİ (' + Math.abs(p.remDays) + ' gün)' : (p.remDays === 0 ? 'Bugün Doğum!' : p.remDays + ' gün kaldı')}
                </span>
              </div>
              <button class="btn btn-primary btn-sm" onclick="openBirthModal(${p.id})">🍼 Doğum Yaptı / Kuzu Ekle</button>
            </div>

            <div style="font-size:12px; color:var(--tx-sec); margin:6px 0">
              Koç Katımı: <b>${p.ins}</b> (${p.passedDays}. gün) · Tahmini Doğum: <b>${p.expDate}</b>
            </div>

            <div style="background:var(--card-sub); border-radius:6px; height:8px; overflow:hidden; border:1px solid var(--ln)">
              <div style="width:${p.pct}%; height:100%; background:${isCritical ? 'var(--amber)' : 'var(--purple)'}; transition:width 0.3s"></div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--mut); margin-top:2px">
              <span>0. Gün (Katım)</span>
              <span>75. Gün (Orta)</span>
              <span>150. Gün (Doğum)</span>
            </div>
          </div>
        `;
      }).join("") || '<div style="padding:20px; text-align:center; color:var(--mut)">Şu anda koç katımı girilmiş gebe koyun bulunmuyor.</div>'}
    </div>
  `;

function calcQurbanBalance() {
  const tot = +V("mqTotal") || 0;
  const dep = +V("mqDeposit") || 0;
  if ($("mqBalance")) $("mqBalance").value = Math.max(0, tot - dep);
}

function executeSaveQurban() {
  const customerName = V("mqCustomer").trim();
  const phone = V("mqPhone").trim();
  const animalId = +V("mqAnimal") || 0;
  const slaughterOrder = +V("mqOrder") || 1;
  const totalAmount = +V("mqTotal") || 0;
  const deposit = +V("mqDeposit") || 0;
  const addCash = $("mqAddCash")?.checked;

  if (!customerName || totalAmount <= 0) {
    alert("Lütfen müşteri adı ve toplam satış tutarını girin.");
    return;
  }

  mutate(() => {
    if (!S.qurbans) S.qurbans = [];
      if (!S.cariler) S.cariler = [];
    S.qurbans.push({
      id: Date.now(),
      customerName, phone, animalId, slaughterOrder, totalAmount, deposit,
      isDelivered: false
    });

    if (addCash && deposit > 0) {
      S.e.unshift({
        id: Date.now() + 1,
        d: today(),
        c: "Kurbanlık satışı",
        an: animalId,
        ds: `${customerName} - Kurbanlık koç kaporası (Sıra #${slaughterOrder})`,
        q: 1, kg: 0, p: deposit, a: deposit
      });
    }
  });

  closeModal();
  setStatus("Kurbanlık satışı başarıyla kaydedildi.");
}

function printQurbanReceipt(id) {
  const q = (S.qurbans || []).find(x => x.id === id);
  if (!q) return;
  const animal = S.a.find(a => a.id == q.animalId);
  const bal = (+q.totalAmount || 0) - (+q.deposit || 0);

  const receipt = `🐑 ${S.farmName || 'Koyun & Küçükbaş'} - KURBANLIK REZERVASYON MAKBUZU
===========================================
Tarih: ${today()}
Kesim Sıra No: #${q.slaughterOrder || '1'}
Müşteri: ${q.customerName}
Telefon: ${q.phone || '—'}
Kurbanlık Küpe No: ${animal ? animal.k : 'Belirlenecek'}

Toplam Satış Bedeli: ${F(q.totalAmount)}
Alınan Kapora / Peşinat: ${F(q.deposit)}
Kalan Ödenecek Bakiye: ${F(bal)}
===========================================
Kurbanınız İslamî usullere uygun olarak kesilip teslim edilecektir. Bereketli olsun.`;

  alert(receipt);
}

function deleteQurbanOrder(id) {
  if (confirm("Bu kurbanlık siparişini silmek istediğinize emin misiniz?")) {

function calcCarcassSim() {
  const liveKg = +V("simLiveKg") || 0;
  const yieldPct = +V("simYieldPct") || 50;
  const price = +V("simCarcassPrice") || 0;

  const carcassKg = Math.round(liveKg * (yieldPct / 100) * 10) / 10;
  const bonelessKg = Math.round(carcassKg * 0.77 * 10) / 10;
  const boneKg = Math.round((carcassKg - bonelessKg) * 10) / 10;
  const totalCarcassValue = Math.round(carcassKg * price);

  if ($("slaughterTotalAmt")) $("slaughterTotalAmt").value = totalCarcassValue;

  const res = $("simCarcassResult");
  if (res) {
    res.innerHTML = `
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:8px; font-size:12.5px">
        <div>Kemikli Karkas: <b class="tx-green">${carcassKg} kg</b></div>
        <div>Net Kemiksiz Lop Et: <b class="tx-blue">${bonelessKg} kg</b></div>
        <div>Kemik Payı: <b>${boneKg} kg</b></div>
        <div>Hesaplanan Kesim Tutarı: <b class="tx-green" style="font-size:14px">${F(totalCarcassValue)}</b></div>
      </div>
    `;
  }
}

function executeCarcassSlaughterSale() {
  const d = V("slaughterDate") || today();
  const butcher = V("slaughterButcher").trim();
  const singleAnId = +V("slaughterAnimalId") || 0;
  const qty = Math.max(1, +V("slaughterHeadQty") || 1);
  const totalAmt = +V("slaughterTotalAmt") || 0;
  const payMode = V("slaughterPayMode") || "pesin";
  const dueDate = V("slaughterDueDate") || addDays(d, 30);
  const paidAmt = payMode === "vadeli" ? (+V("slaughterPaidAmt") || 0) : totalAmt;
  const liveKg = +V("simLiveKg") || 0;

  if (!butcher) return alert("Lütfen kestirdiğiniz kasap veya alıcı cari adını girin.");
  if (totalAmt <= 0) return alert("Lütfen geçerli bir kesim satış tutarı girin.");

  mutate(() => {
    ensureCariExists(butcher, "Kasap / Alıcı");

    if (singleAnId > 0) {
      const a = S.a.find(x => x.id === singleAnId);
      if (a) { a.st = "kesildi"; a.sd = d; a.sp = totalAmt; }
    } else if (SELECTED_ANIMALS.size > 0) {
      const perHead = Math.round(totalAmt / SELECTED_ANIMALS.size);
      SELECTED_ANIMALS.forEach(id => {
        const a = S.a.find(x => x.id === id);
        if (a) { a.st = "kesildi"; a.sd = d; a.sp = perHead; }
      });
      SELECTED_ANIMALS.clear();
    }

    S.e.unshift({
      id: Date.now(),
      d,
      c: "Kasaplık koyun / koç satışı",
      an: singleAnId,
      cariName: butcher,
      ds: `${butcher} - Canlı/Karkas et kesim satışı (${qty} baş${liveKg ? ', ' + liveKg + ' kg' : ''})`,
      q: qty,
      kg: liveKg,
      p: Math.round(totalAmt / qty),
      a: totalAmt,
      payMode,
      dueDate: payMode === "vadeli" ? dueDate : "",
      paidAmount: paidAmt,
      isSettled: payMode === "pesin" || paidAmt >= totalAmt
    });
  });

  alert(`Kesim kaydı işlendi! ${butcher} carisine ${F(totalAmt)} (${payMode === 'vadeli' ? 'Vadeli: ' + dueDate : 'Peşin'}) olarak yansıtıldı.`);
  switchTab(12);
}

function viewReports() {
  const fin = getFinancialStats(S.e);

  // Vadeli Alacaklar (Gelecek Paralar) — Tarihe Göre Sıralı
  const openReceivables = S.e
    .filter(x => kind(x.c) === "gelir" && x.payMode === "vadeli" && !x.isSettled && getEntryRemaining(x) > 0)
    .sort((a, b) => String(a.dueDate || "9999").localeCompare(String(b.dueDate || "9999")));

  // Vadeli Borçlar (Ödenecek Verecekler) — Tarihe Göre Sıralı
  const openPayables = S.e
    .filter(x => kind(x.c) === "gider" && x.payMode === "vadeli" && !x.isSettled && getEntryRemaining(x) > 0)
    .sort((a, b) => String(a.dueDate || "9999").localeCompare(String(b.dueDate || "9999")));

  // Cari Kişi ve Firmalar Özeti
  const cariMap = {};
  (S.cariler || []).forEach(c => {
    cariMap[c.name.toLowerCase()] = {
      id: c.id,
      name: c.name,
      type: c.type || "Cari",
      phone: c.phone || "",
      note: c.note || "",
      alacak: 0,
      borc: 0,
      txCount: 0
    };
  });

  S.e.forEach(x => {
    if (!x.cariName) return;
    const key = x.cariName.trim().toLowerCase();
    if (!cariMap[key]) {
      cariMap[key] = { id: Date.now() + Math.random(), name: x.cariName.trim(), type: "Cari", phone: "", note: "", alacak: 0, borc: 0, txCount: 0 };
    }
    cariMap[key].txCount++;
    const rem = getEntryRemaining(x);
    if (rem > 0) {
      if (kind(x.c) === "gelir") cariMap[key].alacak += rem;
      else if (kind(x.c) === "gider") cariMap[key].borc += rem;
    }
  });

  const cariList = Object.values(cariMap).sort((a, b) => (b.alacak + b.borc) - (a.alacak + a.borc));

        <div class="island-sub">Peşin Giren: ${F(fin.cashIn)} · Çıkan: ${F(fin.cashOut)}</div>

        <div class="island-val tx-green">+${F(fin.receivables)}</div>
        <div class="island-sub">${openReceivables.length} adet vadeli alacak</div>
      </div>

      <div class="island-card island-red">
        <div class="island-top"><span class="island-label">Ödenecek Borç (Verecek)</span><span class="island-icon">🔴</span></div>
        <div class="island-val tx-red">−${F(fin.payables)}</div>
        <div class="island-sub">${openPayables.length} adet vadeli veresiye borç</div>
      </div>

      <div class="island-card ${netCariBalance >= 0 ? 'island-blue' : 'island-amber'}">
        <div class="island-top"><span class="island-label">Net Cari Dengesi</span><span class="island-icon">⚖️</span></div>
        <div class="island-val ${netCariBalance >= 0 ? 'tx-blue' : 'tx-amber'}">${netCariBalance >= 0 ? '+' : ''}${F(netCariBalance)}</div>

function executeFeedRestock(feedId) {
  const f = S.feeds.find(x => x.id === feedId);
  if (!f) return;
  const d = V("rfDate") || today();
  const cariName = V("rfCariName").trim();
  const kg = +V("rfKg") || 0;
  const p = +V("rfCostPerKg") || 0;
  const total = +V("rfTotal") || (kg * p);
  const payMode = V("rfPayMode") || "pesin";
  const dueDate = V("rfDueDate") || addDays(d, 30);
  const paidAmt = payMode === "vadeli" ? (+V("rfPaidAmt") || 0) : total;
  const addExp = $("rfAddExpense")?.checked;

  if (kg <= 0) return alert("Geçerli miktar girin.");

  mutate(() => {
    f.stockKg += kg;
    f.costPerKg = p;
    if (cariName) ensureCariExists(cariName, "Yemci / Tedarikçi");
    if (addExp && total > 0) {
      S.e.unshift({
        id: Date.now(), d,
        c: f.isRoughage ? "Kaba yem - Yonca / Saman / Silaj" : "Yem - Kesif / Fabrika yemi",
        an: 0,
        cariName,
        ds: `${f.name} alımı (${kg} kg)${cariName ? ' - ' + cariName : ''}`,
        q: Math.round(kg / (f.bagKg || 50)), kg, p, a: total,
        payMode,
        dueDate: payMode === "vadeli" ? dueDate : "",
        paidAmount: paidAmt,
        isSettled: payMode === "pesin" || paidAmt >= total
      });
    }
  });

  closeModal();
  setStatus(`${f.name} stoğu güncellendi (${payMode === 'vadeli' ? 'Vadeli borç kaydedildi' : 'Peşin'}).`);
}

function updateBulkSaleCalc() {
  const count = SELECTED_ANIMALS.size;
  if ($("saleSelectedCountBadge")) $("saleSelectedCountBadge").textContent = `${count} Baş Seçildi`;
  if ($("bsCountVal")) $("bsCountVal").textContent = `${count} Baş`;

  if (count === 0) {
    if ($("bsTotalVal")) $("bsTotalVal").textContent = "0 ₺";
    if ($("bsCostVal")) $("bsCostVal").textContent = "0 ₺";
    if ($("bsAvgPriceVal")) $("bsAvgPriceVal").textContent = "0 ₺/baş";
    if ($("bsNetProfitVal")) {
      $("bsNetProfitVal").textContent = "0 ₺";
      $("bsNetProfitVal").className = "";
    }
    return;
  }

  const modeEl = document.querySelector('input[name="bsPriceMode"]:checked');
  const mode = modeEl ? modeEl.value : "perHead";

  let totalRevenue = 0;
  if (mode === "perHead") {
    const p = +V("bsPricePerHead") || 0;
    totalRevenue = count * p;
  } else if (mode === "lump") {
    totalRevenue = +V("bsLumpTotal") || 0;
  } else if (mode === "weight") {
    const totKg = +V("bsTotalLiveKg") || 0;
    const pKg = +V("bsPricePerKg") || 0;
    totalRevenue = Math.round(totKg * pKg);
  }

  const costs = computeCosts();
  let totalCostOfSelected = 0;
  SELECTED_ANIMALS.forEach(id => {
    const c = costs.costMap[id];
    if (c) totalCostOfSelected += (c.totalCost || 0);
  });

  const netProfit = totalRevenue - totalCostOfSelected;
  const avgPrice = count > 0 ? Math.round(totalRevenue / count) : 0;
  const marginPct = totalRevenue > 0 ? Math.round((netProfit / totalRevenue) * 100) : 0;

  if ($("bsTotalVal")) $("bsTotalVal").textContent = F(totalRevenue);
  if ($("bsCostVal")) $("bsCostVal").textContent = F(totalCostOfSelected);
  if ($("bsAvgPriceVal")) $("bsAvgPriceVal").textContent = F(avgPrice) + "/baş";
  if ($("bsNetProfitVal")) {
    $("bsNetProfitVal").textContent = (netProfit >= 0 ? '+' : '') + F(netProfit) + ` (%${marginPct} Kâr)`;
    $("bsNetProfitVal").className = netProfit >= 0 ? 'tx-green' : 'tx-red';
  }
}

function executeBulkSale() {
  const count = SELECTED_ANIMALS.size;
  if (count === 0) return alert("Lütfen satılacak hayvanları listeden işaretleyin.");

  const d = V("bsSaleDate") || today();
  const buyer = V("bsSaleBuyer").trim();
  const cat = V("bsSaleCategory") || "Erkek kuzu satışı (canlı kg)";
  const recordIncome = $("bsRecordIncome")?.checked;
  const payMode = V("bsSalePayMode") || "pesin";
  const dueDate = V("bsSaleDueDate") || addDays(d, 30);
  const paidAmtInput = +V("bsSalePaidAmt") || 0;

  const modeEl = document.querySelector('input[name="bsPriceMode"]:checked');
  const mode = modeEl ? modeEl.value : "perHead";

  let totalRevenue = 0;
  let totalLiveKg = 0;

  if (mode === "perHead") {
    const p = +V("bsPricePerHead") || 0;
    totalRevenue = count * p;
  } else if (mode === "lump") {
    totalRevenue = +V("bsLumpTotal") || 0;
  } else if (mode === "weight") {
    totalLiveKg = +V("bsTotalLiveKg") || 0;
    const pKg = +V("bsPricePerKg") || 0;
    totalRevenue = Math.round(totalLiveKg * pKg);
  }

  if (totalRevenue <= 0) return alert("Lütfen satış tutarını girin.");
  const paidAmt = payMode === "vadeli" ? paidAmtInput : totalRevenue;

  const pricePerAnimal = Math.round(totalRevenue / count);
  const kgPerAnimal = totalLiveKg > 0 ? Math.round((totalLiveKg / count) * 10) / 10 : 0;

  mutate(() => {
    if (buyer) ensureCariExists(buyer, "Kasap / Alıcı");

    SELECTED_ANIMALS.forEach(id => {
      const a = S.a.find(x => x.id === id);
      if (a) {
        a.st = "satıldı";
        a.sd = d;
        a.sp = pricePerAnimal;
        if (kgPerAnimal > 0) a.skg = kgPerAnimal;
      }
    });

    if (recordIncome) {
      S.e.unshift({
        id: Date.now(), d, c: cat, an: 0,
        cariName: buyer || "Genel Alıcı",
        ds: `${count} baş hayvan satışı (${buyer ? buyer : 'Kasap/Alıcı'})`,
        q: count, kg: totalLiveKg, p: pricePerAnimal, a: totalRevenue,
        payMode,
        dueDate: payMode === "vadeli" ? dueDate : "",
        paidAmount: paidAmt,
        isSettled: payMode === "pesin" || paidAmt >= totalRevenue
      });
    }

    SELECTED_ANIMALS.clear();
  });

  alert(`Tebrikler! ${count} baş hayvan satıldı. ${payMode === 'vadeli' ? 'Gelecek para (' + dueDate + ') Nakit & Cari Raporlara işlendi.' : 'Kasaya peşin gelir işlendi.'}`);
  switchTab(payMode === "vadeli" ? 12 : 3);
}

// BULUT VE SENKRONİZASYON AKSİYONLARI (DRIVEAPP & TEŞHİS)
async function sendDataToCloudEndpoint(url, dataObj) {
  if (!url || !url.startsWith("http")) return;
  try {
    await fetch(url, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "save", data: dataObj })
    });
    setStatus("Veriler buluta ve yerel hafızaya kaydedildi.", "🟢 Canlı");
  } catch (e) {
    setStatus("Yerel hafızaya kaydedildi (Bulut beklemede).", "🟡 Yerel");
  }
}

async function runCloudDiagnostics() {
  const url = V("cfgEndpointUrl").trim();
  const resEl = $("cloudDiagResult");
  if (!resEl) return;
  resEl.style.display = "block";

  if (!url) {
    resEl.style.background = "var(--amber-light)";
    resEl.style.border = "1px solid var(--amber)";
    resEl.style.color = "var(--amber)";
    resEl.innerHTML = "<b>❌ URL Girilmedi:</b> Lütfen önce Google Apps Script Web App URL adresinizi yapıştırın.";
    return;
  }

  if (!url.startsWith("https://script.google.com/macros/s/")) {
    resEl.style.background = "var(--r-light)";
    resEl.style.border = "1px solid var(--r)";
    resEl.style.color = "var(--r)";
    resEl.innerHTML = "<b>❌ Hatalı Bağlantı Türü:</b> Adres <code>https://script.google.com/macros/s/...</code> ile başlamalıdır.";
    return;
  }

  if (url.includes("/edit") || url.includes("/dev")) {
    resEl.style.background = "var(--r-light)";
    resEl.style.border = "1px solid var(--r)";
    resEl.style.color = "var(--r)";
    resEl.innerHTML = "<b>❌ Düzenleme Linki Yapıştırılmış:</b> <code>/edit</code> yerine <b>Dağıtımları Yönet > Web Uygulaması</b> altındaki <code>/exec</code> linkini kopyalayın.";
    return;
  }

  resEl.style.background = "var(--b-light)";
  resEl.style.border = "1px solid var(--b)";
  resEl.style.color = "var(--b)";
  resEl.innerHTML = "⏳ Google bulut sunucusuna bağlanılıyor, lütfen 3 saniye bekleyin...";

  try {
    const testUrl = url + (url.includes("?") ? "&" : "?") + "action=get&_t=" + Date.now();
    const resp = await fetch(testUrl);
    const text = await resp.text();

    if (text.includes("<!DOCTYPE") || text.includes("<html") || text.includes("accounts.google.com")) {
      resEl.style.background = "var(--r-light)";
      resEl.style.border = "1px solid var(--r)";
      resEl.style.color = "var(--r)";
      resEl.innerHTML = "<b>❌ Yetki Hatası (Google Oturum Açma Engeli):</b> script.google.com'da <i>Dağıtımları Yönet > Düzenle > Erişimi Olanlar: Herkes (Anyone)</i> seçildiğinden emin olun.";
      return;
    }

    const parsed = JSON.parse(text);
    if (parsed && parsed.success) {
      await sendDataToCloudEndpoint(url, S);
      resEl.style.background = "var(--g-light)";
      resEl.style.border = "1px solid var(--g)";
      resEl.style.color = "var(--primary-tx)";
      resEl.innerHTML = `<b>🎉 BAĞLANTI TAMAMEN BAŞARILI!</b><br>✓ Google Drive sunucunuza bağlanıldı.<br>✓ Buluttaki mevcut hayvan sayısı: ${parsed.data?.a?.length || 0} baş.<br>✓ Bu cihazdaki mevcut veriler buluta eşitlendi.`;
      if ($("cloudStatusBadge")) {
        $("cloudStatusBadge").textContent = "🟢 CANLI BULUT AKTİF";
        $("cloudStatusBadge").className = "badge badge-g";
      }
    } else {
      resEl.style.background = "var(--r-light)";
      resEl.style.border = "1px solid var(--r)";
      resEl.style.color = "var(--r)";
      resEl.innerHTML = `<b>❌ Sunucu Hatası:</b> ${E(parsed?.error || 'Bilinmeyen hata')}`;
    }
  } catch (err) {
    resEl.style.background = "var(--r-light)";
    resEl.style.border = "1px solid var(--r)";
    resEl.style.color = "var(--r)";
    resEl.innerHTML = `<b>❌ Ağ / CORS Bağlantı Hatası:</b> ${E(err.message)}`;
  }
}

// FORMLAR VE DEĞER DEĞİŞİKLİKLERİ
function saveLedgerEntry() {
  const idEl = $("editEntryId");
  const editId = idEl ? +idEl.value : 0;
  const d = V("entryDate") || today();
  const c = V("entryCat");
  const cariName = V("entryCariName").trim();
  const an = +V("entryAnimal") || 0;
  const ds = V("entryDesc").trim();
  const q = +V("entryQty") || 0;
  const kg = +V("entryKg") || 0;
  const p = +V("entryUnitPrice") || 0;
  const a = +V("entryAmount");
  const payMode = V("entryPayMode") || "pesin";
  const dueDate = V("entryDueDate") || addDays(d, 30);
  const paidAmtInput = +V("entryPaidAmount") || 0;

  if (!a || a <= 0) return alert("Lütfen geçerli bir tutar girin.");

  const paidAmount = payMode === "vadeli" ? paidAmtInput : a;
  const isSettled = payMode === "pesin" || paidAmount >= a;
  const isCredit = (c === "Kredi çekildi" || kind(c) === "kredi+");

  mutate(() => {
    if (cariName) {
      const defType = kind(c) === "gelir" ? "Kasap / Alıcı" : "Yemci / Tedarikçi";
      ensureCariExists(cariName, defType);
    }

    const record = {
      id: editId || Date.now(),
      d, c, cariName, an, ds, q, kg, p, a,
      payMode,
      dueDate: payMode === "vadeli" ? dueDate : "",
      paidAmount,
      isSettled
    };

    if (editId) S.e = S.e.map(x => x.id === editId ? record : x);
    else S.e.unshift(record);

    if (isCredit && !editId) {
      const bank = V("clBank").trim() || "Banka Kredisi";
      const rate = +V("clRate") || 0;
      const months = +V("clMonths") || 12;
      const autoPlan = $("clAutoPlan")?.checked;
      const r = rate / 1200;
      const monthly = r ? (a * r / (1 - Math.pow(1 + r, -months))) : (a / months);
      
      if (!S.loans) S.loans = [];
      S.loans.push({
        id: Date.now(), bank, amount: a, rate, months,
        startDate: addDays(d, 30),
        monthlyPayment: Math.round(monthly),
        totalPayment: Math.round(monthly * months),
        totalInterest: Math.round(monthly * months - a),
        status: "aktif"
      });

      if (autoPlan) {
        for (let m = 0; m < months; m++) {
          S.t.push({
            id: Date.now() + 500 + m,
            d: addDays(d, (m + 1) * 30),
            c: "iş", t: `${bank} Taksiti (${m + 1}/${months}) - ${F(monthly)}`,
            cost: Math.round(monthly), x: 0
          });
        }
      }
    }

    if (an && kind(c) === "gelir") {
      const h = S.a.find(x => x.id === an);
      if (h && h.st === "sürüde") {
        h.st = "satıldı"; h.sd = d; h.sp = a;
      }
    }
  });

  setStatus(payMode === "vadeli" ? `Vadeli kayıt işlendi (Vade: ${dueDate}).` : "Peşin kayıt kasaya işlendi.");
  cancelEditEntry();
}

// VADELİ (VERESİYE) BORÇ VE ALACAK TAHSİLAT / ÖDEME FONKSİYONLARI
function settleVadeliEntry(id) {
  const x = S.e.find(item => item.id === id);
  if (!x) return;
  const k = kind(x.c);
  const rem = getEntryRemaining(x);
  const msg = k === "gelir"
    ? `${x.cariName || 'Müşteri'} carisinden kalan ${F(rem)} alacağın tamamı tahsil edildi mi?`
    : `${x.cariName || 'Tedarikçi'} carisine kalan ${F(rem)} borcun tamamı ödendi mi?`;
  if (!confirm(msg)) return;

  mutate(() => {
    x.paidAmount = x.a;
    x.isSettled = true;
    x.settledDate = today();
  });
  setStatus(`${F(rem)} tutarındaki vadeli işlem kapatıldı ve nakit kasaya yansıtıldı.`);
}

function partialSettleVadeliEntry(id) {
  const x = S.e.find(item => item.id === id);
  if (!x) return;
  const rem = getEntryRemaining(x);
  const k = kind(x.c);
  const input = prompt(`${x.cariName || ''} için kalan tutar: ${F(rem)}.
Şimdi ${k === 'gelir' ? 'tahsil edilen' : 'ödenen'} tutarı girin (TL):`, rem);
  if (input === null) return;
  const amt = +input || 0;
  if (amt <= 0) return alert("Geçerli bir tutar girin.");

  mutate(() => {
    x.paidAmount = Math.min(x.a, (+x.paidAmount || 0) + amt);
    if (x.paidAmount >= x.a) {
      x.isSettled = true;
      x.settledDate = today();
    }
  });
  setStatus(`${F(amt)} kısmi ödeme/tahsilat işlendi.`);
}

function saveManualCariTransaction() {
  const name = V("mcName").trim();
  const type = V("mcType") || "Kasap / Alıcı";
  const phone = V("mcPhone").trim();
  const actionType = V("mcActionType") || "alacak";
  const amount = +V("mcAmount") || 0;
  const paidAmt = +V("mcPaidAmt") || 0;
  const dueDate = V("mcDueDate") || addDays(today(), 30);
  const desc = V("mcDesc").trim();

  if (!name) return alert("Lütfen cari kişi veya firma adını girin.");

  if (actionType !== "onlyCari" && amount <= 0) {
    return alert("Lütfen geçerli bir alacak/borç tutarı girin.");
  }

  mutate(() => {
    const cariObj = ensureCariExists(name, type);
    if (cariObj) {
      cariObj.type = type;
      if (phone) cariObj.phone = phone;
    }

  const breed = V("animalBreed");
  const origin = V("animalOrigin");
  const bp = +V("animalBuyPrice") || 0;
  const bd = V("animalBuyDate") || today();
  const ageM = V("animalAgeMonths");
  const b = V("animalBirthDate") || (ageM !== "" ? ageMonthsToBirthDate(ageM) : "");

function executeBuyWizard() {
  const d = V("wizBuyDate") || today();
  const cat = V("wizBuyCat");
  const sex = V("wizBuySex");
  const breed = V("wizBuyBreed");
  const vendor = V("wizBuyVendor").trim();
  const gId = +V("wizBuyGroup") || 0;
  const ageM = V("wizBuyAgeMonths");
  const bDate = V("wizBuyBirthDate") || (ageM !== "" ? ageMonthsToBirthDate(ageM) : "");
  const q = Math.max(1, +V("wizBuyQty") || 1);
  const p = +V("wizBuyPrice") || 0;
  const total = q * p;
  const payMode = V("wizBuyPayMode") || "pesin";
  const dueDate = V("wizBuyDueDate") || addDays(d, 30);
  const paidAmt = payMode === "vadeli" ? (+V("wizBuyPaidAmt") || 0) : total;
  const recordExp = $("wizRecordExpense")?.checked;

  const modeEl = document.querySelector('input[name="wizTagMode"]:checked');
  const mode = modeEl ? modeEl.value : "seq";

  let createdAnimals = [];
  const startId = Date.now();

  if (mode === "seq") {
    const prefix = V("wizTagPrefix").trim() || "TR-51-";
    const startNum = +V("wizTagStart") || 1;
    for (let i = 0; i < q; i++) {
      createdAnimals.push({
        id: startId + i, k: `${prefix}${startNum + i}`, s: sex, cat, breed, origin: "Satın Alma",
        vendor, bp: p, bd: d, b: bDate, st: "sürüde", n: 1, grp: gId ? [gId] : []
      });
    }
  } else if (mode === "manual") {
    const raw = V("wizManualTags");
    const tags = raw.split(/[\r\n,;]+/).map(s => s.trim()).filter(Boolean);
    if (tags.length === 0) return alert("Lütfen en az bir küpe girin.");
    tags.forEach((tag, idx) => {
      createdAnimals.push({
        id: startId + idx, k: tag, s: sex, cat, breed, origin: "Satın Alma",
        vendor, bp: p, bd: d, b: bDate, st: "sürüde", n: 1, grp: gId ? [gId] : []
      });
    });
  } else {
    createdAnimals.push({
      id: startId, k: `${d} ${breed} ${cat} Grubu (${q} Baş)`, s: sex, cat, breed, origin: "Satın Alma",
      vendor, bp: p, bd: d, b: bDate, st: "sürüde", n: q, grp: gId ? [gId] : []
    });
  }

  mutate(() => {
    if (vendor) ensureCariExists(vendor, "Şahıs / Diğer");
    S.a = createdAnimals.concat(S.a);
    if (recordExp && total > 0) {
      S.e.unshift({
        id: startId + 999, d, c: "Hayvan alımı", an: createdAnimals.length === 1 ? createdAnimals[0].id : 0,
        cariName: vendor,
        ds: `${q} adet ${breed} ${cat} alımı (${vendor ? vendor : 'Satın alma'})`,
        q, kg: 0, p, a: total,
        payMode,
        dueDate: payMode === "vadeli" ? dueDate : "",
        paidAmount: paidAmt,
        isSettled: payMode === "pesin" || paidAmt >= total
      });
    }
  });

  alert(`${createdAnimals.length} baş hayvan başarıyla sürüye eklendi!`);
  switchTab(payMode === "vadeli" ? 12 : 3);
}
