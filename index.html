      const u = await us.id();
      if (u) {
        ref = cl.collection("data/users/" + u).doc("store");
        const sn = await ref.get();
        if (sn.exists && sn.data().json) {
          const parsed = JSON.parse(sn.data().json);
          if (parsed && Array.isArray(parsed.a) && parsed.a.length >= 50) {
            S = Object.assign({}, S, parsed);
          }
        } else {
          await save();
        }
      }
    }
  } catch (e) {}

  repairStateShape();
  checkAndDeductDailyFeeds();

  if (S.cloudSync && S.cloudSync.endpointUrl) {
    try {
      const resp = await fetch(S.cloudSync.endpointUrl + "?action=get&_t=" + Date.now());
      if (resp.ok) {
        const text = await resp.text();
        if (!text.includes("<!DOCTYPE") && !text.includes("<html")) {
          const cloudData = JSON.parse(text);
          if (cloudData && cloudData.data && Array.isArray(cloudData.data.a) && cloudData.data.a.length >= 50) {
            S = Object.assign({}, S, cloudData.data);
            repairStateShape();
            try { localStorage.setItem("koyun", JSON.stringify(S)); } catch (e) {}
            setStatus("Buluttan güncel veriler eşitlendi.", "🟢 Canlı Eşitlendi");
          }
        }
      }
    } catch (err) {}
  }

  updateHeaderStatus();
  buildNavPills();
  setupEventListeners();
  renderApp();
}

async function save() {
  S.cloudSync.lastSync = new Date().toISOString();
  try {
    localStorage.setItem("koyun", JSON.stringify(S));
  } catch (e) {}
  if (ref) {
    try { await ref.set({ json: JSON.stringify(S) }); } catch (e) {}
  }
  if (S.cloudSync && S.cloudSync.endpointUrl) {
    sendDataToCloudEndpoint(S.cloudSync.endpointUrl, S);
  }
}

  HIST.push(JSON.stringify(S));

function calcWoolRevenue() {
  const kg = +V("woolTotalKg") || 0;
  const p = +V("woolPricePerKg") || 0;
  if ($("woolTotalAmt")) $("woolTotalAmt").value = Math.round(kg * p);
}

function saveWoolLog() {
  const d = V("woolDate") || today();
  const headCount = +V("woolHeadCount") || 0;
  const kg = +V("woolTotalKg") || 0;
  const p = +V("woolPricePerKg") || 0;
  const total = Math.round(kg * p);
  const buyer = V("woolBuyer").trim();
  const addLedger = $("woolAddLedger")?.checked;
  const updateFlock = $("woolUpdateFlock")?.checked;

  if (kg <= 0) return alert("Lütfen geçerli bir yün miktarı girin.");

  mutate(() => {
    if (!S.woolLogs) S.woolLogs = [];
    S.woolLogs.unshift({
      id: Date.now(), d, headCount, kg, p, total, buyer
    });

    if (buyer) ensureCariExists(buyer, "Yün / Tekstil Alıcısı");

    if (updateFlock) {
      const avgWoolPerHead = headCount > 0 ? (kg / headCount) : 2.5;
      if (SELECTED_ANIMALS.size > 0) {
        SELECTED_ANIMALS.forEach(id => {
          const a = S.a.find(x => x.id === id);
          if (a) { a.lastShearing = d; a.woolKg = Math.round(avgWoolPerHead * 10) / 10; }
        });
      } else {
        S.a.filter(a => a.st === 'sürüde').forEach(a => {
          a.lastShearing = d;
          a.woolKg = Math.round(avgWoolPerHead * 10) / 10;
        });
      }
    }

    if (addLedger && total > 0) {
      S.e.unshift({
        id: Date.now() + 1, d, c: "Yün kırkım geliri", an: 0,
        cariName: buyer,
        ds: `${headCount} baş koyun kırkımı (${kg} kg yün)${buyer ? ' - ' + buyer : ''}`,
        q: headCount, kg, p, a: total,
        payMode: "pesin", isSettled: true
      });
    }
  });

  SELECTED_ANIMALS.clear();
  closeModal();
  updateBulkBar();
  setStatus(`${headCount} baş hayvan kırkımı kaydedildi (${kg} kg yün, ${F(total)}).`);
}

// Sesli & Haptik Geri Bildirim Motoru (Ağıl ve Mera Şartları İçin)
function playRecognitionSound(isSuccess = true) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    if (isSuccess) {
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    } else {
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    }
  } catch (e) {}
}

function triggerHapticFeedback(pattern = [40, 50, 80]) {
  if (navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch (e) {}
  }
}

// Kamera Akışını Başlatma ve Donanım Teşhisi
async function startCameraStream() {
  const video = $('hudVideo');
  const fallbackBox = $('hudCameraFallbackBox');
  if (!video) return;

  try {
    if (HUD_STREAM) {
      HUD_STREAM.getTracks().forEach(t => t.stop());
      HUD_STREAM = null;
    }

    const constraints = {
      video: {
        facingMode: { ideal: HUD_FACING_MODE },
        width: { ideal: 1280, max: 1920 },
        height: { ideal: 720, max: 1080 }
      },
      audio: false
    };

    HUD_STREAM = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = HUD_STREAM;
    await video.play();

    if (fallbackBox) fallbackBox.style.display = 'none';
    if ($('hudCameraStatus')) {
      $('hudCameraStatus').textContent = 'AI Vizör Aktif';
      $('hudCameraStatus').className = 'badge badge-g';
    }

    // Fener desteğini kontrol et
    const track = HUD_STREAM.getVideoTracks()[0];
    if (track && track.getCapabilities) {
      const caps = track.getCapabilities();
      const torchBtn = $('hudTorchBtn');
      if (torchBtn) {
        torchBtn.style.display = caps.torch ? 'inline-flex' : 'none';
      }
    }
  } catch (err) {
    console.warn('Canlı kamera akışı başlatılamadı:', err);
    if ($('hudCameraStatus')) {
      $('hudCameraStatus').textContent = 'Fotoğraf / Manuel Mod';
      $('hudCameraStatus').className = 'badge badge-amber';
    }
    if (fallbackBox) {
      fallbackBox.style.display = 'flex';
      const errMsg = $('hudFallbackErrMsg');
      if (errMsg) {
        errMsg.textContent = err.name === 'NotAllowedError'
          ? 'Kamera izni verilmedi. Tarayıcı ayarlarından kameraya izin verin veya aşağıdaki butondan fotoğraf çekin.'
          : (err.message || 'Canlı akış açılamadı. Fotoğraf çekerek devam edebilirsiniz.');
      }
    }
  }
}

function handleHUDFallbackFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = $('hudCanvas') || document.createElement('canvas');
      canvas.width = 300;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 300, 300);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      const sig = extractCanvasVisualSignature(canvas);
      processImageBitmapForRecognition(canvas, dataUrl, sig, false);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Biyometrik Renk & Doku Histogram Çıkarıcı
function extractCanvasVisualSignature(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;

  let rSum = 0, gSum = 0, bSum = 0;
  const histR = new Array(8).fill(0);
  const histG = new Array(8).fill(0);
  const histB = new Array(8).fill(0);
  const histLum = new Array(8).fill(0);

  let samples = 0;
  for (let i = 0; i < d.length; i += 16) {
    const r = d[i], g = d[i+1], b = d[i+2];
    rSum += r; gSum += g; bSum += b;
    histR[Math.min(7, Math.floor(r / 32))]++;
    histG[Math.min(7, Math.floor(g / 32))]++;
    histB[Math.min(7, Math.floor(b / 32))]++;
    const lum = Math.floor((0.299 * r + 0.587 * g + 0.114 * b) / 32);
    histLum[Math.min(7, lum)]++;
    samples++;
  }

  const s = samples || 1;
  return {
    avgR: Math.round(rSum / s),
    avgG: Math.round(gSum / s),
    avgB: Math.round(bSum / s),
    histR: histR.map(v => Math.round((v / s) * 100)),
    histG: histG.map(v => Math.round((v / s) * 100)),
    histB: histB.map(v => Math.round((v / s) * 100)),
    histLum: histLum.map(v => Math.round((v / s) * 100))
  };
}

function calculateSignatureSimilarity(sig1, sig2) {
  if (!sig1 || !sig2 || !sig1.histLum || !sig2.histLum) return 50;

  const colorDiff = (Math.abs(sig1.avgR - sig2.avgR) + Math.abs(sig1.avgG - sig2.avgG) + Math.abs(sig1.avgB - sig2.avgB)) / 3;
  const colorSim = Math.max(0, 100 - colorDiff);

  let lumOverlap = 0;
  for (let i = 0; i < 8; i++) {
    lumOverlap += Math.min(sig1.histLum[i] || 0, sig2.histLum[i] || 0);
  }

  let rgbOverlap = 0;
  if (sig1.histR && sig2.histR) {
    for (let i = 0; i < 8; i++) {
      rgbOverlap += Math.min(sig1.histR[i] || 0, sig2.histR[i] || 0) +
                    Math.min(sig1.histG[i] || 0, sig2.histG[i] || 0) +
                    Math.min(sig1.histB[i] || 0, sig2.histB[i] || 0);
    }
    rgbOverlap = rgbOverlap / 3;
  } else {
    rgbOverlap = lumOverlap;
  }

  return Math.round(colorSim * 0.35 + lumOverlap * 0.35 + rgbOverlap * 0.30);
}

// Canlı Tarama ve Çift Çekirdekli Algılama Motoru
async function scanAndIdentifyAnimalLive(isAuto = false) {
  const video = $('hudVideo');
  const canvas = $('hudCanvas');
  if (!video || !video.videoWidth) {
    if (!isAuto) alert('Kamera görüntüsü henüz hazır değil.');
    return;
  }

  // 1. ADIM: NATIVE BARKOD / QR KONTROLÜ
  if (HUD_BARCODE_DETECTOR) {
    try {
      const barcodes = await HUD_BARCODE_DETECTOR.detect(video);
      if (barcodes && barcodes.length > 0) {
        for (const b of barcodes) {
          const raw = (b.rawValue || '').trim();
          if (raw) {
            const activeAnimals = S.a.filter(a => a.st === 'sürüde');
            const match = activeAnimals.find(a => 
              a.k.toLowerCase() === raw.toLowerCase() ||
              a.k.toLowerCase().includes(raw.toLowerCase()) ||
              raw.toLowerCase().includes(a.k.toLowerCase())
            );
            if (match) {
              canvas.width = 300;
              canvas.height = 300;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, 300, 300);
              const capturedPhotoData = canvas.toDataURL('image/jpeg', 0.75);

              playRecognitionSound(true);
              triggerHapticFeedback([50, 40, 100]);
              HUD_SCANNED_CANDIDATE = {
                animalId: match.id,
                photoData: capturedPhotoData,
                sig: extractCanvasVisualSignature(canvas),
                score: 100,
                method: `Barkod / QR: ${raw}`
              };
              showRecognitionPrompt(match, 100, `🏷️ Barkod / QR Kod Doğrulandı (${raw})`);
              return;
            }
          }
        }
      }
    } catch (be) {
      console.warn("Barkod okuma hatası:", be);
    }
  }

  // 2. ADIM: BİYOMETRİK YÜZ VE VÜCUT VİZÖR ANALİZİ
  canvas.width = 300;
  canvas.height = 300;
  const ctx = canvas.getContext('2d');

  const vW = video.videoWidth;
  const vH = video.videoHeight;
  const cropSize = Math.min(vW, vH, 480);
  const sx = (vW - cropSize) / 2;
  const sy = (vH - cropSize) / 2;

  ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 300, 300);
  const liveSig = extractCanvasVisualSignature(canvas);
  const capturedPhotoData = canvas.toDataURL('image/jpeg', 0.75);

  processImageBitmapForRecognition(canvas, capturedPhotoData, liveSig, isAuto);
}

function processImageBitmapForRecognition(canvas, capturedPhotoData, liveSig = null, isAuto = false) {
  if (!liveSig) liveSig = extractCanvasVisualSignature(canvas);
  const activeAnimals = S.a.filter(a => a.st === 'sürüde');
  if (activeAnimals.length === 0) {
    if (!isAuto) alert('Sürüde kayıtlı aktif hayvan bulunamadı.');
    return;
  }

  let candidates = [];
  activeAnimals.forEach(a => {
    let score = 0;
    if (Array.isArray(a.visSigs) && a.visSigs.length > 0) {
      score = Math.max(...a.visSigs.map(sig => calculateSignatureSimilarity(liveSig, sig)));
    } else if (a.visSig) {
      score = calculateSignatureSimilarity(liveSig, a.visSig);
    } else {
      // Öğretilmiş fotoğraf imzası olmayan hayvan için tahmini skor üretme.
      return;
    }
    candidates.push({ animal: a, score });
  });

  if (candidates.length === 0) {
    if (!isAuto) alert('Kayıtlı hayvanlarda karşılaştırılabilir öğretilmiş fotoğraf bulunamadı. Küpe/QR ile bulup farklı açılardan fotoğraf öğretin. Fotoğraf benzerliği kesin kimlik doğrulaması değildir.');
    return;
  }
  candidates.sort((x, y) => y.score - x.score);
  const bestMatch = candidates[0];

  if (isAuto && bestMatch.score < 80) {
    return;
  }

  const finalScore = Math.max(0, Math.min(100, bestMatch.score));
  HUD_SCANNED_CANDIDATE = {
    animalId: bestMatch.animal.id,
    photoData: capturedPhotoData,
    sig: liveSig,
    score: finalScore,
    method: "Öğretilmiş fotoğraf benzerliği (kesin kimlik değildir)"
  };

  playRecognitionSound(true);
  triggerHapticFeedback([40, 50, 80]);
  showRecognitionPrompt(bestMatch.animal, finalScore, "Öğretilmiş Fotoğraf Benzerliği");
}

  const a = S.a.find(x => x.id === animalId);

  const c = costs.costMap[a.id] || {};

  const weights = (S.w || []).filter(w => w.an === a.id).sort((x, y) => y.d.localeCompare(x.d));

function openHubTreatmentModal(animalId) {
  const a = S.a.find(x => x.id === animalId);
  if (!a) return;
  const med = prompt(`${a.k} için aşı/ilaç adı:`, a.lastVaccine || "Enterotoksemi (Çelerme) Aşısı");
  if (!med) return;
  const cost = +prompt("Masraf tutarı (TL, yoksa 0):", "120") || 0;
  const withdrawal = +prompt("Yasal kesim/arınma yasağı süresi (gün):", "14") || 0;
  const repeat = +prompt("Tekrar sıklığı (gün, yoksa 0):", "180") || 0;
  const d = today();

  mutate(() => {
    a.lastVaccine = med;
    a.lastVaccineDate = d;
    a.lastVaccineType = "aşı";
    if (!a.vaccines) a.vaccines = [];
    a.vaccines.unshift({
      id: Date.now(),
      d,
      t: med,
      c: "aşı",
      cost,
      withdrawal,
      repeat
    });

    S.t.push({
      id: Date.now() + 1,
      d,
      c: 'aşı',
      t: `${med} (${a.k})`,
      an: a.id,
      tag: a.k,
      cost,
      withdrawal,
      r: repeat,
      x: 1,
      animalIds: [a.id]
    });

    if (repeat > 0) {
      S.t.push({
        id: Date.now() + 2,
        d: addDays(d, repeat),
        c: 'aşı',
        t: `${med} Tekrarı (${a.k})`,
        an: a.id,
        tag: a.k,
        cost: 0,
        withdrawal,
        r: repeat,
        x: 0,
        animalIds: [a.id]
      });
    }

    if (cost > 0) {
      S.e.unshift({
        id: Date.now() + 3,
        d,
        c: 'Aşı / İlaç / Serum / Parazit',
        an: a.id,
        ds: `${a.k} - ${med} uygulaması`,
        q: 1,
        kg: 0,
        p: cost,
        a: cost,
        payMode: 'pesin',
        isSettled: true
      });
    }
  });

  alert(`${a.k} için ${med} kaydı profil kartına ve sağlık geçmişine işlendi!`);
  openAnimalDetailHubModal(a.id);
}

function toggleAnimalMeraBesi(animalId) {
  const a = S.a.find(x => x.id === animalId);
  if (!a) return;
  const nextLoc = (a.location || 'Mera') === 'Mera' ? 'Besi' : 'Mera';
  mutate(() => { a.location = nextLoc; });
  alert(`${a.k} ${nextLoc === 'Besi' ? '🏡 Kapalı Besiye alındı (Yem tüketimi başladı)' : '🏔️ Dağ Merasına çıkarıldı (Yem tüketimi sıfırlandı)'}!`);
  openAnimalDetailHubModal(a.id);
}

function onHubAgeMonthChange(val) {
  const d = ageMonthsToBirthDate(val);
  if (d && $("edHubBirthDate")) $("edHubBirthDate").value = d;
}

function onHubBirthDateChange(d) {
  const m = birthDateToAgeMonths(d);
  if (m !== "" && $("edHubAgeMonths")) $("edHubAgeMonths").value = m;
}

function saveHubAnimalEdits(animalId) {
  const a = S.a.find(x => x.id === animalId);
  if (!a) return;

  const k = V("edHubTag").trim();
  if (!k) return alert("Küpe numarası boş bırakılamaz.");

  const s = V("edHubSex");
  const cat = V("edHubCat");
  const breed = V("edHubBreed");
  const origin = V("edHubOrigin");
  const bp = +V("edHubBuyPrice") || 0;

function triggerAnimalPhotoCapture(animalId, angleName = 'Ön Cephe') {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (re) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 300;
        c.height = 300;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, 300, 300);
        const dataUrl = c.toDataURL('image/jpeg', 0.75);
        const sig = extractCanvasVisualSignature(c);
        const a = S.a.find(x => x.id === animalId);
        if (a) {
          mutate(() => {
            if (!a.photo) a.photo = dataUrl;
            if (!a.photos) a.photos = [];
            a.photos.push({ angle: angleName, img: dataUrl, d: today() });
            if (a.photos.length > 8) a.photos.shift();
            if (!a.visSigs) a.visSigs = a.visSig ? [a.visSig] : [];
            a.visSigs.push(sig);
            if (a.visSigs.length > 8) a.visSigs.shift();
            a.visSig = sig;
          });
          alert(`${a.k} için "${angleName}" açısı hafızaya alındı! Hayvan artık bu açıdan da tanınacaktır.`);
          openAnimalDetailHubModal(a.id);
        }
      };
      img.src = re.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function executeHUDAction(action) {
  const a = S.a.find(x => x.id === HUD_ACTIVE_ANIMAL_ID);
  if (!a) return;

  if (action === 'dogurdu') {
    closeCameraHUD();
    openBirthModal(a.id);
  } else if (action === 'besiye_al') {
    const curLoc = a.location || 'Mera';
    const nextLoc = curLoc === 'Mera' ? 'Besi' : 'Mera';
    mutate(() => { a.location = nextLoc; });
    alert(`${a.k} adlı hayvan ${nextLoc === 'Besi' ? '🏡 Kapalı Besi Bölmesine alındı (Yem rasyonu başladı)' : '🏔️ Dağ Merasına çıkarıldı (Yem masrafı durduruldu)'}!`);
    const card = $('hudAnimalCard');
    if (card) card.innerHTML = renderHUDAnimalCardContent();
  } else if (action === 'asi_yap') {
    const medName = prompt(`${a.k} için uygulanan aşı veya ilaç adı:`, 'Enterotoksemi (Çelerme) Aşısı');
    if (!medName) return;
    const medCost = +prompt('Masraf tutarı (TL, yoksa 0):', '150') || 0;
    const withdrawal = +prompt('Et/Süt yasal arınma süresi (gün):', '14') || 0;
    mutate(() => {
      S.t.push({ id: Date.now(), d: today(), c: 'aşı', t: `${medName} (${a.k})`, cost: medCost, withdrawal, x: 1 });
      if (medCost > 0) {
        S.e.unshift({
          id: Date.now() + 1, d: today(), c: 'Aşı / İlaç / Serum / Parazit', an: a.id,
          ds: `${a.k} - ${medName} tedavisi`, q: 1, kg: 0, p: medCost, a: medCost, payMode: 'pesin', isSettled: true
        });
      }
    });
    alert(`${a.k} için ${medName} işlendi. ${withdrawal > 0 ? withdrawal + ' gün kesim arınma yasağı başlatıldı.' : ''}`);
    const card = $('hudAnimalCard');
    if (card) card.innerHTML = renderHUDAnimalCardContent();
  } else if (action === 'tarti') {
    const kg = prompt(`${a.k} için canlı ağırlık (kg):`, '46.5');
    if (kg && +kg > 0) {
      mutate(() => { S.w.push({ id: Date.now(), an: a.id, d: today(), kg: +kg }); });
      alert(`${a.k} tartısı ${kg} kg olarak işlendi.`);
      const card = $('hudAnimalCard');
      if (card) card.innerHTML = renderHUDAnimalCardContent();
    }
  } else if (action === 'bcs') {
    const bcs = prompt(`${a.k} Vücut Kondisyon Skoru (1=Aşırı Zayıf, 3=İdeal Damızlık, 5=Aşırı Yağlı):`, a.bcs || '3');
    if (bcs && +bcs >= 1 && +bcs <= 5) {
      mutate(() => { a.bcs = +bcs; });
      alert(`${a.k} BCS skoru ${bcs}/5 olarak güncellendi.`);
      const card = $('hudAnimalCard');
      if (card) card.innerHTML = renderHUDAnimalCardContent();
    }
  } else if (action === 'birlestir') {
    closeCameraHUD();
    openMergeVirtualTagModal(a.id);
  } else if (action === 'kasap_qr') {
    closeCameraHUD();
    openSecureButcherPortalModal(a.id);
  } else if (action === 'sonraki') {
    const active = S.a.filter(x => x.st === 'sürüde');
    const idx = active.findIndex(x => x.id === HUD_ACTIVE_ANIMAL_ID);
    const nextIdx = (idx + 1) % active.length;
    HUD_ACTIVE_ANIMAL_ID = active[nextIdx].id;
    const sel = $('hudManualSelect');
    if (sel) sel.value = String(HUD_ACTIVE_ANIMAL_ID);
    const card = $('hudAnimalCard');
    if (card) card.innerHTML = renderHUDAnimalCardContent();
  }
}

function toggleHUDVoiceRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    return alert('Tarayıcınız ses tanıma özelliğini desteklemiyor. Chrome veya Edge kullanabilirsiniz.');
  }

  if (HUD_IS_LISTENING) {
    if (HUD_VOICE_RECOGNITION) HUD_VOICE_RECOGNITION.stop();
    HUD_IS_LISTENING = false;
    if ($('hudVoiceState')) $('hudVoiceState').textContent = 'Kapalı';
    return;
  }

  HUD_VOICE_RECOGNITION = new SpeechRecognition();
  HUD_VOICE_RECOGNITION.lang = 'tr-TR';
  HUD_VOICE_RECOGNITION.continuous = true;
  HUD_VOICE_RECOGNITION.interimResults = false;

  HUD_VOICE_RECOGNITION.onstart = () => {
    HUD_IS_LISTENING = true;
    if ($('hudVoiceState')) $('hudVoiceState').textContent = '🟢 Dinliyor...';
    setStatus('Ses tanıma devrede. "Tartı 45", "Aşı yapıldı", "Besiye al" diyebilirsiniz.');
  };

  HUD_VOICE_RECOGNITION.onresult = (ev) => {
    const transcript = ev.results[ev.results.length - 1][0].transcript.trim().toLowerCase();
    handleVoiceCommand(transcript);
  };

  HUD_VOICE_RECOGNITION.onerror = () => {
    HUD_IS_LISTENING = false;
    if ($('hudVoiceState')) $('hudVoiceState').textContent = 'Hata';
  };

  HUD_VOICE_RECOGNITION.onend = () => {
    HUD_IS_LISTENING = false;
    if ($('hudVoiceState')) $('hudVoiceState').textContent = 'Kapalı';
  };

  HUD_VOICE_RECOGNITION.start();
}

function handleVoiceCommand(cmd) {
  const a = S.a.find(x => x.id === HUD_ACTIVE_ANIMAL_ID);
  if (!a) return;

  if (cmd.includes('doğur') || cmd.includes('kuzu')) {
    executeHUDAction('dogurdu');
  } else if (cmd.includes('besi') || cmd.includes('padok')) {
    executeHUDAction('besiye_al');
  } else if (cmd.includes('mera') || cmd.includes('dağ')) {
    mutate(() => { a.location = 'Mera'; });
    alert(`${a.k} Meraya alındı.`);
    const card = $('hudAnimalCard'); if (card) card.innerHTML = renderHUDAnimalCardContent();
  } else if (cmd.includes('tartı') || cmd.includes('kilo')) {
    const num = cmd.replace(/[^0-9.]/g, '');
    if (num && +num > 0) {
      mutate(() => { S.w.push({ id: Date.now(), an: a.id, d: today(), kg: +num }); });
      alert(`${a.k} tartısı sesle ${num} kg işlendi.`);
      const card = $('hudAnimalCard'); if (card) card.innerHTML = renderHUDAnimalCardContent();
    } else {
      executeHUDAction('tarti');
    }
  } else if (cmd.includes('aşı') || cmd.includes('ilaç')) {
    executeHUDAction('asi_yap');
  } else if (cmd.includes('sonraki') || cmd.includes('geç')) {
    executeHUDAction('sonraki');
  }
}

function executeMergeVirtualTag(animalId) {
  const a = S.a.find(x => x.id === animalId);
  if (!a) return;
  const newTag = V('mrgOfficialTag').trim();
  if (!newTag) return alert('Lütfen geçerli bir resmi küpe numarası girin.');
  if (S.a.some(x => x.id !== a.id && x.k.toLowerCase() === newTag.toLowerCase())) {
    return alert('Bu küpe numarası zaten başka bir hayvanda kayıtlı!');
  }

  const oldTag = a.k;
  mutate(() => {
    a.k = newTag;
    a.isVirtual = false;
    S.a.forEach(lamb => {
      if (lamb.m === oldTag) lamb.m = newTag;
      if (lamb.f === oldTag) lamb.f = newTag;
    });
  });

  closeModal();
  alert(`Harika! ${oldTag} sanal küpesi başarıyla ${newTag} TÜRKVET resmi küpesine birleştirildi.`);
  renderApp();
}


function printButcherReceipt() {
  document.body.classList.add("printing-modal");
  const mb = document.getElementById("modalBackdrop");
  if (mb) mb.classList.add("printing-active");
  const cleanup = () => {
    document.body.classList.remove("printing-modal");
    if (mb) mb.classList.remove("printing-active");
    window.removeEventListener("afterprint", cleanup);
  };
  window.addEventListener("afterprint", cleanup);
  setTimeout(() => {
    window.print();
    setTimeout(cleanup, 2000);
  }, 100);
}

window.addEventListener("beforeprint", () => {
  const mb = document.getElementById("modalBackdrop");
  if (mb && mb.classList.contains("open")) {
    document.body.classList.add("printing-modal");
    mb.classList.add("printing-active");
  }
});

window.addEventListener("afterprint", () => {
  document.body.classList.remove("printing-modal");
  const mb = document.getElementById("modalBackdrop");
  if (mb) mb.classList.remove("printing-active");
});

      <div style="margin-top:12px; font-size:11.5px; color:var(--tx-sec); display:flex; justify-content:space-between; align-items:center">
        <span>İşletme: <b>${S.farmName || 'DENİZ & HASAN BESİ'}</b></span>
        <span>Rapor Tarihi: <b>${today()}</b></span>
      </div>
    </div>

    <div style="display:flex; gap:8px">
      <button class="btn btn-primary" style="flex:1" onclick="printButcherReceipt()">🖨️ Raporu Yazdır / PDF</button>
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Kapat</button>
    </div>
  `;
  openModal();
}
function renderUnpaintedMatingCohortHtml() {
  const ewesCount = S.a.filter(a => a.s === 'D' && a.st === 'sürüde').length || 200;
  return `
    <div class="card" style="border-top:4px solid var(--amber)">
      <div class="card-title">
        <span>🏔️ Boyasız Dağ Koç Katımı & 3 Dalgalı Doğum Kohort Motoru</span>
        <span class="badge badge-amber">Metot 4: 17 Günlük Sikluslar</span>
      </div>
      

      <div class="form-row">
        ${inp('cohortRamDate', 'Koç Salınım Tarihi *', 'date', addDays(today(), -120), 'onchange="calcUnpaintedCohorts()"')}
        ${inp('cohortEwesCount', 'Koça Katılan Anaç Koyun Sayısı', 'number', ewesCount, 'inputmode="decimal" oninput="calcUnpaintedCohorts()"')}
        ${inp('cohortTwinningEst', 'Tahmini İkizlik Oranı (%)', 'number', '35', 'inputmode="decimal" oninput="calcUnpaintedCohorts()"')}
      </div>

      <div id="cohortResultBox" style="margin-top:10px"></div>

      <!-- 45-60 GÜN TARTI VE 70+ GÜN SAĞ KARIN ASİMETRİ KONTROL REHBERİ -->
      <div style="background:var(--card-sub); border:1px solid var(--ln); border-radius:8px; padding:12px; margin-top:12px">
        <b style="font-size:13px; color:var(--primary)">🔍 Kısır / Boş Kalan Koyunları Ayıklama Kılavuzu:</b>
        <div style="font-size:12px; color:var(--tx-sec); margin-top:4px; line-height:1.6">
          • <b>45-60. Gün Tartı Filtresi:</b> Koç salımından 45-60 gün sonra canlı ağırlığında en az %6-8 artış olmayan anaçlar gebe kalmamış olabilir.<br>
          • <b>70+ Gün Sağ Karın Asimetrisi:</b> Gebe koyunun karnı arkadan bakıldığında sağ tarafa doğru belirgin şekilde genişler (işkembe soldadır, rahim sağa yatar).<br>
          • <b>Iskarta / Kasap Sevki:</b> 3. dalgadan sonra hala boş kalan koyunlar gereksiz kışlık yem tüketmemesi için damızlıktan çıkarılıp kasaba sevk edilmelidir.
        </div>
      </div>
    </div>
  `;
}

function calcUnpaintedCohorts() {
  const ramDateStr = V('cohortRamDate') || addDays(today(), -120);
  const totalEwes = +V('cohortEwesCount') || 200;
  const twinPct = (+V('cohortTwinningEst') || 35) / 100;

  const wave1Ewes = Math.round(totalEwes * 0.70);
  const wave1Lambs = Math.round(wave1Ewes * (1 + twinPct));
  const wave1Date = addDays(ramDateStr, 150);

  const wave2Ewes = Math.round(totalEwes * 0.20);
  const wave2Lambs = Math.round(wave2Ewes * (1 + twinPct));
  const wave2Date = addDays(ramDateStr, 167);

  const wave3Ewes = Math.max(0, totalEwes - wave1Ewes - wave2Ewes);
  const wave3Lambs = Math.round(wave3Ewes * (1 + twinPct));
  const wave3Date = addDays(ramDateStr, 184);

  const totalExpectedLambs = wave1Lambs + wave2Lambs + wave3Lambs;

  const res = $('cohortResultBox');
  if (res) {
    res.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Doğum Dalgası</th>
              <th>Östrus Siklusu</th>
              <th>Tahmini Doğum Başlangıcı</th>
              <th class="text-right">Doğuracak Koyun</th>
              <th class="text-right">Beklenen Kuzu</th>
              <th>Ağıl Hazırlığı</th>
            </tr>
          </thead>
          <tbody>
            <tr style="background:var(--primary-light); font-weight:700">
              <td><b>🌊 1. Ana Dalga (%70)</b></td>
              <td>1. Siklus (1-17 gün)</td>
              <td><b>${wave1Date}</b></td>
              <td class="text-right tx-green"><b>${wave1Ewes} Baş</b></td>
              <td class="text-right tx-green"><b>~${wave1Lambs} Kuzu</b></td>
              <td>Doğum bölmelerini hazırla, kolostrum hazırla</td>
            </tr>
            <tr>
              <td><b>🌊 2. Dalga (%20)</b></td>
              <td>2. Siklus (18-35 gün)</td>
              <td><b>${wave2Date}</b></td>
              <td class="text-right tx-blue"><b>${wave2Ewes} Baş</b></td>
              <td class="text-right tx-blue"><b>~${wave2Lambs} Kuzu</b></td>
              <td>İkinci parti doğum padokları</td>
            </tr>
            <tr>
              <td><b>🌊 3. Geç Dalga (%10)</b></td>
              <td>3. Siklus (36-52 gün)</td>
              <td><b>${wave3Date}</b></td>
              <td class="text-right tx-amber"><b>${wave3Ewes} Baş</b></td>
              <td class="text-right tx-amber"><b>~${wave3Lambs} Kuzu</b></td>
              <td>Geç doğuranlar (Kısır kontrolü yap)</td>
            </tr>
            <tr style="border-top:2px solid var(--ln); background:var(--card-sub)">
              <td colspan="3"><b>TOPLAM SEZON BEKLENTİSİ</b></td>
              <td class="text-right"><b>${totalEwes} Koyun</b></td>
              <td class="text-right tx-green"><b style="font-size:15px">~${totalExpectedLambs} Kuzu</b></td>
              <td>İkizlik: %${Math.round(twinPct * 100)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
  }
}


</script>
</body>
</html>
