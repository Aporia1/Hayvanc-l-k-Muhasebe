<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Koyun & Küçükbaş Muhasebe ve Sürü Yönetimi (Bulut & Senkron)</title>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-sub: #f1f5f9;
  --tx: #0f172a;
  --tx-sec: #475569;
  --mut: #64748b;
  --ln: #e2e8f0;
  --primary: #15803d;
  --primary-hover: #166534;
  --primary-light: #dcfce7;
  --g: #16a34a;
  --g-light: #dcfce7;
  --r: #dc2626;
  --r-light: #fee2e2;
  --b: #2563eb;
  --b-light: #dbeafe;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --purple: #7c3aed;
  --purple-light: #f3e8ff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
  --drawer-w: 295px;
}

[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --card-sub: #0f172a;
  --tx: #f8fafc;
  --tx-sec: #cbd5e1;
  --mut: #94a3b8;
  --ln: #334155;
  --primary: #22c55e;
  --primary-hover: #16a34a;
  --primary-light: #064e3b;
  --g: #4ade80;
  --g-light: #064e3b;
  --r: #f87171;
  --r-light: #450a0a;
  --b: #60a5fa;
  --b-light: #172554;
  --amber: #fbbf24;
  --amber-light: #451a03;
  --purple: #c084fc;
  --purple-light: #3b0764;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--bg); color: var(--tx); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.5; }

#app { display: flex; flex-direction: column; min-height: 100vh; }
.app-header { position: sticky; top: 0; z-index: 40; background: var(--card); border-bottom: 1px solid var(--ln); box-shadow: var(--shadow); height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
.app-header-left { display: flex; align-items: center; gap: 10px; }
.app-header-right { display: flex; align-items: center; gap: 6px; }
.app-title { font-size: 16px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 6px; }
.app-subtitle { font-size: 11px; color: var(--mut); font-weight: 500; }
.main-content { flex: 1; max-width: 980px; width: 100%; margin: 0 auto; padding: 14px 12px 100px; }

/* Buttons & Controls */
button, input, select, textarea { font: inherit; color: var(--tx); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; border: 1px solid transparent; cursor: pointer; transition: all 0.15s ease; text-decoration: none; }
.btn:hover { filter: brightness(0.95); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--primary); color: #ffffff; }
.btn-secondary { background: var(--card-sub); border-color: var(--ln); color: var(--tx); }
.btn-danger { background: var(--r); color: #ffffff; }
.btn-outline-danger { background: transparent; border-color: var(--r); color: var(--r); }
.btn-outline-primary { background: transparent; border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 5px 9px; font-size: 12px; border-radius: 6px; }
.btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 8px; background: transparent; border: 1px solid var(--ln); color: var(--tx); display: inline-flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; position: relative; }
.btn-icon:hover { background: var(--card-sub); }
.badge-dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--r); border: 2px solid var(--card); }

label { display: block; font-size: 12px; font-weight: 600; color: var(--tx-sec); margin-bottom: 4px; margin-top: 8px; }
label:first-child { margin-top: 0; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--ln); background: var(--card); color: var(--tx); font-size: 13.5px; transition: border-color 0.15s; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 6px; }

/* Cards & Surfaces */
.card { background: var(--card); border: 1px solid var(--ln); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card-title { font-size: 15px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }

/* KPI Grid */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
.kpi-card { background: var(--card-sub); border: 1px solid var(--ln); border-radius: 10px; padding: 10px; position: relative; overflow: hidden; }
.kpi-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3.5px; }
.kpi-green::before { background: var(--g); }
.kpi-red::before { background: var(--r); }
.kpi-blue::before { background: var(--b); }
.kpi-amber::before { background: var(--amber); }
.kpi-purple::before { background: var(--purple); }
.kpi-label { font-size: 11px; font-weight: 600; color: var(--mut); text-transform: uppercase; letter-spacing: 0.3px; }
.kpi-val { font-size: 17px; font-weight: 800; margin: 2px 0 1px; color: var(--tx); }
.kpi-sub { font-size: 11px; color: var(--mut); }

.tx-green { color: var(--g); }
.tx-red { color: var(--r); }
.tx-blue { color: var(--b); }
.tx-amber { color: var(--amber); }
.tx-purple { color: var(--purple); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 12px; font-size: 11px; font-weight: 600; line-height: 1.4; }
.badge-g { background: var(--g-light); color: var(--g); }
.badge-r { background: var(--r-light); color: var(--r); }
.badge-b { background: var(--b-light); color: var(--b); }
.badge-amber { background: var(--amber-light); color: var(--amber); }
.badge-purple { background: var(--purple-light); color: var(--purple); }
.badge-mut { background: var(--card-sub); color: var(--mut); border: 1px solid var(--ln); }

/* Navigation Drawer */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; backdrop-filter: blur(2px); }
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: var(--drawer-w); max-width: 85vw; background: var(--card); z-index: 55; box-shadow: var(--shadow-lg); transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; }
.drawer.open { transform: translateX(0); }
.drawer-header { padding: 16px 14px 12px; border-bottom: 1px solid var(--ln); background: var(--card-sub); }
.drawer-nav { flex: 1; overflow-y: auto; padding: 8px 6px; }
.drawer-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: var(--radius-sm); color: var(--tx); text-decoration: none; font-weight: 600; font-size: 13.5px; margin-bottom: 2px; cursor: pointer; transition: background 0.15s; }
.drawer-item:hover { background: var(--card-sub); }
.drawer-item.active { background: var(--primary); color: #ffffff; }
.drawer-item.active .badge { background: rgba(255,255,255,0.25); color: #ffffff; }
.drawer-footer { padding: 10px 14px; border-top: 1px solid var(--ln); font-size: 11px; color: var(--mut); display: flex; flex-direction: column; gap: 3px; background: var(--card-sub); }

/* Bottom Mobile Nav */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--ln); height: 56px; display: flex; align-items: center; justify-content: space-around; box-shadow: 0 -1px 4px rgba(0,0,0,0.05); }
@media (min-width: 800px) { .bottom-nav { display: none; } }
.bnav-item { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--mut); font-size: 10px; font-weight: 600; cursor: pointer; border: 0; background: transparent; padding: 0; }
.bnav-item.active { color: var(--primary); }
.bnav-item span.icon { font-size: 18px; }

/* Sticky Bulk Action Bar */
.bulk-bar { position: fixed; bottom: 62px; left: 50%; transform: translateX(-50%); z-index: 35; background: var(--card); border: 2px solid var(--primary); border-radius: 30px; box-shadow: var(--shadow-lg); padding: 8px 14px; display: none; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 95vw; }
@media (min-width: 800px) { .bulk-bar { bottom: 20px; } }
.bulk-bar.visible { display: flex; }

/* Status Bar & Alert Box */
#st { font-size: 11.5px; color: var(--mut); padding: 5px 10px; background: var(--card-sub); border-radius: 6px; margin-bottom: 10px; border: 1px solid var(--ln); display: flex; align-items: center; justify-content: space-between; }
.alert { padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 10px; font-size: 12.5px; display: flex; align-items: flex-start; gap: 8px; }
.alert-warning { background: var(--amber-light); color: var(--amber); border: 1px solid var(--amber); }
.alert-info { background: var(--b-light); color: var(--b); border: 1px solid var(--b); }
.alert-success { background: var(--g-light); color: var(--g); border: 1px solid var(--g); }
.alert-danger { background: var(--r-light); color: var(--r); border: 1px solid var(--r); }

/* Item List Card */
.list-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--ln); }
.list-item:first-of-type { border-top: 0; }
.list-content { flex: 1; }
.list-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* Tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 7px 8px; font-weight: 600; color: var(--mut); border-bottom: 2px solid var(--ln); white-space: nowrap; font-size: 12px; }
td { padding: 7px 8px; border-bottom: 1px solid var(--ln); white-space: nowrap; }
tr:hover td { background: var(--card-sub); }
.text-right { text-align: right; }
.text-center { text-align: center; }

/* Modals */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 60; display: none; align-items: center; justify-content: center; padding: 12px; backdrop-filter: blur(2px); }
.modal-backdrop.open { display: flex; }
.modal { background: var(--card); border: 1px solid var(--ln); border-radius: var(--radius); width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto; padding: 18px; box-shadow: var(--shadow-lg); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--ln); }
.modal-title { font-size: 16px; font-weight: 700; margin: 0; }
.close-modal { background: transparent; border: 0; font-size: 20px; color: var(--mut); cursor: pointer; padding: 0 4px; }

/* Checkbox styling */
input[type="checkbox"] { width: 17px; height: 17px; cursor: pointer; accent-color: var(--primary); }

@media print {
  .app-header, .drawer, .drawer-backdrop, .bottom-nav, .bulk-bar, .no-print, button, .btn { display: none !important; }
  body { background: #fff !important; color: #000 !important; font-size: 12px; }
  .card { box-shadow: none !important; border: 1px solid #ccc !important; page-break-inside: avoid; }
  .main-content { max-width: 100% !important; padding: 0 !important; }
}
</style>
</head>

<div id="app">

const parseDate = s => {
  if (!s) return null;

  if (p.length !== 3 || isNaN(p[0])) return null;
  return new Date(p[0], p[1] - 1, p[2]);
};

const daysBetween = (a, b) => {
  const da = parseDate(a), db = parseDate(b);
  if (!da || !db) return 0;
  return Math.round((db - da) / 864e5);
};

const addDays = (dStr, n) => {
  const d = parseDate(dStr) || new Date();
  d.setDate(d.getDate() + (+n || 0));

function computeCosts() {
  const td = today();
  
  // Ortak işletme giderleri (Hayvan alımı hariç genel yem, bakım, işçilik, elektrik, su vb.)
  const generalOperatingExpenses = S.e
    .filter(x => kind(x.c) === 'gider' && x.c !== 'Hayvan alımı' && !x.an)
    .reduce((s, x) => s + (+x.a || 0), 0);

  const firstTx = S.e.map(x => x.d).filter(Boolean).sort()[0] || td;

  let totalHerdAnimalDays = 0;
  const animalDaysMap = {};

  S.a.forEach(a => {
    const n = Math.max(1, +a.n || 1);
    const entryDate = a.bd || a.b || firstTx;
    const exitDate = a.st === 'sürüde' ? td : (a.sd || td);
    const d = Math.max(1, daysBetween(entryDate, exitDate));
    animalDaysMap[a.id] = d;
    totalHerdAnimalDays += d * n;
  });

  const dailyOverheadRate = totalHerdAnimalDays > 0 ? (generalOperatingExpenses / totalHerdAnimalDays) : 0;

  const costMap = {};
  let totalActiveBuyCost = 0;
  let totalActiveTotalCost = 0;
  let totalActiveHeadCount = 0;
  let totalActiveLiveWeight = 0;
  let activeWithWeightCount = 0;
  let activePurchasedCount = 0;

  // Grup istatistikleri haritası
  const groupStats = {};
  (S.groups || []).forEach(g => {
    groupStats[g.id] = { count: 0, totalCost: 0, totalWeight: 0, weightCount: 0 };
  });

  S.a.forEach(a => {
    const n = Math.max(1, +a.n || 1);
    const daysInHerd = animalDaysMap[a.id] || 1;
    
    const directExpenses = S.e
      .filter(x => x.an == a.id && kind(x.c) === 'gider' && x.c !== 'Hayvan alımı')
      .reduce((s, x) => s + (+x.a || 0), 0);

    const directIncome = S.e
      .filter(x => x.an == a.id && kind(x.c) === 'gelir')
      .reduce((s, x) => s + (+x.a || 0), 0);

    let acqCost = 0;
    if (a.bp !== undefined && a.bp !== null && a.bp !== "" && +a.bp > 0) {
      acqCost = (+a.bp) * n;
    } else {
      const tiedBuy = S.e
        .filter(x => x.an == a.id && x.c === 'Hayvan alımı')
        .reduce((s, x) => s + (+x.a || 0), 0);
      acqCost = tiedBuy;
    }

    const overheadShare = daysInHerd * n * dailyOverheadRate;
    const totalCost = acqCost + directExpenses + overheadShare;
    const costPerHead = n > 0 ? (totalCost / n) : totalCost;
    const buyPricePerHead = n > 0 ? (acqCost / n) : 0;
    const dailyCostPerHead = (daysInHerd > 0 && n > 0) ? (directExpenses + overheadShare) / (daysInHerd * n) : 0;

    const weights = (S.w || []).filter(w => w.an == a.id).sort((x, y) => x.d.localeCompare(y.d));
    const latestWeight = weights.length ? +weights[weights.length - 1].kg : 0;
    const dailyWeightGain = weights.length > 1
      ? ((latestWeight - (+weights[0].kg)) / Math.max(1, daysBetween(weights[0].d, weights[weights.length - 1].d)) * 1000)
      : 0;

    let marketVal = 0;
    if (latestWeight > 0 && S.fp > 0) {
      marketVal = latestWeight * S.fp * n;
    } else if (S.fp > 0 && buyPricePerHead > 0) {
      marketVal = acqCost * 1.15;
    }

    let profit = null;
    if (a.st !== 'sürüde') {
      const finalInc = a.sp ? +a.sp : directIncome;
      profit = finalInc > 0 ? (finalInc - totalCost) : (0 - totalCost);
    } else {
      profit = marketVal > 0 ? (marketVal - totalCost) : null;
    }

    costMap[a.id] = {
      days: daysInHerd,
      n,
      acqCost,
      buyPricePerHead,
      directExpenses,
      overheadShare,
      totalCost,
      costPerHead,
      dailyCostPerHead,
      directIncome,
      latestWeight,
      dailyWeightGain,
      marketVal,
      profit
    };

    if (a.st === 'sürüde') {
      totalActiveHeadCount += n;
      totalActiveTotalCost += totalCost;
      if (acqCost > 0) {
        totalActiveBuyCost += acqCost;
        activePurchasedCount += n;
      }
      if (latestWeight > 0) {
        totalActiveLiveWeight += latestWeight * n;
        activeWithWeightCount += n;
      }

      // Grup metriklerini güncelle
      if (a.grp && Array.isArray(a.grp)) {
        a.grp.forEach(gId => {
          if (groupStats[gId]) {
            groupStats[gId].count += n;
            groupStats[gId].totalCost += totalCost;
            if (latestWeight > 0) {
              groupStats[gId].totalWeight += latestWeight * n;
              groupStats[gId].weightCount += n;
            }
          }
        });
      }
    }
  });

  const avgAcqCost = activePurchasedCount > 0 ? (totalActiveBuyCost / activePurchasedCount) : 0;
  const avgTotalCost = totalActiveHeadCount > 0 ? (totalActiveTotalCost / totalActiveHeadCount) : 0;
  const avgLiveWeight = activeWithWeightCount > 0 ? (totalActiveLiveWeight / activeWithWeightCount) : 0;
  const avgCostPerKg = totalActiveLiveWeight > 0 ? (totalActiveTotalCost / totalActiveLiveWeight) : 0;
  const flockEstimatedValue = (totalActiveLiveWeight * S.fp) + ((totalActiveHeadCount - activeWithWeightCount) * (avgTotalCost || 12000));
  const flockPotentialProfit = flockEstimatedValue - totalActiveTotalCost;

  return {
    costMap,
    groupStats,
    dailyOverheadRate,
    generalOperatingExpenses,
    totalHerdAnimalDays,
    totalActiveHeadCount,
    totalActiveBuyCost,
    activePurchasedCount,
    avgAcqCost,
    avgTotalCost,
    totalActiveLiveWeight,
    avgLiveWeight,
    avgCostPerKg,
    flockEstimatedValue,
    flockPotentialProfit
  };
}

function getFilteredEntries() {
  return S.e.filter(x => {
    const d = parseDate(x.d);
    if (!d) return true;
    if (FM && (d.getMonth() + 1) !== FM) return false;
    if (FY && d.getFullYear() !== FY) return false;
    if (ECAT !== "hepsi" && x.c !== ECAT) return false;
    if (ESEARCH) {
      const q = ESEARCH.toLowerCase();
      const matchDesc = (x.ds || "").toLowerCase().includes(q);
      const matchCat = (x.c || "").toLowerCase().includes(q);
      const animal = S.a.find(a => a.id == x.an);
      const matchAnimal = animal && (animal.k || "").toLowerCase().includes(q);
      if (!matchDesc && !matchCat && !matchAnimal) return false;
    }
    return true;
  }).sort((a, b) => b.d.localeCompare(a.d) || b.id - a.id);
}

function getFinancialStats(entries) {
  const g = sum(entries.filter(x => kind(x.c) === "gelir"));
  const r = sum(entries.filter(x => kind(x.c) === "gider"));
  return { g, r, net: g - r };
}

const getLoanBalance = () => 
  sum(S.e.filter(x => kind(x.c) === "kredi+")) - sum(S.e.filter(x => kind(x.c) === "kredi-"));

async function init() {
  try {
    const j = localStorage.getItem("koyun");
    if (j) {
      const parsed = JSON.parse(j);
      S = Object.assign({}, S, parsed);
      if (!S.feeds) S.feeds = [];
      if (!S.groups) S.groups = [];
      if (!S.loans) S.loans = [];
      if (!S.farmName) S.farmName = "Bereketli Küçükbaş Çiftliği";
    }
  } catch (e) {}

  try {
    const cl = await window.claude?.use("db");
    const us = await window.claude?.use("user");
    if (cl && us) {
      const u = await us.id();
      if (u) {
        ref = cl.collection("data/users/" + u).doc("store");
        const sn = await ref.get();
        if (sn.exists && sn.data().json) {
          S = Object.assign({}, S, JSON.parse(sn.data().json));
        } else {
          await save();
        }
      }
    }
  } catch (e) {}

  // Otomatik bulut eşitleme kontrolü
  if (S.cloudSync && S.cloudSync.endpointUrl) {
    try {
      setStatus("Buluttan güncel veriler çekiliyor...", "⏳ Eşitleniyor");
      const resp = await fetch(S.cloudSync.endpointUrl + "?action=get");
      if (resp.ok) {
        const cloudData = await resp.json();
        if (cloudData && cloudData.data && Array.isArray(cloudData.data.a)) {
          S = Object.assign({}, S, cloudData.data);
          try { localStorage.setItem("koyun", JSON.stringify(S)); } catch (e) {}
          setStatus("Buluttan en güncel veriler yüklendi.", "🟢 Canlı Eşitlendi");
        }
      }
    } catch (err) {
      setStatus("Bulut bağlantısı yok, yerel veriler kullanılıyor.", "🟡 Çevrimdışı");
    }
  }

  updateHeaderStatus();
  buildDrawerNav();
  setupEventListeners();
  renderApp();
}

async function save() {
  S.cloudSync.lastSync = new Date().toISOString();
  try {
    localStorage.setItem("koyun", JSON.stringify(S));
  } catch (e) {}
  if (ref) {
    try {
      await ref.set({ json: JSON.stringify(S) });
    } catch (e) {}
  }
  // Arka planda canlı bulut eşitlemesi (no-cors ile garantili arka plan gönderimi)
  if (S.cloudSync && S.cloudSync.endpointUrl) {
    sendDataToCloudEndpoint(S.cloudSync.endpointUrl, S);
  }
}

function mutate(actionFn) {
  HIST.push(JSON.stringify(S));
  if (HIST.length > 30) HIST.shift();
  actionFn();
  save();
  renderApp();
}

function updateHeaderStatus() {

  if (dot) dot.style.display = (urgentTasks.length || urgentBirths.length) ? "block" : "none";

function buildDrawerNav() {
  const container = $("drawerNav");
  if (!container) return;
  container.innerHTML = NAV_TABS.map(tab => {
    let badgeText = "";
    if (tab.id === 2) {
      const count = S.a.filter(a => a.st === "sürüde").reduce((acc, a) => acc + (+a.n || 1), 0);
      badgeText = count ? `${count} baş` : "";
    } else if (tab.id === 4) {
      badgeText = S.groups?.length ? `${S.groups.length}` : "";
    } else if (tab.id === 6) {
      const pending = S.t.filter(t => !t.x).length;
      badgeText = pending ? `${pending}` : "";
    } else if (tab.id === 7) {
      const pregnant = S.a.filter(a => a.ins && a.st === "sürüde").length;
      badgeText = pregnant ? `${pregnant}` : "";
    } else if (tab.id === 10) {
      badgeText = "Bulut";

    return `
      <div class="drawer-item ${tab.id === T ? "active" : ""}" data-tab="${tab.id}">
        <span style="display:flex; align-items:center; gap:10px">

  }).join("");

function toggleAnimalSelect(animalId) {
  const id = +animalId;
  if (SELECTED_ANIMALS.has(id)) {
    SELECTED_ANIMALS.delete(id);
  } else {
    SELECTED_ANIMALS.add(id);
  }
  updateBulkBar();
}

function toggleSelectAll(filteredOnly = true) {
  let list = S.a.filter(a => a.st === "sürüde");
  if (filteredOnly && T === 2) {
    list = S.a.filter(a => {
      if (AF !== "hepsi" && a.st !== AF) return false;
      if (ACAT !== "hepsi" && (a.cat || "Koyun") !== ACAT) return false;
      if (AGRP && (!a.grp || !a.grp.includes(+AGRP))) return false;
      if (ASEARCH) {
        const q = ASEARCH.toLowerCase();
        const matchK = (a.k || "").toLowerCase().includes(q);
        const matchBreed = (a.breed || "").toLowerCase().includes(q);
        if (!matchK && !matchBreed) return false;
      }
      return true;
    });
  }

  const allSelected = list.every(a => SELECTED_ANIMALS.has(a.id));
  if (allSelected) {
    list.forEach(a => SELECTED_ANIMALS.delete(a.id));
  } else {
    list.forEach(a => SELECTED_ANIMALS.add(a.id));
  }
  updateBulkBar();
  renderApp();
}

function clearSelectedAnimals() {
  SELECTED_ANIMALS.clear();
  updateBulkBar();
  renderApp();
}

function updateBulkBar() {
  const bar = $("bulkBar");
  const countLabel = $("bulkCountLabel");
  const count = SELECTED_ANIMALS.size;
  if (bar) {
    if (count > 0) {
      bar.classList.add("visible");
      if (countLabel) countLabel.textContent = `${count} Baş Seçildi`;
    } else {
      bar.classList.remove("visible");
    }
  }
}

function renderTrendSvgChart() {
  const d = new Date();
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
    months.push(dt.getFullYear() + "-" + p2(dt.getMonth() + 1));
  }

  const getMonthSum = (mStr, k) => S.e
    .filter(x => x.d && x.d.slice(0, 7) === mStr && kind(x.c) === k)
    .reduce((s, x) => s + (+x.a || 0), 0);

  const incData = months.map(m => getMonthSum(m, "gelir"));
  const expData = months.map(m => getMonthSum(m, "gider"));
  const maxVal = Math.max(1000, ...incData, ...expData);

  const w = 380, h = 130, paddingB = 24, paddingT = 10;
  const chartH = h - paddingB - paddingT;
  const colW = (w - 20) / 12;

  let bars = "";
  months.forEach((m, i) => {
    const x = 10 + i * colW;
    const hInc = (incData[i] / maxVal) * chartH;
    const hExp = (expData[i] / maxVal) * chartH;
    const yInc = paddingT + chartH - hInc;
    const yExp = paddingT + chartH - hExp;
    const barW = Math.max(3, colW * 0.35);

    bars += `
      <rect x="${x}" y="${yInc}" width="${barW}" height="${hInc}" rx="2" fill="var(--g)" opacity="0.9"/>
      <rect x="${x + barW + 1.5}" y="${yExp}" width="${barW}" height="${hExp}" rx="2" fill="var(--r)" opacity="0.9"/>
      <text x="${x + barW}" y="${h - 6}" font-size="8.5" text-anchor="middle" fill="var(--mut)">${m.slice(5)}</text>
    `;
  });

  return `
    <div style="width:100%; overflow-x:auto">
      <svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:320px; max-height:160px">
        <line x1="10" y1="${paddingT + chartH}" x2="${w - 10}" y2="${paddingT + chartH}" stroke="var(--ln)" stroke-width="1"/>
        ${bars}
      </svg>
    </div>
  `;
}

function onLedgerCategoryChange(catName) {
  const isCredit = (catName === "Kredi çekildi" || kind(catName) === "kredi+");
  const creditBox = $("creditLoanBox");
  if (creditBox) creditBox.style.display = isCredit ? "block" : "none";
  const hint = $("buyHintBox");
  if (hint) hint.style.display = catName === "Hayvan alımı" ? "block" : "none";
  if (isCredit) calcCreditForm();
}

function onEntryAmountChange() {
  calcCreditForm();
}

function calcCreditForm() {
  const amt = +V("entryAmount") || 0;
  const rate = +V("clRate") || 0;
  const months = +V("clMonths") || 1;
  const r = rate / 1200;

  if (amt > 0 && months > 0) {
    const monthly = r ? (amt * r / (1 - Math.pow(1 + r, -months))) : (amt / months);
    const totalBack = monthly * months;
    const totalInt = totalBack - amt;
    const resEl = $("clCalcResult");
    if (resEl) {
      resEl.innerHTML = `
        <div>Aylık Taksit: <b class="tx-blue">${F(monthly)}</b></div>
        <div>Toplam Geri Ödeme: <b>${F(totalBack)}</b> · Toplam Faiz: <b class="tx-red">${F(totalInt)}</b></div>
      `;
    }
  }
}

      <div class="form-row">
        <div>
          <label>Küpe No veya Irk Ara</label>
          <input type="text" id="flockSearch" placeholder="Küpe, anne küpe, ırk ara..." value="${E(ASEARCH)}">
        </div>
        <div>
          <label>Durum Filtresi</label>
          <select id="flockStatusFilter">
            ${optList([["sürüde", "Sürüde Olanlar"], ["satıldı", "Satılanlar"], ["kesildi", "Kesilenler"], ["öldü", "Ölenler"], ["hepsi", "Hepsi"]], AF)}
          </select>
        </div>
        <div>
          <label>Sınıf Filtresi</label>
          <select id="flockCatFilter">
            <option value="hepsi">Tüm Sınıflar</option>
            ${categories.map(c => `<option value="${c}"${ACAT === c ? " selected" : ""}>${c}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>Grup Filtresi</label>
          <select id="flockGroupFilter">
            <option value="0">Tüm Gruplar</option>
            ${(S.groups || []).map(g => `<option value="${g.id}"${+AGRP === g.id ? " selected" : ""}>${E(g.name)}</option>`).join("")}
          </select>
        </div>
      </div>

      <div style="margin-top:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px">
        <div style="display:flex; align-items:center; gap:8px">
          <button class="btn btn-secondary btn-sm" onclick="toggleSelectAll(true)">
            ${allSelected ? 'Seçimi Temizle' : '☑️ Tümünü Seç (' + list.length + ')'}
          </button>
          <span style="font-size:12px; color:var(--mut)">Listelenen: <b>${list.length} baş</b></span>
        </div>
        <div style="font-size:12px">
          Ortalama Maliyet: <b class="tx-red">${F(cData.avgTotalCost)}</b>
        </div>
      </div>
    </div>

    <!-- Hayvan Kartları Listesi -->
    <div class="card">
      <div class="card-title">
        <span>Hayvan Listesi & Detaylı Maliyet Bilançosu</span>
        <button class="btn btn-secondary btn-sm" onclick="switchTab(4)">🏷️ Grupları Yönet</button>
      </div>

      ${list.map(a => {
        const c = cData.costMap[a.id] || {};
        const isSelected = SELECTED_ANIMALS.has(a.id);
        const ageDays = a.b ? daysBetween(a.b, a.sd || td) : (a.bd ? daysBetween(a.bd, a.sd || td) : 0);
        const ageStr = ageDays < 60 ? `${ageDays} gün` : `${Math.round(ageDays / 30.4)} aylık`;
        const groupObj = (S.groups || []).find(g => a.grp && a.grp.includes(g.id));

        return `
          <div class="list-item" style="padding:10px 0; background:${isSelected ? 'var(--primary-light)' : 'transparent'}; border-radius:6px">
            <!-- Seçim Onay Kutusu -->
            <div style="padding:0 6px; display:flex; align-items:center">
              <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleAnimalSelect(${a.id})" title="Toplu işlem için seç">
            </div>

            <div class="list-content">
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap">
                <b style="font-size:15px">${E(a.k)}</b>
                <span class="badge ${a.s === 'E' ? 'badge-b' : 'badge-purple'}">${a.s === 'E' ? '♂ Erkek' : '♀ Dişi'}</span>
                <span class="badge badge-mut">${E(a.cat || 'Koyun')}</span>
                ${a.breed ? `<span class="badge badge-mut">${E(a.breed)}</span>` : ''}
                ${groupObj ? `<span class="badge" style="background:${groupObj.color}22; color:${groupObj.color}; border:1px solid ${groupObj.color}">🏷️ ${E(groupObj.name)}</span>` : ''}
                <span class="badge ${a.st === 'sürüde' ? 'badge-g' : (a.st === 'satıldı' ? 'badge-b' : 'badge-r')}">${a.st}</span>
              </div>

              <div style="font-size:12px; color:var(--tx-sec); margin-top:3px">
                ${a.b ? `Doğum: ${a.b} (${ageStr}) · ` : ''}
                ${a.m ? `Anne: ${E(a.m)} · ` : ''}
                ${a.pad ? `Bölme: ${E(a.pad)} · ` : ''}
                Geliş: <b>${a.origin || 'Bilinmiyor'}</b>
              </div>

              <div style="font-size:12px; color:var(--tx-sec); margin-top:2px">
                ${c.latestWeight ? `Son Tartı: <b>${c.latestWeight} kg</b>` : 'Tartı yok'}
                ${c.dailyWeightGain ? ` · Canlı Artış: <b class="tx-green">${Math.round(c.dailyWeightGain)} g/gün</b>` : ''}
                ${a.ins && a.st === 'sürüde' ? ` · <span class="tx-amber">Tahmini Doğum: ${addDays(a.ins, 150)}</span>` : ''}
              </div>

              <!-- Maliyet Dökümü -->
              <div style="margin-top:6px; background:var(--card-sub); border:1px solid var(--ln); border-radius:6px; padding:6px 8px; font-size:11.5px">
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px">
                  <span>Alış: <b>${F(c.buyPricePerHead || 0)}</b></span>
                  <span>Doğrudan Masraf: <b>${F(c.directExpenses || 0)}</b></span>
                  <span>Yem/Bakım Payı (${c.days || 0} gün): <b>${F(c.overheadShare || 0)}</b></span>
                </div>
                <div style="border-top:1px dashed var(--ln); margin-top:4px; padding-top:4px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap">
                  <span style="font-weight:700">Toplam Birikmiş Maliyet: <span class="tx-red">${F(c.totalCost || 0)}</span></span>
                  ${c.profit !== null ? `
                    <span style="font-weight:700">
                      ${a.st === 'sürüde' ? 'Piyasa Değerine Göre Kâr:' : 'Gerçekleşen Kâr:'} 
                      <span class="${c.profit >= 0 ? 'tx-green' : 'tx-red'}">${c.profit >= 0 ? '+' : ''}${F(c.profit)}</span>
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>

            <div class="list-actions">
              <div style="display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end">
                <button class="btn btn-secondary btn-sm" onclick="openWeightModal(${a.id})">⚖️ Tart</button>
                <button class="btn btn-secondary btn-sm" onclick="editAnimal(${a.id})">Düzenle</button>
                <button class="btn btn-outline-danger btn-sm" onclick="deleteAnimal(${a.id})">Sil</button>
              </div>
              ${a.st === 'sürüde' ? `
                <button class="btn btn-outline-primary btn-sm" style="margin-top:4px" onclick="openSingleSaleModal(${a.id})">💰 Satış Yap</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join("") || '<div style="padding:20px; text-align:center; color:var(--mut)">Filtreye uygun hayvan bulunamadı.</div>'}
    </div>
  `;
}

function viewGroups() {
  const groups = S.groups || [];

  return `
    <div class="card" style="border-top:4px solid var(--purple)">

      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:10px">
        ${groups.map(g => {
          const stats = cData.groupStats[g.id] || { count: 0, totalCost: 0, totalWeight: 0 };
          const avgCost = stats.count > 0 ? (stats.totalCost / stats.count) : 0;
          return `
            <div style="background:var(--card-sub); border:1px solid var(--ln); border-left:4px solid ${g.color || 'var(--purple)'}; border-radius:var(--radius-sm); padding:12px">
              <div style="display:flex; justify-content:space-between; align-items:flex-start">
                <div>
                  <b style="font-size:15px">${E(g.name)}</b>
                  <div style="font-size:11.5px; color:var(--mut); margin-top:2px">${E(g.desc || '')}</div>
                </div>
                <span class="badge" style="background:${g.color || 'var(--purple)'}22; color:${g.color || 'var(--purple)'}; font-weight:700">
                  ${stats.count} Baş
                </span>
              </div>

              <div style="margin-top:10px; font-size:12px; display:grid; grid-template-columns:1fr 1fr; gap:6px">
                <div>Toplam Ağırlık: <b>${N(stats.totalWeight)} kg</b></div>
                <div>Ort. Maliyet/Baş: <b class="tx-red">${F(avgCost)}</b></div>
                <div>Grup Toplam Maliyeti: <b class="tx-red">${F(stats.totalCost)}</b></div>

              </div>

              <div style="margin-top:10px; border-top:1px dashed var(--ln); padding-top:8px; display:flex; justify-content:space-between">

    </div>
  `;
}

/* ==========================================================================
   GÖRÜNÜM 5: YEM & STOK TAKİBİ
   ========================================================================== */

function viewFeeds() {
  const feeds = S.feeds || [];
  const costs = computeCosts();
  const headCount = costs.totalActiveHeadCount || 1;

  let totalDailyCost = 0;
  feeds.forEach(f => {
    totalDailyCost += (f.dailyTotalKg || 0) * (f.costPerKg || 0);
  });
  const dailyCostPerHead = totalDailyCost / headCount;

  return `
    <div class="card" style="border-top:4px solid var(--amber)">
      <div class="card-title">
        <span>🌾 Yem Stoğu & Günlük Rasyon Tüketimi</span>
        <button class="btn btn-primary btn-sm" onclick="openAddFeedModal()">+ Yeni Yem Ekle / Al</button>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card kpi-amber">
          <div class="kpi-label">Günlük Sürü Yem Gideri</div>
          <div class="kpi-val tx-amber">${F(totalDailyCost)}</div>
          <div class="kpi-sub">Günde ${feeds.reduce((s, f) => s + (f.dailyTotalKg || 0), 0)} kg yem</div>
        </div>
        <div class="kpi-card kpi-blue">
          <div class="kpi-label">Baş Başına Günlük Yem</div>
          <div class="kpi-val tx-blue">${F2(dailyCostPerHead)}</div>
          <div class="kpi-sub">${headCount} baş hayvan için</div>
        </div>
        <div class="kpi-card kpi-green">
          <div class="kpi-label">Toplam Depo Değeri</div>
          <div class="kpi-val tx-green">
            ${F(feeds.reduce((s, f) => s + (f.stockKg * f.costPerKg), 0))}
          </div>
          <div class="kpi-sub">${N(feeds.reduce((s, f) => s + f.stockKg, 0))} kg toplam stok</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Depodaki Yemler</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Yem Cinsi</th>
              <th class="text-right">Kalan Stok</th>
              <th class="text-right">Birim Fiyat</th>
              <th class="text-right">Günlük Tüketim</th>
              <th class="text-right">Kalan Süre</th>
              <th class="text-right">İşlemler</th>
            </tr>
          </thead>
          <tbody>
            ${feeds.map(f => {
              const daysLeft = f.dailyTotalKg > 0 ? Math.round(f.stockKg / f.dailyTotalKg) : 999;
              const bagCount = f.bagKg > 0 ? Math.round(f.stockKg / f.bagKg) : 0;
              return `
                <tr>
                  <td><b>${E(f.name)}</b></td>
                  <td class="text-right">
                    <b>${N(f.stockKg)} kg</b>
                    ${bagCount ? `<div style="font-size:11px; color:var(--mut)">~${bagCount} çuval</div>` : ''}
                  </td>
                  <td class="text-right">${F2(f.costPerKg)}/kg</td>
                  <td class="text-right">${f.dailyTotalKg} kg/gün</td>
                  <td class="text-right">
                    <span class="badge ${daysLeft <= 7 ? 'badge-r' : (daysLeft <= 15 ? 'badge-amber' : 'badge-g')}">
                      ${daysLeft > 365 ? '1+ yıl' : daysLeft + ' gün'}
                    </span>
                  </td>
                  <td class="text-right">
                    <button class="btn btn-secondary btn-sm" onclick="openFeedRestockModal(${f.id})">Yem Al</button>
                    <button class="btn btn-secondary btn-sm" onclick="editFeedItem(${f.id})">Düzenle</button>
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteFeedItem(${f.id})">Sil</button>
                  </td>
                </tr>
              `;
            }).join("") || '<tr><td colspan="6" class="text-center" style="padding:14px; color:var(--mut)">Yem tanımı bulunamadı.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ==========================================================================
   GÖRÜNÜM 7: DOĞUM & KOÇ KATIMI (KASAYA DOĞUM MASRAFI SEÇENEĞİ)
   ========================================================================== */

function viewReproduction() {
  const td = today();
  const pregnantSheep = S.a.filter(a => a.ins && a.st === "sürüde").map(a => {
    const expDate = addDays(a.ins, 150);
    const passedDays = daysBetween(a.ins, td);
    const remDays = daysBetween(td, expDate);
    const pct = Math.min(100, Math.max(0, Math.round((passedDays / 150) * 100)));
    return { ...a, expDate, passedDays, remDays, pct };
  }).sort((a, b) => a.remDays - b.remDays);

  const lambs = S.a.filter(a => (a.cat === "Kuzu" || a.origin === "Doğum") && a.b);
  const totalBorn = lambs.reduce((s, a) => s + (+a.n || 1), 0);
  const motherTags = new Set(lambs.map(a => a.m).filter(Boolean));
  const twinningRate = motherTags.size > 0 ? Math.round(((totalBorn - motherTags.size) / motherTags.size) * 100) : 0;

  return `
    <div class="card" style="border-top:4px solid var(--purple)">
      <div class="card-title">
        <span>🍼 Doğum & Döl Verimi İstatistikleri</span>
        <button class="btn btn-primary btn-sm" onclick="openBirthModal()">+ Kuzu Doğumu Kaydet</button>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card kpi-purple">
          <div class="kpi-label">Gebe Koyun Sayısı</div>
          <div class="kpi-val tx-purple">${pregnantSheep.length} Baş</div>
          <div class="kpi-sub">Koç katımı yapılmış</div>
        </div>
        <div class="kpi-card kpi-green">
          <div class="kpi-label">Doğan Kuzu Sayısı</div>
          <div class="kpi-val tx-green">${totalBorn} Baş</div>
          <div class="kpi-sub">${motherTags.size} anadan doğan</div>
        </div>
        <div class="kpi-card kpi-blue">
          <div class="kpi-label">Tahmini İkizlik Oranı</div>
          <div class="kpi-val tx-blue">%${twinningRate}</div>
          <div class="kpi-sub">Döl verim başarısı</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Gebe Koyunlar (150 Günlük Gebelik Takvimi)</div>
      ${pregnantSheep.map(p => {
        const isCritical = p.remDays <= 15;
        const isLate = p.remDays < 0;
        return `
          <div style="border:1px solid var(--ln); border-radius:var(--radius-sm); padding:10px; margin-bottom:8px; background:var(--card)">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px">
              <div>
                <b style="font-size:15px">🐑 ${E(p.k)}</b>
                <span class="badge ${isLate ? 'badge-r' : (isCritical ? 'badge-amber' : 'badge-b')}">
                  ${isLate ? 'GECİKTİ (' + Math.abs(p.remDays) + ' gün)' : (p.remDays === 0 ? 'Bugün Doğum!' : p.remDays + ' gün kaldı')}
                </span>
              </div>
              <button class="btn btn-primary btn-sm" onclick="openBirthModal(${p.id})">🍼 Doğum Yaptı / Kuzu Ekle</button>
            </div>

            <div style="font-size:12px; color:var(--tx-sec); margin:6px 0">
              Koç Katımı: <b>${p.ins}</b> (${p.passedDays}. gün) · Tahmini Doğum: <b>${p.expDate}</b>
            </div>

            <div style="background:var(--card-sub); border-radius:6px; height:8px; overflow:hidden; border:1px solid var(--ln)">
              <div style="width:${p.pct}%; height:100%; background:${isCritical ? 'var(--amber)' : 'var(--purple)'}; transition:width 0.3s"></div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--mut); margin-top:2px">
              <span>0. Gün (Katım)</span>
              <span>75. Gün (Orta)</span>
              <span>150. Gün (Doğum)</span>
            </div>
          </div>
        `;
      }).join("") || '<div style="padding:20px; text-align:center; color:var(--mut)">Şu anda koç katımı girilmiş gebe koyun bulunmuyor.</div>'}
    </div>
  `;
}

        ${inp("weightDate", "Tartı Tarihi", "date", td)}

    <!-- GOOGLE DRIVE'DAN ALINAN KUZU GELİŞİM & KARKAS RANDIMANI REFERANS CETVELİ -->
    <div class="card" style="border-top:4px solid var(--primary)">
      <div class="card-title">
        <span>📊 Erkek Kuzu Gelişim & Karkas Randımanı Referans Cetveli</span>
        <span class="badge badge-g">Doğumdan 2 Yaşına Kadar</span>
      </div>
      <div style="font-size:12px; color:var(--mut); margin-bottom:8px">
        Kuzularınızın kantar ağırlığını ve karkas et potansiyelini aşağıdaki ideal büyüme cetveliyle karşılaştırabilirsiniz:

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ay / Dönem</th>
              <th class="text-right">Hedef Canlı Kg</th>
              <th class="text-right">Karkas Randımanı</th>
              <th class="text-right">Kemikli Et</th>
              <th class="text-right">Net Kemiksiz Et</th>
              <th>Dönem Özellikleri</th>
            </tr>
          </thead>
          <tbody>
            ${LAMB_GROWTH_BENCHMARK.map(b => `
              <tr style="${b.month.includes('5. Ay') ? 'background:var(--primary-light); font-weight:700' : ''}">
                <td><b>${b.month}</b></td>
                <td class="text-right"><b class="tx-green">${b.weight} kg</b></td>
                <td class="text-right">${b.yield}</td>
                <td class="text-right">${b.meat}</td>
                <td class="text-right">${b.meat !== '-' ? (parseFloat(b.meat) * 0.77).toFixed(1) + ' kg' : '-'}</td>
                <td style="font-size:12px; color:var(--tx-sec)">${b.note}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Tartı Geçmişi -->
    <div class="card">
      <div class="card-title">Geçmiş Tartı Kayıtları</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Küpe No</th>
              <th>Tarih</th>
              <th class="text-right">Canlı Ağırlık</th>
              <th class="text-right">Günlük Artış (g/gün)</th>
              <th class="text-right">İşlem</th>
            </tr>
          </thead>
          <tbody>
            ${weighings.map(w => {
              const animal = S.a.find(a => a.id == w.an);
              const animalWeights = S.w.filter(x => x.an == w.an).sort((a, b) => a.d.localeCompare(b.d));
              const currentIdx = animalWeights.findIndex(x => x.id == w.id);
              let gainText = "—";
              if (currentIdx > 0) {
                const prev = animalWeights[currentIdx - 1];
                const d = daysBetween(prev.d, w.d);
                if (d > 0) {
                  const gain = Math.round(((w.kg - prev.kg) / d) * 1000);
                  gainText = `<b class="${gain >= 250 ? 'tx-green' : (gain > 0 ? 'tx-blue' : 'tx-red')}">${gain > 0 ? '+' : ''}${gain} g/gün</b>`;

              }

async function sendDataToCloudEndpoint(url, dataObj) {
  if (!url || !url.startsWith("http")) return;
  try {
    // text/plain ve no-cors ile gönderim Google Apps Script redirect sorununu aşar
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "save", data: dataObj })
    });
    setStatus("Veriler yerel hafızaya ve buluta kaydedildi.", "🟢 Canlı");
  } catch (e) {
    console.warn("Bulut gönderim uyarısı:", e);
    setStatus("Yerel hafızaya kaydedildi (Bulut beklemede).", "🟡 Yerel");
  }
}

async function runCloudDiagnostics() {
  const url = V("cfgEndpointUrl").trim();
  const resEl = $("cloudDiagResult");
  if (!resEl) return;
  resEl.style.display = "block";

  if (!url) {
    resEl.style.background = "var(--amber-light)";
    resEl.style.border = "1px solid var(--amber)";
    resEl.style.color = "var(--amber)";
    resEl.innerHTML = "<b>❌ URL Girilmedi:</b> Lütfen önce Google Apps Script Web App URL adresinizi yapıştırın.";
    return;
  }

  // 1. URL Format Kontrolü
  if (!url.startsWith("https://script.google.com/macros/s/")) {
    resEl.style.background = "var(--r-light)";
    resEl.style.border = "1px solid var(--r)";
    resEl.style.color = "var(--r)";
    resEl.innerHTML = "<b>❌ Hatalı Bağlantı Türü:</b> Girdiğiniz adres bir Google Apps Script Web Uygulaması bağlantısı değil. Adres <code>https://script.google.com/macros/s/...</code> ile başlamalıdır.";
    return;
  }

  if (url.includes("/edit") || url.includes("/dev")) {
    resEl.style.background = "var(--r-light)";
    resEl.style.border = "1px solid var(--r)";
    resEl.style.color = "var(--r)";
    resEl.innerHTML = "<b>❌ Düzenleme Linki Yapıştırılmış:</b> Girdiğiniz adres <code>/edit</code> ile bitiyor. Lütfen Google Apps Script editöründe <b>Dağıt (Deploy) > Dağıtımları Yönet > Web Uygulaması</b> altındaki <code>/exec</code> ile biten linki kopyalayın.";
    return;
  }

  resEl.style.background = "var(--b-light)";
  resEl.style.border = "1px solid var(--b)";
  resEl.style.color = "var(--b)";
  resEl.innerHTML = "⏳ Google bulut sunucusuna bağlanılıyor, lütfen 3-4 saniye bekleyin...";

  try {
    const testUrl = url + (url.includes("?") ? "&" : "?") + "action=get&_t=" + Date.now();
    const resp = await fetch(testUrl);
    const text = await resp.text();

    if (text.includes("<!DOCTYPE") || text.includes("<html") || text.includes("accounts.google.com")) {
      resEl.style.background = "var(--r-light)";
      resEl.style.border = "1px solid var(--r)";
      resEl.style.color = "var(--r)";
      resEl.innerHTML = `
        <b>❌ Yetki Hatası (Google Oturum Açma Engeli):</b><br>
        Google sunucusu veriyi herkese açık sunmuyor. Bu durum, dağıtım yaparken <b>'Erişimi Olanlar' (Who has access)</b> ayarını 'Herkes (Anyone)' seçmediğinizde olur.<br>
        <b>Çözüm:</b> script.google.com'da <i>Dağıt > Dağıtımları Yönet > Kalem (Düzenle) > Erişimi Olanlar: Herkes (Anyone)</i> olarak güncelleyin ve tekrar Dağıt'a basın.
      `;
      return;
    }

    let parsed = null;
    try {
      parsed = JSON.parse(text);
    } catch(e) {
      resEl.style.background = "var(--amber-light)";
      resEl.style.border = "1px solid var(--amber)";
      resEl.style.color = "var(--amber)";
      resEl.innerHTML = `<b>⚠️ Beklenmeyen Yanıt:</b> Google sunucusundan JSON yerine şu metin döndü: <pre style="font-size:10px">${E(text.slice(0, 200))}</pre>`;
      return;
    }

    if (parsed && parsed.success) {
      // Test başarılı, şimdi bir de deneme kaydı gönderelim
      await sendDataToCloudEndpoint(url, S);
      resEl.style.background = "var(--g-light)";
      resEl.style.border = "1px solid var(--g)";
      resEl.style.color = "var(--primary-tx)";
      resEl.innerHTML = `
        <b>🎉 BAĞLANTI TAMAMEN BAŞARILI!</b><br>
        ✓ Google Drive sunucunuza sorunsuz bağlanıldı.<br>
        ✓ Bulutta dosya doğrulandı (Buluttaki mevcut hayvan sayısı: ${parsed.data?.a?.length || 0} baş).<br>
        ✓ Bu cihazdaki mevcut veriler buluta eşitlendi.<br>
        <b>Şimdi Ne Yapacaksınız?</b> Aynı Webhook URL'sini telefonunuzdaki uygulamaya da yapıştırıp 'Kaydet'e basın. İki cihazınız da aynı bulut dosyasına bağlanmış olacaktır!
      `;
      if ($("cloudStatusBadge")) {
        $("cloudStatusBadge").textContent = "🟢 CANLI BULUT AKTİF";
        $("cloudStatusBadge").className = "badge badge-g";
      }
    } else {
      resEl.style.background = "var(--r-light)";
      resEl.style.border = "1px solid var(--r)";
      resEl.style.color = "var(--r)";
      resEl.innerHTML = `<b>❌ Sunucu Hatası:</b> Google script hata döndürdü: <code>${E(parsed?.error || 'Bilinmeyen hata')}</code>`;
    }
  } catch (err) {
    resEl.style.background = "var(--r-light)";
    resEl.style.border = "1px solid var(--r)";
    resEl.style.color = "var(--r)";
    resEl.innerHTML = `<b>❌ Ağ / CORS Bağlantı Hatası:</b> Google sunucusuna erişilemedi: ${E(err.message)}. Lütfen internet bağlantınızı ve URL'nin doğru olduğunu kontrol edin.`;
  }
}

async function manualForceSyncPull() {
  const url = S.cloudSync?.endpointUrl;
  if (!url) return alert("Önce Webhook URL'si tanımlanmalıdır.");
  try {
    setStatus("Buluttan veriler indiriliyor...", "⏳");
    const resp = await fetch(url + (url.includes("?") ? "&" : "?") + "action=get&_t=" + Date.now());
    const data = await resp.json();
    if (data && data.success && data.data && Array.isArray(data.data.a)) {
      mutate(() => {
        S = Object.assign({}, S, data.data);
      });
      alert(`Harika! Buluttan en güncel veriler çekildi. Toplam ${S.a.length} baş hayvan ve ${S.e.length} kasa kaydı eşitlendi.`);
    } else {
      alert("Bulutta henüz kayıtlı bir veri bulunamadı veya boş.");
    }
  } catch(e) {
    alert("Buluttan veri çekilirken hata oluştu: " + e.message);
  }
}

async function manualForceSyncPush() {
  const url = S.cloudSync?.endpointUrl;
  if (!url) return alert("Önce Webhook URL'si tanımlanmalıdır.");
  await sendDataToCloudEndpoint(url, S);
  alert("Mevcut verileriniz Google bulutuna başarıyla gönderildi!");
}

    <svg viewBox="0 0 100 100" width="130" height="130">
      <rect width="100" height="100" fill="#ffffff"/>
      <rect x="10" y="10" width="25" height="25" fill="#000000"/>

// 1. TOPLU SATIŞ SİHİRBAZI AKSİYONLARI (BULK SALE ACTIONS)
function toggleSaleAnimalRow(id, ev) {
  if (ev.target.type === "checkbox") return;
  toggleSaleAnimal(id);
}

function toggleSaleAnimal(id) {
  const anId = +id;
  if (SELECTED_ANIMALS.has(anId)) {

  } else {
    SELECTED_ANIMALS.add(anId);
  }
  const chk = $(`saleChk_${anId}`);
  if (chk) chk.checked = SELECTED_ANIMALS.has(anId);
  updateBulkSaleCalc();
  updateBulkBar();
}

function selectAllForSale() {
  S.a.filter(a => a.st === "sürüde").forEach(a => SELECTED_ANIMALS.add(a.id));
  updateBulkSaleTableChecks();
  updateBulkSaleCalc();
  updateBulkBar();
}

function selectCategoryForSale(cat) {
  S.a.filter(a => a.st === "sürüde" && (a.cat || "Koyun") === cat).forEach(a => SELECTED_ANIMALS.add(a.id));
  updateBulkSaleTableChecks();
  updateBulkSaleCalc();
  updateBulkBar();
}

function clearSaleSelection() {
  SELECTED_ANIMALS.clear();
  updateBulkSaleTableChecks();
  updateBulkSaleCalc();
  updateBulkBar();
}

function updateBulkSaleTableChecks() {
  document.querySelectorAll("#bulkSaleTableBody input[type='checkbox']").forEach(chk => {
    const id = +chk.id.replace("saleChk_", "");
    chk.checked = SELECTED_ANIMALS.has(id);
  });
}

function toggleBsPriceMode(mode) {
  if ($("bsModePerHead")) $("bsModePerHead").style.display = mode === "perHead" ? "grid" : "none";
  if ($("bsModeLump")) $("bsModeLump").style.display = mode === "lump" ? "grid" : "none";
  if ($("bsModeWeight")) $("bsModeWeight").style.display = mode === "weight" ? "grid" : "none";
  updateBulkSaleCalc();
}

function updateBulkSaleCalc() {
  const count = SELECTED_ANIMALS.size;
  if ($("saleSelectedCountBadge")) $("saleSelectedCountBadge").textContent = `${count} Baş Seçildi`;
  if ($("bsCountVal")) $("bsCountVal").textContent = `${count} Baş`;

  if (count === 0) {
    if ($("bsTotalVal")) $("bsTotalVal").textContent = "0 ₺";
    if ($("bsCostVal")) $("bsCostVal").textContent = "0 ₺";
    if ($("bsAvgPriceVal")) $("bsAvgPriceVal").textContent = "0 ₺/baş";
    if ($("bsNetProfitVal")) {
      $("bsNetProfitVal").textContent = "0 ₺";
      $("bsNetProfitVal").className = "";
    }
    return;
  }

  const modeEl = document.querySelector('input[name="bsPriceMode"]:checked');
  const mode = modeEl ? modeEl.value : "perHead";

  let totalRevenue = 0;
  if (mode === "perHead") {
    const p = +V("bsPricePerHead") || 0;
    totalRevenue = count * p;
  } else if (mode === "lump") {
    totalRevenue = +V("bsLumpTotal") || 0;
  } else if (mode === "weight") {
    const totKg = +V("bsTotalLiveKg") || 0;
    const pKg = +V("bsPricePerKg") || 0;
    totalRevenue = Math.round(totKg * pKg);
  }

  // Seçilen hayvanların toplam birikmiş maliyetini hesapla
  const costs = computeCosts();
  let totalCostOfSelected = 0;
  SELECTED_ANIMALS.forEach(id => {
    const c = costs.costMap[id];
    if (c) totalCostOfSelected += (c.totalCost || 0);
  });

  const netProfit = totalRevenue - totalCostOfSelected;
  const avgPrice = count > 0 ? Math.round(totalRevenue / count) : 0;
  const marginPct = totalRevenue > 0 ? Math.round((netProfit / totalRevenue) * 100) : 0;

  if ($("bsTotalVal")) $("bsTotalVal").textContent = F(totalRevenue);
  if ($("bsCostVal")) $("bsCostVal").textContent = F(totalCostOfSelected);
  if ($("bsAvgPriceVal")) $("bsAvgPriceVal").textContent = F(avgPrice) + "/baş";
  if ($("bsNetProfitVal")) {
    $("bsNetProfitVal").textContent = (netProfit >= 0 ? '+' : '') + F(netProfit) + ` (%${marginPct} Kâr)`;
    $("bsNetProfitVal").className = netProfit >= 0 ? 'tx-green' : 'tx-red';
  }
}

function executeBulkSale() {
  const count = SELECTED_ANIMALS.size;
  if (count === 0) {
    alert("Lütfen satmak istediğiniz hayvanları listeden işaretleyin.");
    return;
  }

  const d = V("bsSaleDate") || today();
  const buyer = V("bsSaleBuyer").trim();
  const cat = V("bsSaleCategory") || "Erkek kuzu satışı (canlı kg)";
  const recordIncome = $("bsRecordIncome")?.checked;

  const modeEl = document.querySelector('input[name="bsPriceMode"]:checked');
  const mode = modeEl ? modeEl.value : "perHead";

  let totalRevenue = 0;
  let totalLiveKg = 0;

  if (mode === "perHead") {
    const p = +V("bsPricePerHead") || 0;
    totalRevenue = count * p;
  } else if (mode === "lump") {
    totalRevenue = +V("bsLumpTotal") || 0;
  } else if (mode === "weight") {
    totalLiveKg = +V("bsTotalLiveKg") || 0;
    const pKg = +V("bsPricePerKg") || 0;
    totalRevenue = Math.round(totalLiveKg * pKg);
  }

  if (totalRevenue <= 0) {
    alert("Lütfen geçerli bir satış tutarı girin.");
    return;
  }

  const pricePerAnimal = Math.round(totalRevenue / count);
  const kgPerAnimal = totalLiveKg > 0 ? Math.round((totalLiveKg / count) * 10) / 10 : 0;

  mutate(() => {
    // 1. Seçilen hayvanları satıldı olarak işaretle
    SELECTED_ANIMALS.forEach(id => {
      const a = S.a.find(x => x.id === id);
      if (a) {
        a.st = "satıldı";
        a.sd = d;
        a.sp = pricePerAnimal;
        if (kgPerAnimal > 0) a.skg = kgPerAnimal;
      }
    });

    // 2. Kasaya gelir kaydet
    if (recordIncome) {
      S.e.unshift({
        id: Date.now(),
        d,
        c: cat,
        an: 0,
        ds: `${count} baş hayvan toplu satışı (${buyer ? buyer : 'Kasap'})`,
        q: count,
        kg: totalLiveKg,
        p: pricePerAnimal,
        a: totalRevenue
      });
    }

    SELECTED_ANIMALS.clear();
  });

  alert(`Tebrikler! ${count} baş hayvan toplu olarak satıldı ve kasaya ${F(totalRevenue)} gelir işlendi.`);
  switchTab(2); // Sürü listesine dön
}

function openBulkSaleModal() {
  switchTab(3);
  setTimeout(() => {
    const sec = $("bulkSaleSection");
    if (sec) sec.scrollIntoView({ behavior: "smooth" });
    updateBulkSaleTableChecks();
    updateBulkSaleCalc();
  }, 100);
}

  const modal = $("modalContent");
  modal.innerHTML = `

function executeBulkInsemination() {
  const d = V("mInsemDate") || today();

    SELECTED_ANIMALS.clear();

  closeModal();
  updateBulkBar();
  setStatus("Toplu koç katımı kaydedildi, gebelik takvimi güncellendi.");
}

function executeBulkDelete() {
  const count = SELECTED_ANIMALS.size;
  if (count === 0) return;
  if (confirm(`Seçilen ${count} baş hayvanı silmek istediğinize emin misiniz? (Tartı kayıtları da silinecektir)`)) {
    mutate(() => {
      SELECTED_ANIMALS.forEach(id => {
        S.a = S.a.filter(x => x.id !== id);
        S.w = S.w.filter(x => x.an !== id);
        S.e.forEach(x => { if (x.an === id) x.an = 0; });
      });
      SELECTED_ANIMALS.clear();
    });
    updateBulkBar();
    setStatus(`${count} baş hayvan silindi.`);
  }

function calcNewLoanModal() {
  const amt = +V("nLoanAmt") || 0;
  const rate = +V("nLoanRate") || 0;
  const months = +V("nLoanMonths") || 1;
  const r = rate / 1200;

  if (amt > 0 && months > 0) {
    const monthly = r ? (amt * r / (1 - Math.pow(1 + r, -months))) : (amt / months);
    const totalBack = monthly * months;
    const totalInt = totalBack - amt;
    const res = $("nLoanResult");
    if (res) {
      res.innerHTML = `
        <div>Aylık Eşit Taksit: <b class="tx-blue">${F(monthly)}</b></div>
        <div>Toplam Geri Ödeme: <b>${F(totalBack)}</b> · Toplam Faiz Yükü: <b class="tx-red">${F(totalInt)}</b></div>
      `;
    }
  }
}

function executeNewLoan() {
  const bank = V("nLoanBank").trim() || "Banka Kredisi";
  const amt = +V("nLoanAmt") || 0;
  const rate = +V("nLoanRate") || 0;
  const months = +V("nLoanMonths") || 1;
  const startDate = V("nLoanStartDate") || addDays(today(), 30);
  const addCash = $("nLoanAddCash")?.checked;
  const addTasks = $("nLoanAddTasks")?.checked;

  if (amt <= 0) {
    alert("Geçerli bir kredi tutarı girin.");
    return;
  }

  const r = rate / 1200;
  const monthly = r ? (amt * r / (1 - Math.pow(1 + r, -months))) : (amt / months);
  const totalPayment = monthly * months;
  const totalInterest = totalPayment - amt;

  const loanId = Date.now();

  mutate(() => {
    if (!S.loans) S.loans = [];
    S.loans.push({
      id: loanId,
      bank, amount: amt, rate, months, startDate,
      monthlyPayment: Math.round(monthly),
      totalPayment: Math.round(totalPayment),
      totalInterest: Math.round(totalInterest),
      status: "aktif"
    });

    if (addCash) {
      S.e.unshift({
        id: loanId + 1,
        d: today(),
        c: "Kredi çekildi",
        an: 0,
        ds: `${bank} ${months} ay vadeli kredi girişi`,
        q: 1, kg: 0, p: amt, a: amt
      });
    }

    if (addTasks) {
      for (let m = 0; m < months; m++) {
        const dueDate = addDays(startDate, m * 30);
        S.t.push({
          id: loanId + 100 + m,
          d: dueDate,
          c: "iş",
          t: `${bank} Kredi Taksiti (${m + 1}/${months}) - ${F(monthly)}`,
          r: 0,
          cost: Math.round(monthly),
          x: 0
        });
      }
    }
  });

  closeModal();
  setStatus("Kredi başarıyla kaydedildi ve taksit planı takvime eklendi.");
}

function deleteLoan(id) {
  if (confirm("Bu kredi kaydını silmek istediğinize emin misiniz?")) {
    mutate(() => {
      S.loans = S.loans.filter(x => x.id !== id);
    });
  }
}

// 8. TEKİL FORMLAR VE YARDIMCILAR (KASA, HAYVAN, DOĞUM, TARTI, YEM)
function saveLedgerEntry() {
  const idEl = $("editEntryId");
  const editId = idEl ? +idEl.value : 0;
  const d = V("entryDate") || today();
  const c = V("entryCat");
  const an = +V("entryAnimal") || 0;
  const ds = V("entryDesc").trim();
  const q = +V("entryQty") || 0;
  const kg = +V("entryKg") || 0;
  const p = +V("entryUnitPrice") || 0;
  const a = +V("entryAmount");

  if (!a || a <= 0) {
    alert("Lütfen geçerli bir tutar girin.");
    return;
  }

  const isCredit = (c === "Kredi çekildi" || kind(c) === "kredi+");

  mutate(() => {
    const record = { id: editId || Date.now(), d, c, an, ds, q, kg, p, a };
    if (editId) {
      S.e = S.e.map(x => x.id === editId ? record : x);
    } else {
      S.e.unshift(record);
    }

    // Eğer Kredi Çekildi ise ve taksit planlama açıksa S.loans ve takvime işle
    if (isCredit && !editId) {
      const bank = V("clBank").trim() || "Banka Kredisi";
      const rate = +V("clRate") || 0;
      const months = +V("clMonths") || 12;
      const autoPlan = $("clAutoPlan")?.checked;
      const r = rate / 1200;
      const monthly = r ? (a * r / (1 - Math.pow(1 + r, -months))) : (a / months);
      
      if (!S.loans) S.loans = [];
      const loanObj = {
        id: Date.now(),
        bank, amount: a, rate, months,
        startDate: addDays(d, 30),
        monthlyPayment: Math.round(monthly),
        totalPayment: Math.round(monthly * months),
        totalInterest: Math.round(monthly * months - a),
        status: "aktif"
      };
      S.loans.push(loanObj);

      if (autoPlan) {
        for (let m = 0; m < months; m++) {
          S.t.push({
            id: Date.now() + 500 + m,
            d: addDays(d, (m + 1) * 30),
            c: "iş",
            t: `${bank} Taksiti (${m + 1}/${months}) - ${F(monthly)}`,
            cost: Math.round(monthly),
            x: 0
          });
        }
      }
    }

    if (an && kind(c) === "gelir") {
      const h = S.a.find(x => x.id === an);
      if (h && h.st === "sürüde") {
        h.st = "satıldı";
        h.sd = d;
        h.sp = a;
      }
    }
  });

  setStatus("Kayıt kaydedildi.");
  cancelEditEntry();
}

function updateBuyWizardCalc() {

function toggleTagMode(mode) {
  if ($("tagModeSeq")) $("tagModeSeq").style.display = mode === "seq" ? "grid" : "none";
  if ($("tagModeManual")) $("tagModeManual").style.display = mode === "manual" ? "block" : "none";
  if ($("tagModeGroup")) $("tagModeGroup").style.display = mode === "group" ? "block" : "none";
}

function executeBuyWizard() {
  const d = V("wizBuyDate") || today();
  const cat = V("wizBuyCat");
  const sex = V("wizBuySex");
  const breed = V("wizBuyBreed");
  const vendor = V("wizBuyVendor").trim();
  const gId = +V("wizBuyGroup") || 0;
  const q = Math.max(1, +V("wizBuyQty") || 1);
  const p = +V("wizBuyPrice") || 0;
  const total = q * p;
  const recordExp = $("wizRecordExpense")?.checked;

  const modeEl = document.querySelector('input[name="wizTagMode"]:checked');
  const mode = modeEl ? modeEl.value : "seq";

  let createdAnimals = [];
  const startId = Date.now();

  if (mode === "seq") {
    const prefix = V("wizTagPrefix").trim() || "TR-51-";
    const startNum = +V("wizTagStart") || 1;
    for (let i = 0; i < q; i++) {
      createdAnimals.push({
        id: startId + i,
        k: `${prefix}${startNum + i}`,
        s: sex,
        cat,
        breed,
        origin: "Satın Alma",
        vendor,
        bp: p,
        bd: d,
        st: "sürüde",
        n: 1,
        grp: gId ? [gId] : []
      });
    }
  } else if (mode === "manual") {
    const raw = V("wizManualTags");
    const tags = raw.split(/[\r\n,;]+/).map(s => s.trim()).filter(Boolean);
    if (tags.length === 0) {
      alert("Lütfen en az bir küpe numarası girin.");
      return;
    }
    tags.forEach((tag, idx) => {
      createdAnimals.push({
        id: startId + idx,
        k: tag,
        s: sex,
        cat,
        breed,
        origin: "Satın Alma",
        vendor,
        bp: p,
        bd: d,
        st: "sürüde",
        n: 1,
        grp: gId ? [gId] : []
      });
    });
  } else {
    createdAnimals.push({
      id: startId,
      k: `${d} ${breed} ${cat} Grubu (${q} Baş)`,
      s: sex,
      cat,
      breed,
      origin: "Satın Alma",
      vendor,
      bp: p,
      bd: d,
      st: "sürüde",
      n: q,
      grp: gId ? [gId] : []
    });
  }

  mutate(() => {
    S.a = createdAnimals.concat(S.a);
    if (recordExp && total > 0) {
      S.e.unshift({
        id: startId + 999,
        d,
        c: "Hayvan alımı",
        an: createdAnimals.length === 1 ? createdAnimals[0].id : 0,
        ds: `${q} adet ${breed} ${cat} alımı (${vendor ? vendor : 'Satın alma'})`,
        q, kg: 0, p, a: total
      });
    }
  });

  alert(`Tebrikler! ${createdAnimals.length} baş hayvan başarıyla sürüye eklendi ve tane başı ${F(p)} alış maliyetiyle kaydedildi.`);
  switchTab(2);
}

function executeBirthRecord() {
  const mId = +V("bmMother");

  const addExp = $("bmAddExp")?.checked;

    const tag = (V(`lambTag_${i}`) || `KUZU-${p2(i)}`).trim();

    if (kg > 0) {

  mutate(() => {
    S.a = createdLambs.concat(S.a);

    if (addExp && expAmt > 0) {
      S.e.unshift({
        id: Date.now() + 50,

        ds: `${motherTag} doğum müdahale masrafı (${count} kuzu)`,
        q: 1, kg: 0, p: expAmt, a: expAmt
      });
    }
  });

  closeModal();
  alert(`${createdLambs.length} kuzu başarıyla sürüye eklendi!`);
}

async function downloadFile(filename, content, mimeType) {
  let m = null;
  try { m = await window.claude?.use("downloads"); } catch (e) {}
  if (m) {
    try { await m.save({ filename, data: content }); return; } catch (e) {}
  }
  try {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    setStatus("Dosya indirildi: " + filename);
  } catch (err) { alert("Dosya indirilemedi."); }
}

    const doc = document.documentElement;
    const current = doc.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    doc.setAttribute("data-theme", next);
    try { localStorage.setItem("koyun-theme", next); } catch (e) {}
  });

  try {
    const savedTheme = localStorage.getItem("koyun-theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  } catch (e) {}

  $("btnUndo")?.addEventListener("click", () => {
    if (HIST.length) {
      S = JSON.parse(HIST.pop());
      save();
      renderApp();
      setStatus("Son işlem geri alındı.");
    } else {
      setStatus("Geri alınacak işlem bulunmuyor.");
    }
  });

  $("btnQuickAdd")?.addEventListener("click", () => {
    switchTab(1);
    setTimeout(() => {
      const el = $("entryDesc");
      if (el) el.focus();
    }, 100);
  });

  $("drawerNav")?.addEventListener("click", e => {
    const item = e.target.closest(".drawer-item");
    if (item && item.dataset.tab !== undefined) {
      switchTab(+item.dataset.tab);
    }
  });

  $("bottomNav")?.addEventListener("click", e => {
    const btn = e.target.closest(".bnav-item[data-t]");
    if (btn && btn.dataset.t !== undefined) {
      switchTab(+btn.dataset.t);
    }
  });

  document.addEventListener("change", e => {
    const target = e.target;
    if (target.id === "dashFM" || target.id === "dashFY") {
      FM = +V("dashFM") || 0;
      FY = +V("dashFY") || 0;
      renderApp();
    }
    if (target.id === "flockStatusFilter") {
      AF = target.value;
      renderApp();
    }
    if (target.id === "flockCatFilter") {
      ACAT = target.value;
      renderApp();
    }
    if (target.id === "flockGroupFilter") {
      AGRP = +target.value;
      renderApp();
    }
    if (target.id === "ledgerCatFilter") {
      ECAT = target.value;
      renderApp();
    }
  });

  document.addEventListener("input", e => {
    const target = e.target;
    if (target.id === "flockSearch") {
      ASEARCH = target.value;
      if (T === 2) renderApp();
    }
    if (target.id === "ledgerSearch") {
      ESEARCH = target.value;
      if (T === 1) renderApp();
    }
    if (["entryQty", "entryKg", "entryUnitPrice"].includes(target.id)) {
      const p = +V("entryUnitPrice") || 0;
      const q = +V("entryQty") || 0;
      const kg = +V("entryKg") || 0;
      if (p > 0) {
        const mul = kg > 0 ? kg : (q > 0 ? q : 1);
        const amtInput = $("entryAmount");
        if (amtInput) {
          amtInput.value = Math.round(mul * p);
          calcCreditForm();
        }
      }
    }
  });
}

function renderApp() {
  updateHeaderStatus();
  const views = [
    viewDashboard, viewLedger, viewFlock, viewBuySell, viewGroups,
    viewFeeds, viewHealth, viewReproduction, viewWeights, viewReports,
    viewCloudSync, viewSettings
  ];
  const mainEl = $("main");
  if (mainEl && views[T]) {
    mainEl.innerHTML = views[T]();
  }
  updateBulkBar();
}

init();
</script>
</body>
</html>
